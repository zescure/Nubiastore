<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Info Akun — NUBIASTORE</title>
<style>
  /* sederhana, mobile-first, matching NUBIASTORE feel */
  body{font-family:Inter,Segoe UI,system-ui;background:#f6f7f9;color:#111;margin:0;padding:12px}
  .card{max-width:720px;margin:12px auto;background:#fff;border-radius:10px;padding:14px;box-shadow:0 8px 20px rgba(0,0,0,0.06)}
  header{display:flex;align-items:center;gap:12px}
  .avatar{width:56px;height:56px;border-radius:999px;background:#eee;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#111}
  h2{margin:0;color:#16a34a}
  .muted{color:#666;font-size:.95rem}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
  .col{flex:1;min-width:200px}
  .saldo{font-size:1.4rem;font-weight:800;color:#0f172a}
  .btn{display:inline-block;padding:.5rem .9rem;border-radius:8px;background:#16a34a;color:#fff;text-decoration:none;cursor:pointer}
  .btn.secondary{background:#111}
  .tx-list{margin-top:12px}
  .tx{padding:10px;border-bottom:1px solid #f1f1f1;display:flex;justify-content:space-between}
  .tx .left{display:flex;flex-direction:column}
  .tx .amount{font-weight:700}
  .small{font-size:.85rem;color:#666}
  .center{display:flex;gap:8px;align-items:center}
  .hint{background:#fff7ed;padding:8px;border-left:4px solid #f59e0b;color:#92400e;margin-top:12px;border-radius:6px}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="card" id="mainCard">
    <header>
      <div class="avatar" id="avatar">--</div>
      <div>
        <h2 id="nickname">—</h2>
        <div class="muted" id="emailLine">—</div>
      </div>
      <div style="margin-left:auto;text-align:right">
        <div class="muted">UID</div>
        <div class="small" id="uidLine">—</div>
      </div>
    </header>

    <div class="row">
      <div class="col">
        <div class="muted">Saldo NUBIAPAY</div>
        <div class="saldo" id="balance">Rp 0</div>
        <div style="margin-top:8px">
          <a id="btnDeposit" class="btn" href="#" target="_blank">Deposit</a>
          <button id="btnHistory" class="btn secondary">Histori</button>
        </div>
        <div class="hint">NubiPay: e-wallet internal untuk beli diamond & produk. Admin bisa adjust saldo di panel admin.</div>
      </div>

      <div class="col">
        <div class="muted">Data Akun</div>
        <div class="small" id="regInfo">—</div>
        <div style="margin-top:12px">
          <button id="btnSignOut" class="btn secondary">Keluar Akun</button>
        </div>
      </div>
    </div>

    <div style="margin-top:14px">
      <div class="muted">Histori Transaksi (terbaru)</div>
      <div id="txContainer" class="tx-list">
        <div class="small muted">Memuat...</div>
      </div>
    </div>
  </div>

  <!-- popup simple untuk histori lengkap (modal-like) -->
  <div id="modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;justify-content:center;padding:12px;">
    <div style="width:100%;max-width:720px;background:#fff;border-radius:12px;padding:12px;max-height:80vh;overflow:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <b>Histori Lengkap</b>
        <button id="closeModal" class="btn secondary">Tutup</button>
      </div>
      <div id="modalList" style="margin-top:12px"></div>
    </div>
  </div>

<script type="module">
/* ===== Firebase init (samakan dgn project lo) ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp,
  collection, addDoc, query, orderBy, limit, getDocs,
  runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3KhNSK0AaKYvXuZE9hi0ZRN9Ysmh9aXc",
  authDomain: "zestoreid-f9e85.firebaseapp.com",
  projectId: "zestoreid-f9e85",
  storageBucket: "zestoreid-f9e85.firebasestorage.app",
  messagingSenderId: "426093692154",
  appId: "1:426093692154:web:38c6e9c143af626a623543",
  measurementId: "G-TS0YB9NYW8"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ====== UI refs ====== */
const avatarEl = document.getElementById('avatar');
const nicknameEl = document.getElementById('nickname');
const emailEl = document.getElementById('emailLine');
const uidEl = document.getElementById('uidLine');
const balanceEl = document.getElementById('balance');
const regInfoEl = document.getElementById('regInfo');
const txContainer = document.getElementById('txContainer');
const modal = document.getElementById('modal');
const modalList = document.getElementById('modalList');
const btnDeposit = document.getElementById('btnDeposit');
const btnHistory = document.getElementById('btnHistory');
const btnSignOut = document.getElementById('btnSignOut');
const closeModal = document.getElementById('closeModal');

let currentUid = null;

/* ====== helper: format rupiah ====== */
function fmtRp(n){ return typeof n === 'number' ? 'Rp ' + n.toLocaleString('id') : 'Rp 0'; }
function fmtDate(ts){
  if(!ts) return '-';
  if(ts.toDate) return new Date(ts.toDate()).toLocaleString();
  if(ts.seconds) return new Date(ts.seconds*1000).toLocaleString();
  return new Date(ts).toLocaleString();
}

/* ====== auto-create user doc on first login ====== */
async function ensureUserDoc(user) {
  const uref = doc(db, 'users', user.uid);
  const snap = await getDoc(uref);
  if (!snap.exists()) {
    const payload = {
      displayName: user.displayName || (user.email? user.email.split('@')[0] : 'User'),
      email: user.email || '',
      photoURL: user.photoURL || '',
      nickname: user.displayName || (user.email? user.email.split('@')[0] : 'User'),
      createdAt: serverTimestamp(),
      nubiPayBalance: 0,
      role: 'user'
    };
    await setDoc(uref, payload);
    // optional: create initial transaction record (welcome)
    const txCol = collection(db, 'users', user.uid, 'transactions');
    await addDoc(txCol, {
      amount: 0,
      type: 'created_account',
      note: 'Selamat datang di NUBIASTORE',
      timestamp: serverTimestamp()
    });
  }
  return uref;
}

/* ====== load user profile & show ====== */
async function loadProfile(uid) {
  const uref = doc(db, 'users', uid);
  const snap = await getDoc(uref);
  if(!snap.exists()) return;
  const d = snap.data();
  nicknameEl.textContent = d.nickname || d.displayName || 'User';
  emailEl.textContent = d.email || '-';
  uidEl.textContent = uid;
  avatarEl.textContent = (d.nickname || d.displayName || 'U').slice(0,1).toUpperCase();
  balanceEl.textContent = fmtRp(d.nubiPayBalance || 0);
  regInfoEl.innerHTML = `Terdaftar: ${fmtDate(d.createdAt)}<br>Role: ${d.role || 'user'}`;
}

/* ====== load last N transaksi untuk ringkasan ====== */
async function loadRecentTx(uid, limitCount = 10) {
  const txCol = collection(db, 'users', uid, 'transactions');
  const q = query(txCol, orderBy('timestamp','desc'), limit(limitCount));
  const snap = await getDocs(q);
  const list = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  // render ringkasan di halaman
  txContainer.innerHTML = '';
  if(list.length === 0){
    txContainer.innerHTML = '<div class="small muted">Belum ada transaksi</div>';
    return;
  }
  list.forEach(t=>{
    const el = document.createElement('div');
    el.className = 'tx';
    const left = document.createElement('div'); left.className='left';
    left.innerHTML = `<div class="small">${t.type.replace('_',' ')}</div><div class="small">${fmtDate(t.timestamp)}</div>`;
    const right = document.createElement('div');
    right.innerHTML = `<div class="amount">${t.amount>0?'+ ':'- '}${fmtRp(Math.abs(t.amount))}</div><div class="small">${t.note||''}</div>`;
    el.appendChild(left); el.appendChild(right);
    txContainer.appendChild(el);
  });
}

/* ====== load all transaksi (modal) ====== */
async function loadAllTx(uid, limitCount = 50) {
  modalList.innerHTML = '<div class="small muted">Memuat...</div>';
  const txCol = collection(db, 'users', uid, 'transactions');
  const q = query(txCol, orderBy('timestamp','desc'), limit(limitCount));
  const snap = await getDocs(q);
  const list = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  if(list.length === 0){
    modalList.innerHTML = '<div class="small muted">Belum ada transaksi</div>';
    return;
  }
  modalList.innerHTML = '';
  list.forEach(t => {
    const d = document.createElement('div');
    d.className = 'tx';
    const l = document.createElement('div'); l.className='left';
    l.innerHTML = `<div class="small">${t.type}</div><div class="small">${fmtDate(t.timestamp)}</div><div class="small muted">${t.note||''}</div>`;
    const r = document.createElement('div'); r.innerHTML = `<div class="amount">${t.amount>0?'+ ':'- '}${fmtRp(Math.abs(t.amount))}</div>`;
    d.appendChild(l); d.appendChild(r);
    modalList.appendChild(d);
  });
}

/* ====== atomic add transaction + update balance ====== */
async function addTransactionAndChangeBalance(uid, amount, type='topup', note='') {
  const userRef = doc(db, 'users', uid);
  const txCol = collection(db, 'users', uid, 'transactions');
  await runTransaction(db, async (t) => {
    const userSnap = await t.get(userRef);
    if (!userSnap.exists()) throw new Error('User not found');
    const current = Number(userSnap.data().nubiPayBalance || 0);
    const newBal = current + Number(amount);
    if (newBal < 0) throw new Error('Saldo tidak cukup');
    // create tx doc (auto-id)
    const newTxRef = (await addDoc(txCol, {
      amount: Number(amount),
      type,
      note,
      timestamp: serverTimestamp()
    }));
    // update user balance
    t.update(userRef, { nubiPayBalance: newBal });
  });
}

/* ====== UI events ====== */
btnHistory.addEventListener('click', async ()=>{
  if(!currentUid) return alert('Login dulu');
  await loadAllTx(currentUid, 50);
  modal.classList.remove('hidden');
});
closeModal.addEventListener('click', ()=> modal.classList.add('hidden'));
btnSignOut.addEventListener('click', ()=> signOut(auth));
btnDeposit.addEventListener('click', ()=>{
  // contoh: arahkan ke halaman deposit eksternal (lo ganti linknya)
  window.open('/deposit', '_blank');
});

/* ====== auth listener ====== */
onAuthStateChanged(auth, async (user) => {
  if(!user){
    // not logged in -> show prompt / redirect to login
    nicknameEl.textContent = 'Silakan login';
    emailEl.textContent = '-';
    uidEl.textContent = '-';
    balanceEl.textContent = fmtRp(0);
    txContainer.innerHTML = '<div class="small muted">Login dulu untuk lihat info akun</div>';
    currentUid = null;
    return;
  }
  currentUid = user.uid;
  try {
    // ensure user doc exists (auto-create)
    await ensureUserDoc(user);
    // then load profile + recent tx
    await loadProfile(user.uid);
    await loadRecentTx(user.uid, 10);
  } catch(e){
    console.error('init error', e);
    alert('Error inisialisasi akun: ' + (e.message||e));
  }
});
</script>
</body>
</html>
