<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Info Akun — NUBIASTORE</title>
<style>
  body{font-family:Inter,Segoe UI,system-ui;background:#f6f7f9;color:#111;padding:12px}
  .card{background:#fff;border-radius:8px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,0.06);max-width:900px;margin:12px auto}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .col{flex:1;min-width:220px}
  .avatar{width:64px;height:64px;border-radius:50%;object-fit:cover}
  .muted{color:#666;font-size:.95rem}
  .amount{font-weight:800;font-size:1.3rem;color:#0f172a}
  .btn{padding:.55rem 1rem;border-radius:6px;background:#16a34a;color:#fff;border:none;cursor:pointer}
  .btn.grey{background:#111;color:#fff}
  .small{font-size:.85rem;color:#666}
  .field{margin:.6rem 0}
  .input,textarea,select{width:100%;padding:.6rem;border-radius:6px;border:1px solid #e5e7eb}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:.95rem}
  .admin-panel{border-left:4px solid #16a34a;padding:10px;margin-top:12px;background:#f8fff8}
  .hide{display:none}
</style>
</head>
<body>

  <div class="card" id="profileCard">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div style="display:flex;gap:12px;align-items:center">
        <img id="avatar" class="avatar" src="https://i.pravatar.cc/64" alt="avatar">
        <div>
          <div id="displayName" style="font-weight:700">-</div>
          <div class="muted" id="email">-</div>
          <div class="small">UID: <span id="uidTxt">-</span></div>
        </div>
      </div>
      <div style="text-align:right">
        <button id="btnSignOut" class="btn grey">Keluar</button>
      </div>
    </div>

    <hr style="margin:12px 0">

    <div class="row">
      <div class="col">
        <div class="field"><div class="muted">Saldo NUBIAPAY</div>
          <div class="amount" id="nubiPayBalance">Rp 0</div>
        </div>

        <div class="field">
          <div class="muted">Aksi Deposit</div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn depositBtn" data-amt="10000">Deposit Rp 10.000</button>
            <button class="btn depositBtn" data-amt="20000">Deposit Rp 20.000</button>
            <button class="btn depositBtn" data-amt="50000">Deposit Rp 50.000</button>
          </div>
          <div class="small" style="margin-top:8px">Deposit akan membuat order & diteruskan ke halaman checkout untuk bayar.</div>
        </div>

        <div id="adminBadge" class="small muted" style="margin-top:8px"></div>
      </div>

      <div class="col">
        <div class="field"><div class="muted">Histori Transaksi (recent)</div>
          <div id="txList" class="small muted">Memuat...</div>
        </div>
      </div>
    </div>

    <!-- Admin adjust panel (hanya tampil kalau admin) -->
    <div id="adminPanel" class="admin-panel hide">
      <strong>Admin — Adjust Saldo</strong>
      <div class="small muted">Hanya admin yang melihat ini. Gunakan dengan hati-hati.</div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <input id="adminTargetUid" class="input" placeholder="Target UID (contoh: 8z9...)" />
        <input id="adminDelta" class="input" placeholder="Jumlah (+ untuk tambah / - untuk kurangi, contoh: 10000)" />
        <input id="adminNote" class="input" placeholder="Catatan / reason" />
        <button id="btnAdminAdjust" class="btn">Apply</button>
      </div>
      <div id="adminMsg" class="small muted" style="margin-top:8px"></div>
    </div>

  </div>

<script type="module">
/* ===== Firebase Config ===== */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp,
  collection, query, orderBy, limit, onSnapshot, addDoc,
  runTransaction
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA3KhNSK0AaKYvXuZE9hi0ZRN9Ysmh9aXc",
  authDomain: "zestoreid-f9e85.firebaseapp.com",
  projectId: "zestoreid-f9e85",
  storageBucket: "zestoreid-f9e85.firebasestorage.app",
  messagingSenderId: "426093692154",
  appId: "1:426093692154:web:38c6e9c143af626a623543"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ===== CONFIG: admin allowlist fallback (optional) =====
   Kita prioritaskan admin/meta doc di firestore; kalau nggak ada, bisa isi di array ini. 
   NOTE: hardcoded UID di client = convenience dev only (not secure).
*/
const ADMIN_UIDS_FALLBACK = [
  // "8z9b0u1LYfTVM0sCP7qHXbYHvGi1"
];

/* ===== UI refs ===== */
const avatar = document.getElementById('avatar');
const displayNameEl = document.getElementById('displayName');
const emailEl = document.getElementById('email');
const uidTxt = document.getElementById('uidTxt');
const nubiPayBalanceEl = document.getElementById('nubiPayBalance');
const txList = document.getElementById('txList');
const depositBtns = document.querySelectorAll('.depositBtn');
const adminPanel = document.getElementById('adminPanel');
const adminBadge = document.getElementById('adminBadge');
const adminTargetUid = document.getElementById('adminTargetUid');
const adminDelta = document.getElementById('adminDelta');
const adminNote = document.getElementById('adminNote');
const btnAdminAdjust = document.getElementById('btnAdminAdjust');
const adminMsg = document.getElementById('adminMsg');
const btnSignOut = document.getElementById('btnSignOut');

let currentUser = null;
let unsubscribeTx = null;
let isAdmin = false;

/* ===== UTILS ===== */
function fmtRp(n){ return typeof n === 'number' ? 'Rp ' + n.toLocaleString('id') : 'Rp ' + String(n); }
function shortUid(u){ return u ? u.slice(0,6)+'...' + u.slice(-4) : '-' }

/* ===== AUTH FLOW ===== */
onAuthStateChanged(auth, async (u) => {
  currentUser = u;
  if(!u){
    // redirect ke login/register page bila perlu
    displayNameEl.textContent = '-';
    emailEl.textContent = '-';
    uidTxt.textContent = '-';
    nubiPayBalanceEl.textContent = 'Rp 0';
    txList.textContent = 'Silakan login terlebih dulu.';
    adminPanel.classList.add('hide');
    adminBadge.textContent = '';
    return;
  }

  uidTxt.textContent = u.uid;
  displayNameEl.textContent = u.displayName || 'User';
  emailEl.textContent = u.email || '-';
  avatar.src = u.photoURL || `https://i.pravatar.cc/64?u=${u.uid}`;

  // ensure user doc exists (auto-create) — merge true
  const userRef = doc(db, 'users', u.uid);
  try{
    await setDoc(userRef, {
      displayName: u.displayName || '',
      email: u.email || '',
      createdAt: serverTimestamp(),
      nubiPayBalance: (await getDoc(userRef)).exists() ? (await getDoc(userRef)).data().nubiPayBalance || 0 : 0
    }, { merge: true });
  }catch(e){
    console.error('set user doc err', e);
  }

  // check admin: read admin/meta doc (map uids) OR fallback array
  isAdmin = false;
  try{
    const metaRef = doc(db, 'admin', 'meta');
    const metaSnap = await getDoc(metaRef);
    if(metaSnap.exists()){
      const data = metaSnap.data();
      if(data && data.uids && data.uids[u.uid] === true) isAdmin = true;
    } else {
      if(ADMIN_UIDS_FALLBACK.includes(u.uid)) isAdmin = true;
    }
  }catch(e){
    console.warn('cek admin meta err', e);
    if(ADMIN_UIDS_FALLBACK.includes(u.uid)) isAdmin = true;
  }

  adminPanel.classList.toggle('hide', !isAdmin);
  adminBadge.textContent = isAdmin ? 'Anda login sebagai ADMIN' : '';

  // load user info + transactions listener
  subscribeUserProfile(u.uid);
  subscribeTransactions(u.uid);
});

/* ===== LOAD & LISTEN user profile n balance ===== */
async function subscribeUserProfile(uid){
  const ref = doc(db, 'users', uid);
  // realtime not strictly needed but simple get
  const snap = await getDoc(ref);
  if(snap.exists()){
    const data = snap.data();
    nubiPayBalanceEl.textContent = fmtRp(data.nubiPayBalance || 0);
  }else{
    nubiPayBalanceEl.textContent = fmtRp(0);
  }
  // also attach onSnapshot to update balance realtime
  // reuse onSnapshot if you want (lightweight)
  // optional: if already subscribed, skip
  // simple: use onSnapshot for balance
  const unsub = onSnapshot(ref, s=>{
    if(s.exists()) nubiPayBalanceEl.textContent = fmtRp(s.data().nubiPayBalance || 0);
    else nubiPayBalanceEl.textContent = fmtRp(0);
  }, e=> console.warn('profile snapshot err', e));
  // note: not stored to unsubscribe in this simple page
}

/* ===== TRANSACTIONS LIST (recent 50) ===== */
function subscribeTransactions(uid){
  if(unsubscribeTx) unsubscribeTx();
  const colRef = collection(db, `users/${uid}/transactions`);
  const q = query(colRef, orderBy('timestamp','desc'), limit(50));
  unsubscribeTx = onSnapshot(q, (snap)=>{
    if(snap.empty){ txList.innerHTML = '<div class="small muted">Belum ada transaksi</div>'; return;}
    const rows = [];
    snap.forEach(docSnap=>{
      const d = docSnap.data();
      const when = d.timestamp ? (d.timestamp.toDate ? d.timestamp.toDate().toLocaleString() : new Date(d.timestamp.seconds*1000).toLocaleString()) : '-';
      rows.push(`<div style="padding:6px 0;border-bottom:1px solid #eee">
        <div style="display:flex;justify-content:space-between"><div><strong>${d.type||'tx'}</strong> ${d.note?'- '+d.note:''}</div><div class="small muted">${when}</div></div>
        <div class="small">${d.amount ? fmtRp(d.amount) : '-' } ${d.adminUid ? ' • by admin' : ''}</div>
      </div>`);
    });
    txList.innerHTML = rows.join('');
  }, e=>{
    console.error('tx snapshot err', e);
    txList.textContent = 'Gagal memuat histori';
  });
}

/* ===== DEPOSIT: buat order deposit & redirect ke checkout (sama seperti flow topup) ===== */
async function createDepositOrder(amount, payMethod='QRIS'){
  if(!currentUser) return alert('Silakan login terlebih dulu.');
  const invoice = `INVC-NP-${Date.now()}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
  const orderRef = doc(db, 'orders', invoice);
  const payload = {
    invoice,
    userId: currentUser.uid,
    game: 'nubi-pay',
    game_id: 'DEPOSIT',
    server: '',
    noWA: currentUser.phoneNumber || '',
    nominalValue: amount,
    price: amount,
    adminFee: 0,
    amount_total: amount, // no fee in popup — admin tanggung
    payment_method: payMethod,
    isDeposit: true,
    status: 'initiated',
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  };
  try{
    await setDoc(orderRef, payload);
    // redirect to checkout (global checkout already handles order)
    location.href = `/checkout?invoice=${invoice}`;
  }catch(e){
    console.error('create deposit order err', e);
    alert('Gagal membuat order deposit. Coba lagi.');
  }
}

/* ===== ADMIN: adjust balance (manual) ===== */
btnAdminAdjust.addEventListener('click', async ()=>{
  if(!isAdmin) return alert('Hanya admin.');
  const target = (adminTargetUid.value||'').trim();
  const deltaRaw = (adminDelta.value||'').trim();
  const note = (adminNote.value||'').trim() || 'admin adjust';
  if(!target) return alert('Masukkan UID target.');
  if(!deltaRaw) return alert('Masukkan jumlah (positif atau negatif).');
  const delta = Number(deltaRaw);
  if(isNaN(delta)) return alert('Jumlah harus angka.');
  adminMsg.textContent = 'Memproses...'; btnAdminAdjust.disabled = true;
  try{
    const userRef = doc(db, 'users', target);
    await runTransaction(db, async (t) => {
      const uSnap = await t.get(userRef);
      if(!uSnap.exists()){
        // create user doc minimal
        t.set(userRef, { createdAt: serverTimestamp(), nubiPayBalance: 0 }, { merge: true });
      }
      const cur = (uSnap.exists() && (uSnap.data().nubiPayBalance||0)) || 0;
      const next = cur + delta;
      t.update(userRef, { nubiPayBalance: next, updatedAt: serverTimestamp() });

      // write transaction log
      const txRef = doc(collection(db, `users/${target}/transactions`)); // auto id
      t.set(txRef, {
        amount: delta,
        type: 'admin_adjust',
        note,
        adminUid: currentUser.uid,
        timestamp: serverTimestamp()
      });
    });
    adminMsg.textContent = `Sukses. Saldo user ${shortUid(target)} di-adjust ${fmtRp(delta)}.`;
  }catch(e){
    console.error('admin adjust err', e);
    adminMsg.textContent = 'Gagal adjust: ' + (e.message||e);
  } finally {
    btnAdminAdjust.disabled = false;
  }
});

/* ===== deposit btns event ===== */
depositBtns.forEach(b=>{
  b.addEventListener('click', (ev)=>{
    const amt = Number(ev.currentTarget.dataset.amt || 0);
    // optional: choose pay method or default QRIS
    if(!confirm('Buat order deposit Rp '+amt.toLocaleString()+'? Lanjut ke checkout.')) return;
    createDepositOrder(amt, 'QRIS');
  });
});

/* ===== sign out ===== */
btnSignOut.addEventListener('click', ()=> signOut(auth));

</script>
</body>
</html>
