<!doctype html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin — NUBIASTORE</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Inter,system-ui,sans-serif;background:#f0f2f5;color:#111;min-height:100vh}

/* ── TOPBAR ── */
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-badge{background:#16a34a;color:#fff;font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:4px;text-transform:uppercase}
.topbar-title{font-size:15px;font-weight:700;color:#111}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn-signout{background:none;border:1px solid #e5e7eb;color:#555;font-size:13px;padding:6px 14px;border-radius:6px;cursor:pointer;transition:all .15s}
.btn-signout:hover{background:#f8f8f8;border-color:#ccc}

/* ── MAIN ── */
.main{max-width:900px;margin:0 auto;padding:20px 16px 60px}

/* ── CARD ── */
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title::before{content:’’;display:inline-block;width:3px;height:14px;background:#16a34a;border-radius:2px}

/* ── TOOLBAR ── */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search-input{flex:1;min-width:200px;padding:8px 12px;border:1px solid #e5e7eb;border-radius:7px;font-size:13px;outline:none;transition:border-color .15s}
.search-input:focus{border-color:#16a34a}
.filter-select{padding:8px 10px;border:1px solid #e5e7eb;border-radius:7px;font-size:13px;outline:none;background:#fff;cursor:pointer}
.filter-select:focus{border-color:#16a34a}

/* ── LIMIT TOGGLE ── */
.limit-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.limit-info{font-size:12px;color:#6b7280}
.btn-more{background:none;border:1px solid #16a34a;color:#16a34a;font-size:12px;font-weight:600;padding:5px 14px;border-radius:6px;cursor:pointer;transition:all .15s}
.btn-more:hover{background:#16a34a;color:#fff}
.btn-less{background:none;border:1px solid #6b7280;color:#6b7280;font-size:12px;font-weight:600;padding:5px 14px;border-radius:6px;cursor:pointer;transition:all .15s}
.btn-less:hover{background:#6b7280;color:#fff}

/* ── ORDER CARD ── */
.order-card{border:1px solid #e5e7eb;border-radius:8px;margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}
.order-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.order-card-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:#fafafa;border-bottom:1px solid #e5e7eb;cursor:pointer;user-select:none}
.order-card-head:hover{background:#f3f4f6}
.order-invoice{font-family:‘Courier New’,monospace;font-size:13px;font-weight:700;color:#111}
.order-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.order-date{font-size:12px;color:#6b7280}
.order-total{font-size:13px;font-weight:700;color:#16a34a}
.chevron{font-size:12px;color:#9ca3af;transition:transform .2s;margin-left:4px}
.chevron.open{transform:rotate(180deg)}

.order-card-body{display:none;padding:14px}
.order-card-body.open{display:block}

/* fields vertical */
.field-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.field-row{display:flex;align-items:flex-start;gap:0;border-bottom:1px solid #f3f4f6;padding-bottom:8px}
.field-row:last-child{border-bottom:none;padding-bottom:0}
.field-label{font-size:12px;color:#6b7280;font-weight:600;width:130px;flex-shrink:0;padding-top:1px;text-transform:uppercase;letter-spacing:.5px}
.field-value{font-size:13px;color:#111;font-weight:500;word-break:break-all}
.field-value.mono{font-family:‘Courier New’,monospace}
.field-value.green{color:#16a34a;font-weight:700}

/* status badge */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.badge::before{content:’’;width:5px;height:5px;border-radius:50%;background:currentColor}
.badge.initiated{background:#fef3c7;color:#92400e}
.badge.pending{background:#dbeafe;color:#1e40af}
.badge.completed{background:#dcfce7;color:#166534}
.badge.cancelled{background:#fee2e2;color:#991b1b}

/* action buttons */
.action-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px}
.btn-action{padding:7px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.btn-complete{background:#16a34a;color:#fff}
.btn-complete:hover{background:#15803d}
.btn-cancel{background:#ef4444;color:#fff}
.btn-cancel:hover{background:#dc2626}
.btn-wa{background:#25d366;color:#fff}
.btn-wa:hover{background:#22c55e}
.btn-view-raw{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}
.btn-view-raw:hover{background:#e5e7eb}

/* raw JSON */
.raw-area{display:none;margin-top:12px}
.raw-area.open{display:block}
.raw-pre{background:#f8f9fa;border:1px solid #e5e7eb;border-radius:6px;padding:10px;font-size:11px;font-family:‘Courier New’,monospace;overflow:auto;max-height:280px;line-height:1.5;color:#374151}

/* WA modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal-title .wa-icon{color:#25d366;font-size:20px}
.modal-body{display:flex;flex-direction:column;gap:10px}
.modal-label{font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.modal-input{padding:9px 12px;border:1px solid #e5e7eb;border-radius:7px;font-size:13px;outline:none;width:100%;transition:border-color .15s}
.modal-input:focus{border-color:#25d366}
.modal-textarea{padding:9px 12px;border:1px solid #e5e7eb;border-radius:7px;font-size:13px;outline:none;width:100%;min-height:110px;resize:vertical;transition:border-color .15s;line-height:1.6}
.modal-textarea:focus{border-color:#25d366}
.modal-actions{display:flex;gap:8px;margin-top:6px}
.btn-modal-send{flex:1;padding:10px;background:#25d366;color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer}
.btn-modal-send:hover{background:#22c55e}
.btn-modal-cancel{padding:10px 18px;background:#f3f4f6;color:#374151;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer}
.btn-modal-cancel:hover{background:#e5e7eb}
.modal-preview{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:7px;padding:10px;font-size:12px;color:#166534;line-height:1.6;margin-top:2px;max-height:120px;overflow:auto}

/* states */
.auth-card{text-align:center;padding:40px 20px;color:#6b7280}
.empty-state{text-align:center;padding:32px;color:#9ca3af;font-size:14px}
.admin-note-bar{background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:10px 14px;font-size:13px;color:#92400e;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.admin-note-bar::before{content:‘⚠️’;font-size:16px}
.realtime-dot{display:inline-block;width:7px;height:7px;background:#16a34a;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* loading skeleton */
.skel{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:4px;height:12px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>

</head>
<body>

<!-- TOPBAR -->

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-badge">Admin</span>
    <span class="topbar-title">NUBIASTORE — Order Manager</span>
  </div>
  <div class="topbar-right">
    <span class="realtime-dot" title="Realtime aktif"></span>
    <span style="font-size:12px;color:#6b7280;margin-right:4px">Realtime</span>
    <button id="btnSignOut" class="btn-signout">Sign out</button>
  </div>
</div>

<!-- MAIN -->

<div class="main">

  <!-- AUTH MSG -->

  <div id="authMsg" class="card auth-card">

  <div id="adminUI" style="display:none">
    <div id="adminNoteBox" style="display:none" class="admin-note-bar">
      Login via UID allowlist (development mode). Gunakan custom claims server-side untuk production.

<!-- TOOLBAR -->
<div class="card">
  <div class="toolbar">
    <input id="qInvoice" class="search-input" placeholder="🔍  Cari invoice / user id / game id / server…"/>
    <select id="filterStatus" class="filter-select">
      <option value="all">Semua Status</option>
      <option value="initiated">Initiated</option>

<!-- WA MODAL -->

<div class="modal-overlay" id="waModal">
  <div class="modal">
    <div class="modal-title"><span class="wa-icon">💬</span> Konfirmasi via WhatsApp</div>
    <div class="modal-body">
      <div>
        <div class="modal-label">Nomor WhatsApp Pembeli</div>
        <input id="waPhone" class="modal-input" type="tel" placeholder="628xxxxxxxxxx"/>
      </div>
      <div>
        <div class="modal-label">Pesan (bisa diedit)</div>
        <textarea id="waMsg" class="modal-textarea"></textarea>
      </div>
      <div>
        <div class="modal-label">Preview Pesan</div>
        <div class="modal-preview" id="waPreview"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" id="btnWaCancel">Batal</button>
      <button class="btn-modal-send" id="btnWaSend">📲 Buka WhatsApp</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, query, orderBy, onSnapshot,
  doc, updateDoc, getDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3KhNSK0AaKYvXuZE9hi0ZRN9Ysmh9aXc",
  authDomain: "zestoreid-f9e85.firebaseapp.com",
  projectId: "zestoreid-f9e85",
  storageBucket: "zestoreid-f9e85.firebasestorage.app",
  messagingSenderId: "426093692154",
  appId: "1:426093692154:web:38c6e9c143af626a623543",
  measurementId: "G-TS0YB9NYW8"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const authMsg      = document.getElementById('authMsg');
const adminUI      = document.getElementById('adminUI');
const adminNoteBox = document.getElementById('adminNoteBox');
const ordersList   = document.getElementById('ordersList');
const qInvoice     = document.getElementById('qInvoice');
const filterStatus = document.getElementById('filterStatus');
const btnSignOut   = document.getElementById('btnSignOut');
const limitInfo    = document.getElementById('limitInfo');
const btnMore      = document.getElementById('btnMore');
const btnLess      = document.getElementById('btnLess');

// WA modal refs
const waModal    = document.getElementById('waModal');
const waPhone    = document.getElementById('waPhone');
const waMsg      = document.getElementById('waMsg');
const waPreview  = document.getElementById('waPreview');
const btnWaCancel= document.getElementById('btnWaCancel');
const btnWaSend  = document.getElementById('btnWaSend');

const ADMIN_UIDS = ["8z9b0u1LYfTVM0sCP7qHXbYHvGi1"];

let unsubOrders = null;
let lastOrders  = {};
let showLimit   = 10; // 10 or 50

// ── AUTH ──────────────────────────────────────────────
onAuthStateChanged(auth, async (u) => {
  if (!u) {
    authMsg.innerHTML = '<strong>Harus login sebagai admin</strong> — silakan login di halaman utama.';
    authMsg.style.display = '';
    adminUI.style.display = 'none';
    return;
  }
  let isAdmin = false;
  try {
    const t = await u.getIdTokenResult();
    if (t.claims?.admin) isAdmin = true;
  } catch(e) {}
  if (ADMIN_UIDS.includes(u.uid)) isAdmin = true;

  if (!isAdmin) {
    authMsg.innerHTML = '<strong>Access denied.</strong> Akun tidak memiliki hak admin.';
    authMsg.style.display = '';
    adminUI.style.display = 'none';
    return;
  }
  authMsg.style.display = 'none';
  adminUI.style.display = 'block';
  adminNoteBox.style.display = ADMIN_UIDS.includes(u.uid) ? 'flex' : 'none';
  startListener();
});

btnSignOut.onclick = () => signOut(auth);

// ── LISTENER ──────────────────────────────────────────
function startListener() {
  if (unsubOrders) unsubOrders();
  const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
  unsubOrders = onSnapshot(q, snap => {
    lastOrders = {};
    snap.forEach(s => { lastOrders[s.id] = s.data(); });
    render();
  }, err => console.error(err));
}

// ── RENDER ────────────────────────────────────────────
function render() {
  const filter = filterStatus.value;
  const search = qInvoice.value.trim().toLowerCase();

  let rows = Object.values(lastOrders)
    .filter(d => {
      if (filter !== 'all' && d.status !== filter) return false;
      if (!search) return true;
      return [d.invoice, d.userId, d.game_id, d.server, d.game]
        .some(v => v && String(v).toLowerCase().includes(search));
    })
    .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

  const total   = rows.length;
  const limited = rows.slice(0, showLimit);

  limitInfo.textContent = `Menampilkan ${limited.length} dari ${total} transaksi`;
  btnMore.style.display = total > 10 && showLimit === 10  ? '' : 'none';
  btnLess.style.display = showLimit === 50               ? '' : 'none';

  ordersList.innerHTML = '';
  if (!limited.length) {
    ordersList.innerHTML = '<div class="empty-state">Tidak ada order ditemukan.</div>';
    return;
  }

  limited.forEach(d => ordersList.appendChild(buildCard(d)));

  // re-attach collapse toggles
  document.querySelectorAll('.order-card-head').forEach(h => {
    h.onclick = () => {
      const body    = h.nextElementSibling;
      const chevron = h.querySelector('.chevron');
      body.classList.toggle('open');
      chevron.classList.toggle('open');
    };
  });
  // raw toggle
  document.querySelectorAll('.btn-view-raw').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const ra = b.closest('.order-card-body').querySelector('.raw-area');
      ra.classList.toggle('open');
      b.textContent = ra.classList.contains('open') ? '▲ Sembunyikan JSON' : '{ } Raw JSON';
    };
  });
}

function buildCard(d) {
  const card = document.createElement('div');
  card.className = 'order-card';

  const st     = d.status || 'initiated';
  const invoice= d.invoice || '—';

  card.innerHTML = `
    <div class="order-card-head">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="order-invoice">${invoice}</span>
        <span class="badge ${st}">${st}</span>
      </div>
      <div class="order-meta">
        <span class="order-total">Rp ${fmtMoney(d.amount_total)}</span>
        <span class="order-date">${fmtDate(d.createdAt)}</span>
        <span class="chevron">▼</span>
      </div>
    </div>
    <div class="order-card-body">
      <div class="field-list">
        ${field('Invoice',     invoice,             'mono')}
        ${field('User ID',     d.userId||'guest',   'mono')}
        ${field('Game',        d.game||'—')}
        ${field('Game ID',     d.game_id||'—',      'mono')}
        ${field('Server',      d.server||'—',       'mono')}
        ${field('Nominal',     d.nominalValue||'—')}
        ${field('Total Bayar', 'Rp '+fmtMoney(d.amount_total), 'green')}
        ${field('Metode',      (d.payment_method||'—').replace(/_/g,' '))}
        ${field('Status',      `<span class="badge ${st}">${st}</span>`,'')}
        ${field('Dibuat',      fmtDate(d.createdAt))}
        ${d.updatedAt ? field('Diperbarui', fmtDate(d.updatedAt)) : ''}
      </div>
      <div class="action-row">
        <button class="btn-action btn-complete" data-id="${invoice}" onclick="handleComplete(event)">✔ Selesai</button>
        <button class="btn-action btn-cancel"   data-id="${invoice}" onclick="handleCancel(event)">✖ Batal</button>
        <button class="btn-action btn-wa" data-invoice="${invoice}" data-game="${d.game||''}" data-gameid="${d.game_id||''}" data-nominal="${d.nominalValue||''}" data-total="${d.amount_total||''}" data-method="${d.payment_method||''}" data-status="${st}" onclick="openWA(event)">💬 WhatsApp</button>
        <button class="btn-action btn-view-raw">{ } Raw JSON</button>
      </div>
      <div class="raw-area">
        <pre class="raw-pre">${JSON.stringify(d, null, 2)}</pre>

```
  </div>
</div>
```

`;
return card;
}

function field(label, value, cls=’’) {
return `<div class="field-row">
<span class="field-label">${label}</span>
<span class="field-value ${cls}">${value}</span>

  </div>`;
}

// ── STATUS ACTIONS ────────────────────────────────────
window.handleComplete = async e => {
const id = e.currentTarget.dataset.id;
if (!confirm(`Tandai order ${id} SELESAI?`)) return;
await markStatus(id, ‘completed’);
};
window.handleCancel = async e => {
const id = e.currentTarget.dataset.id;
if (!confirm(`Tandai order ${id} BATAL?`)) return;
await markStatus(id, ‘cancelled’);
};
async function markStatus(invoice, newStatus) {
try {
await updateDoc(doc(db, ‘orders’, invoice), { status: newStatus, updatedAt: serverTimestamp() });
} catch(e) { alert(’Gagal update: ’ + e.message); }
}

// ── WA MODAL ─────────────────────────────────────────
window.openWA = e => {
const b  = e.currentTarget;
const d  = b.dataset;
const tpl = `Halo! Kami ingin mengkonfirmasi pesanan Anda di NUBIASTORE.\n\n` +
`📋 Invoice   : ${d.invoice}\n` +
`🎮 Game      : ${d.game}\n` +
`🆔 Game ID   : ${d.gameid}\n` +
`💎 Nominal   : ${d.nominal}\n` +
`💰 Total     : Rp ${fmtMoney(Number(d.total))}\n` +
`💳 Metode    : ${(d.method||'').replace(/_/g,' ')}\n` +
`📦 Status    : ${d.status}\n\n` +
`Apakah ada yang perlu dikonfirmasi? Terima kasih 🙏`;

waPhone.value   = ‘’;
waMsg.value     = tpl;
waPreview.textContent = tpl;
waModal.classList.add(‘open’);
};

waMsg.addEventListener(‘input’, () => { waPreview.textContent = waMsg.value; });
btnWaCancel.onclick = () => waModal.classList.remove(‘open’);
waModal.addEventListener(‘click’, e => { if (e.target === waModal) waModal.classList.remove(‘open’); });

btnWaSend.onclick = () => {
let phone = waPhone.value.trim().replace(/\D/g,’’);
if (!phone) { waPhone.focus(); waPhone.style.borderColor=’#ef4444’; return; }
if (phone.startsWith(‘0’)) phone = ‘62’ + phone.slice(1);
const url = `https://wa.me/${phone}?text=${encodeURIComponent(waMsg.value)}`;
window.open(url, ‘_blank’);
waModal.classList.remove(‘open’);
};
waPhone.addEventListener(‘input’, () => { waPhone.style.borderColor=’’; });

// ── LIMIT TOGGLE ─────────────────────────────────────
btnMore.onclick = () => { showLimit = 50; render(); };
btnLess.onclick = () => { showLimit = 10; render(); };

// ── EVENTS ───────────────────────────────────────────
qInvoice.addEventListener(‘input’, render);
filterStatus.addEventListener(‘change’, render);

// ── HELPERS ──────────────────────────────────────────
function fmtMoney(n) { return typeof n === ‘number’ ? n.toLocaleString(‘id’) : (n || ‘—’); }
function fmtDate(ts) {
if (!ts) return ‘—’;
const d = typeof ts.toDate === ‘function’ ? ts.toDate() : new Date(ts.seconds ? ts.seconds*1000 : ts);
return d.toLocaleString(‘id-ID’, { day:‘2-digit’, month:‘short’, year:‘numeric’, hour:‘2-digit’, minute:‘2-digit’ });
}
</script>

</body>
