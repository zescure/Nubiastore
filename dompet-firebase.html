<script>
/* ============ 1. UTIL ============ */
const $=s=>document.querySelector(s);
const MO=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>{d=new Date(d);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const today=()=>iso(new Date());
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>{const x=new Date(d+'T00:00');return x.getDate()+' '+MO[x.getMonth()]+' '+x.getFullYear()};
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const CO=['Kebutuhan','Makan','Transportasi','Hiburan','Tagihan','Kesehatan','Belanja','Cicilan','Lainnya'];
const CI=['Gaji','Lembur','Bonus','Freelance','Bisnis','Lainnya'];
const EM={Makan:'🍜',Transportasi:'🚗',Hiburan:'🎬',Tagihan:'🧾',Kebutuhan:'🛒',Kesehatan:'💊',Belanja:'🛍️',Cicilan:'💳',Gaji:'💼',Lembur:'⏱️',Bonus:'🎁',Freelance:'💻',Bisnis:'🏪',Transfer:'🔁',Penyesuaian:'⚖️',Lainnya:'📦'};
const ATYPE={cash:'Tunai',bank:'Bank',ewallet:'E-wallet',special:'Rekening khusus'};
const DKIND={utang:'Utang pribadi',cicilan:'Cicilan',paylater:'PayLater',pinjaman:'Pinjaman',piutang:'Piutang'};
const ASTYPE={Saham:'📈',Crypto:'🪙','Reksa Dana':'📊',Emas:'🥇',Kendaraan:'🏍️',Properti:'🏠','Barang berharga':'💎',Lainnya:'📦'};

function nextDue(day,strict){const n=new Date(),c=(y,m)=>new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));let d=c(n.getFullYear(),n.getMonth());const t=new Date(today()+'T00:00');if(strict?d<=t:d<t)d=c(n.getFullYear(),n.getMonth()+1);return iso(d)}
const nextDate=(d,e)=>{const x=new Date(d+'T00:00');e==='weekly'?x.setDate(x.getDate()+7):e==='yearly'?x.setFullYear(x.getFullYear()+1):x.setMonth(x.getMonth()+1);return iso(x)};
const daysTo=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}

/* ============ 2. FIREBASE + DATA LAYER ============
   Tidak ada pembacaan/penulisan localStorage untuk data keuangan.
   Setiap koleksi disimpan pada dokumen Firebase terpisah dan dipecah menjadi
   chunk agar satu dokumen tidak mendekati batas ukuran maksimum Firestore.
*/
const firebaseConfig = {
  apiKey: "AIzaSyA3KhNSK0AaKYvXuZE9hi0ZRN9Ysmh9aXc",
  authDomain: "zestoreid-f9e85.firebaseapp.com",
  projectId: "zestoreid-f9e85",
  storageBucket: "zestoreid-f9e85.firebasestorage.app",
  messagingSenderId: "426093692154",
  appId: "1:426093692154:web:38c6e9c143af626a623543",
  measurementId: "G-TS0Y9NYW8"
};

const DATA_KEYS=['acc','tx','bud','debt','asset','goal','rec','audit'];
const FIRESTORE_CHUNK_LIMIT=350000; // target < 1 MiB per dokumen, termasuk metadata
let DB=emptyDB();
let firebaseApp=null,auth=null,fsdb=null,firebaseUser=null,firebaseReady=false;
let saveQueue=Promise.resolve();
let remoteChunkIds=Object.fromEntries(DATA_KEYS.map(k=>[k,new Set()]));
let lastSavedJson=Object.fromEntries(DATA_KEYS.map(k=>[k,null]));

function emptyDB(){
 return {
  acc:[{id:'acc_cash',name:'Dompet Tunai',type:'cash',open:0}],
  tx:[],bud:[],debt:[],asset:[],goal:[],rec:[],
  audit:[{t:Date.now(),a:'Mulai',d:'Dompet baru dibuat. Semua data transaksi dimulai dari nol.'}]
 };
}

function firebaseRefs(uid,key){
 const root=fsdb.collection('users').doc(uid).collection('dompet').doc(key);
 return {root,chunks:root.collection('chunks')};
}

function splitIntoChunks(items){
 const out=[];let current=[];
 for(const item of items){
  const candidate=current.concat([item]);
  const size=new Blob([JSON.stringify(candidate)]).size;
  if(current.length&&size>FIRESTORE_CHUNK_LIMIT){out.push(current);current=[item]}
  else current=candidate;
  if(new Blob([JSON.stringify(current)]).size>FIRESTORE_CHUNK_LIMIT){
   throw new Error('Ada satu data yang terlalu besar untuk disimpan di Firestore. Ringkas isi jurnal/catatan tersebut.');
  }
 }
 if(current.length)out.push(current);
 return out;
}

async function loadFirebaseData(userId){
 const result=emptyDB();let found=false;const existingKeys=new Set();
 for(const key of DATA_KEYS){
  const {root,chunks}=firebaseRefs(userId,key);
  const rootSnap=await root.get();
  if(rootSnap.exists){found=true;existingKeys.add(key);}
  const snap=await chunks.orderBy('index','asc').get();
  remoteChunkIds[key]=new Set(snap.docs.map(d=>d.id));
  const rows=[];
  snap.docs.forEach(doc=>{
   const data=doc.data();
   if(Array.isArray(data.items))rows.push({index:Number(data.index)||0,items:data.items});
  });
  rows.sort((a,b)=>a.index-b.index);
  result[key]=rows.flatMap(x=>x.items);
 }
 if(!found)return{data:emptyDB(),found:false,existingKeys};
 DATA_KEYS.forEach(k=>{if(!Array.isArray(result[k]))result[k]=[]});
 if(!result.acc.length)result.acc=[{id:'acc_cash',name:'Dompet Tunai',type:'cash',open:0}];
 return{data:result,found:true,existingKeys};
}

async function saveFirebaseCollection(userId,key,items){
 const {root,chunks}=firebaseRefs(userId,key);
 const parts=splitIntoChunks(items);
 const wanted=new Set(parts.map((_,i)=>String(i).padStart(6,'0')));
 const ops=[];
 parts.forEach((part,i)=>{
  const id=String(i).padStart(6,'0');
  const safeItems=JSON.parse(JSON.stringify(part));
  ops.push({type:'set',ref:chunks.doc(id),data:{index:i,items:safeItems}});
 });
 (remoteChunkIds[key]||new Set()).forEach(id=>{if(!wanted.has(id))ops.push({type:'delete',ref:chunks.doc(id)})});
 for(let i=0;i<ops.length;i+=20){
  const batch=fsdb.batch();
  ops.slice(i,i+20).forEach(op=>op.type==='set'?batch.set(op.ref,op.data):batch.delete(op.ref));
  await batch.commit();
 }
 await root.set({count:items.length,chunkCount:parts.length,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),schemaVersion:1});
 remoteChunkIds[key]=wanted;
}

async function persistAll(snapshot){
 for(const key of DATA_KEYS){
  const items=Array.isArray(snapshot[key])?snapshot[key]:[];
  const fingerprint=JSON.stringify(items);
  if(lastSavedJson[key]===fingerprint)continue;
  await saveFirebaseCollection(firebaseUser.uid,key,items);
  lastSavedJson[key]=fingerprint;
 }
}

function put(){
 if(!firebaseReady||!firebaseUser){toast('Firebase belum siap. Data belum disimpan.');return Promise.resolve(false)}
 let snapshot;
 try{snapshot=JSON.parse(JSON.stringify(DB))}catch(e){toast('Data tidak dapat diproses untuk Firebase');return Promise.resolve(false)}
 saveQueue=saveQueue.then(()=>persistAll(snapshot)).then(()=>true).catch(err=>{
  console.error('Gagal menyimpan Dompet ke Firestore:',err);
  const msg=err&&err.code==='permission-denied'?'Akses Firestore ditolak. Periksa Security Rules.':(err&&err.message?err.message:'Kesalahan jaringan');
  toast('Gagal simpan Firebase: '+msg);
  return false;
 });
 return saveQueue;
}

function firebaseErrorText(err){
 const code=err&&err.code||'';
 if(code==='auth/operation-not-allowed')return'Login anonim belum diaktifkan. Firebase Console → Authentication → Sign-in method → Anonymous → Enable.';
 if(code==='auth/network-request-failed')return'Jaringan gagal. Periksa internet lalu muat ulang halaman.';
 if(code==='permission-denied'||code==='firestore/permission-den-denied')return'Firestore menolak akses. Pasang Security Rules yang disertakan bersama kode ini.';
 if(code==='failed-precondition')return'Firestore belum siap. Pastikan database Cloud Firestore sudah dibuat.';
 return(err&&err.message)||'Tidak dapat menghubungkan ke Firebase.';
}

async function boot(){
 firebaseReady=false;
 $('#app').innerHTML='<div class="card"><b>Menghubungkan ke Firebase…</b><p class="mut" style="margin-top:6px">Menyiapkan akun privat dan memuat data keuangan.</p></div>';
 try{
  if(!window.firebase)throw new Error('Firebase SDK gagal dimuat. Periksa koneksi internet dan URL Firebase SDK.');
  firebaseApp=firebase.apps.length?firebase.app():firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();fsdb=firebase.firestore();
  await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  if(!auth.currentUser){const credential=await auth.signInAnonymously();firebaseUser=credential.user}
  else firebaseUser=auth.currentUser;
  const loaded=await loadFirebaseData(firebaseUser.uid);
  DB=loaded.data;
  DATA_KEYS.forEach(key=>{if(loaded.existingKeys.has(key))lastSavedJson[key]=JSON.stringify(DB[key])});
  firebaseReady=true;
  runRec();
  await put();
  render();
  toast(loaded.found?'Data Firebase berhasil dimuat':'Dompet baru siap · data dimulai dari nol');
 }catch(err){
  console.error('Firebase boot error:',err);
  firebaseReady=false;
  const msg=esc(firebaseErrorText(err));
  $('#app').innerHTML=`<div class="card"><b class="neg">Koneksi Firebase gagal</b><p class="mut" style="margin-top:8px">${msg}</p><button class="btn" style="margin-top:16px" onclick="boot()">Coba lagi</button></div>`;
 }
}

function log(a,d){DB.audit.unshift({t:Date.now(),a,d});DB.audit.length=Math.min(DB.audit.length,300)}
function runRec(){let n=0;DB.rec.forEach(r=>{while(r.next<=today()){DB.tx.push({id:uid(),date:r.next,type:r.type,amt:r.amt,cat:r.cat,acc:r.acc,note:r.note,tag:'berulang',journal:''});n++;r.next=nextDate(r.next,r.every)}});if(n){log('Berulang',n+' transaksi dibuat otomatis');put()}}

/* ============ 3. KALKULASI ============ */
const bal=(a,txs=DB.tx)=>txs.reduce((s,t)=>s+(t.acc===a.id?(t.type==='in'?t.amt:-t.amt):0)+(t.type==='tf'&&t.to===a.id?t.amt:0),+a.open||0);
const sum=f=>DB.tx.filter(f).reduce((s,t)=>s+t.amt,0);
const inc=m=>sum(t=>t.type==='in'&&t.date.startsWith(m)),exp=m=>sum(t=>t.type==='out'&&t.date.startsWith(m));
const rem=d=>Math.max(0,d.principal-d.paid);
const totalBal=()=>DB.acc.reduce((s,a)=>s+bal(a),0);
const assetVal=()=>DB.asset.reduce((s,a)=>s+a.value,0);
const owed=()=>DB.debt.filter(d=>d.kind!=='piutang').reduce((s,d)=>s+rem(d),0);
const recv=()=>DB.debt.filter(d=>d.kind==='piutang').reduce((s,d)=>s+rem(d),0);
const netWorth=()=>totalBal()+assetVal()+recv()-owed();
const monthlyDebt=()=>DB.debt.filter(d=>d.kind!=='piutang'&&rem(d)>0).reduce((s,d)=>s+Math.min(d.monthly,rem(d)),0);
function pstart(p){const d=new Date();if(p==='harian')return today();if(p==='mingguan'){d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)}return p==='bulanan'?today().slice(0,7)+'-01':today().slice(0,4)+'-01-01'}
const spent=b=>sum(t=>t.type==='out'&&t.cat===b.cat&&t.date>=pstart(b.per));
function avg(){
 const from=iso(Date.now()-90*864e5),f=DB.tx.filter(t=>t.date>=from);const first=f.reduce((m,t)=>t.date<m?t.date:m,today());
 const mo=Math.max(1,cl((new Date(today())-new Date(first))/864e5/30,1,3));
 const I=f.filter(t=>t.type==='in').reduce((s,t)=>s+t.amt,0)/mo,X=f.filter(t=>t.type==='out').reduce((s,t)=>s+t.amt,0)/mo;return{I,X,N:I-X}}
function efMonths(){const{X}=avg();return X?totalBal()/X:0}
function health(){const{I,X}=avg(),rate=I?(I-X)/I:0,dr=I?monthlyDebt()/I:1;
 const bs=DB.bud.length?DB.bud.filter(b=>spent(b)<=b.limit).length/DB.bud.length:.5;
 const p=[cl(rate/.2,0,1)*30,(1-cl((dr-.1)/.4,0,1))*25,cl(efMonths()/6,0,1)*25,bs*20],s=Math.round(p.reduce((a,b)=>a+b,0));
 return{s,p,rate,dr,label:s>=80?'Sangat sehat':s>=60?'Sehat':s>=40?'Waspada':'Kritis',col:s>=80?'#34d399':s>=60?'#a3e635':s>=40?'#fbbf24':'#ff6b6b'}}
function debtFree(){let max=0,unk=0;DB.debt.filter(d=>d.kind!=='piutang'&&rem(d)>0).forEach(d=>{if(!d.monthly){unk++;return}let b=rem(d),r=d.rate/1200,m=0;while(b>0&&m<600){b=b*(1+r)-d.monthly;m++}max=Math.max(max,m>=600?Infinity:m)});

 sec('Perilaku belanja')+`<div class="card">${kv('Kategori terbesar',top[0]?top[0][0]+' ('+Math.round(top[0][1]/X*100)+'%)':'–')}${kv('Hari paling boros',['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][hot])}${kv('Naik terbanyak vs bulan lalu',inc2[1]>0?inc2[0]+' (+'+rp(inc2[1])+')':'Tidak ada')}${kv('Rata-rata per hari',rp(av.X/30))}</div>`+
 sec('Simulator “bagaimana jika”')+`<div class="card"><div class="kv"><span>Gaji naik</span><b id="w1v">0%</b></div><input type="range" id="w1" min="0" max="50" value="10" oninput="wi()"><div class="kv"><span>Pengeluaran dipotong</span><b id="w2v">0%</b></div><input type="range" id="w2" min="0" max="50" value="10" oninput="wi()"><div class="row" style="padding:8px 0"><span>Lunasi cicilan</span><select id="w3" onchange="wi()"><option value="">Tidak ada</option>${DB.debt.filter(d=>d.kind!=='piutang'&&d.monthly&&rem(d)).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div id="wo" style="margin-top:8px"></div></div>`+
 sec('Rekonsiliasi saldo')+`<div class="grp">${DB.acc.map(a=>`<div class="it"><span class="m"><b>${esc(a.name)}</b><span class="mut">Di aplikasi ${rp(bal(a))}</span></span><input id="rc_${a.id}" type="number" inputmode="decimal" placeholder="Saldo asli" style="width:120px;background:var(--c2);border:0;border-radius:9px;padding:8px;text-align:right;outline:0"><button class="btn s g" onclick="recon('${a.id}')">Cocokkan</button></div>`).join('')}</div>`+
 sec('Riwayat audit')+`<div class="grp">${DB.audit.slice(0,10).map(a=>`<div class="pad" style="border-top:.5px solid var(--sep)"><b style="font-size:14px">${esc(a.a)}</b> <span class="mut">${new Date(a.t).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}</span><div class="mut">${esc(a.d)}</div></div>`).join('')}</div>`+
 sec('Data')+`<div class="card" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn s" onclick="backup()">Backup JSON</button><button class="btn s g" onclick="$('#rf').click()">Restore</button><button class="btn s g neg" onclick="wipe()">Hapus semua</button></div>`};

/* ============ 6. FORMULIR (bottom sheet) ============ */
function form(title,fn,vals,saveFn,del){const fs=fn(vals);
 const h=fs.map(x=>{const v=vals[x.k]??'';let i;
  if(x.t==='select')i=`<select name="${x.k}" ${x.re?'data-re':''}>${x.o.map(o=>`<option value="${o[0]}" ${o[0]==v?'selected':''}>${o[1]}</option>`).join('')}</select>`;
  else if(x.t==='area')i=`<textarea name="${x.k}" rows="2" placeholder="${x.p||''}">${esc(v)}</textarea>`;
  else i=`<input name="${x.k}" type="${x.t||'text'}" ${x.t==='number'?'inputmode="decimal" step="any"':''} value="${esc(v)}" placeholder="${x.p||''}">`;
  return`<label class="row"><span>${x.l}</span>${i}</label>`}).join('');
 const S=$('#sheet');S.innerHTML=`<div class="back" onclick="closeSheet()"></div><form class="panel" onsubmit="return false"><div class="grab"></div><div class="ph"><button type="button" class="lnk" onclick="closeSheet()">Batal</button><b>${title}</b><button type="button" class="lnk strong" id="sv">Simpan</button></div><div class="grp">${h}</div>${del?'<button type="button" class="btn red" id="dl">Hapus</button>':''}</form>`;
 const fm=S.querySelector('form'),g=()=>{const o={};fs.forEach(f=>{const e=fm.elements[f.k];if(e)o[f.k]=f.t==='number'?parseFloat(e.value)||0:e.value});return o};
 fm.querySelectorAll('[data-re]').forEach(e=>e.onchange=()=>form(title,fn,{...vals,...g()},saveFn,del));
 $('#sv').onclick=()=>{const e=saveFn(g());if(e)return toast(e);put();closeSheet();render()};
 if(del)$('#dl').onclick=()=>{if(!confirm('Hapus data ini?'))return;const e=del();if(e)return toast(e);put();closeSheet();render()};
 requestAnimationFrame(()=>S.classList.add('on'))}
const closeSheet=()=>$('#sheet').classList.remove('on');
const accOpts=()=>DB.acc.map(a=>[a.id,a.name]);
function crud(c,label,fn,def,id,chk,guard){const old=id&&DB[c].find(x=>x.id===id),nm=d=>d.name||d.note||d.cat;
 form((old?'Ubah ':'Tambah ')+label,fn,old?{...old}:def,d=>{const e=chk&&chk(d);if(e)return e;if(old){log('Ubah '+label,nm(old)+' → '+nm(d));Object.assign(old,d)}else{DB[c].push({id:uid(),...d});log('Tambah '+label,nm(d))}},old?()=>{const e=guard&&guard(old);if(e)return e;DB[c]=DB[c].filter(x=>x.id!==id);log('Hapus '+label,nm(old))}:null)}
const need=(d,k)=>!String(d[k]||'').trim()&&'Nama wajib diisi';

function txForm(id){const old=DB.tx.find(t=>t.id===id);
 form(old?'Ubah transaksi':'Transaksi baru',x=>{const f=[{k:'type',l:'Jenis',t:'select',re:1,o:[['out','Pengeluaran'],['in','Pemasukan'],['tf','Transfer']]},{k:'amt',l:'Jumlah (Rp)',t:'number',p:'0'}];
  if(x.type!=='tf')f.push({k:'cat',l:'Kategori',t:'select',o:(x.type==='in'?CI:CO).map(c=>[c,c])});
  f.push({k:'acc',l:x.type==='tf'?'Dari rekening':'Rekening',t:'select',o:accOpts()});
  if(x.type==='tf')f.push({k:'to',l:'Ke rekening',t:'select',o:accOpts()});
  return f.concat([{k:'date',l:'Tanggal',t:'date'},{k:'tag',l:'Tag',p:'#kantor'},{k:'note',l:'Catatan',p:'Untuk apa?'},{k:'journal',l:'Jurnal',t:'area',p:'Alasan & konteks di balik transaksi'}])},
  old?{...old}:{type:'out',date:today(),acc:DB.acc[0]?.id,to:DB.acc[1]?.id,cat:'Makan',amt:'',tag:'',note:'',journal:''},
  d=>{if(!(d.amt>0))return'Jumlah harus lebih dari 0';if(!d.date)return'Tanggal wajib diisi';
   if(d.type==='tf'&&d.acc===d.to)return'Rekening asal dan tujuan harus berbeda';
   if(d.type!=='in'){const a=DB.acc.find(a=>a.id===d.acc);if(!a)return'Rekening tidak ditemukan';const b=bal(a,DB.tx.filter(t=>t.id!==id));if(b<d.amt)return`Saldo ${a.name} tidak cukup (${rp(b)})`}
   if(d.type==='tf'){d.cat='Transfer'}else delete d.to;
   if(old){log('Ubah transaksi',`${old.cat} ${rp(old.amt)} → ${d.cat} ${rp(d.amt)}`);Object.assign(old,d)}else{DB.tx.push({id:uid(),...d});log('Tambah transaksi',`${d.cat} ${rp(d.amt)}`)}
   const b=DB.bud.find(b=>b.cat===d.cat&&d.type==='out'&&spent(b)>b.limit);if(b)setTimeout(()=>toast(`Anggaran ${b.cat} melebihi batas`),500)},
  old?()=>{log('Hapus transaksi',`${old.cat} ${rp(old.amt)} (${old.date})`);DB.tx=DB.tx.filter(t=>t.id!==id)}:null)}
const accForm=id=>crud('acc','rekening',()=>[{k:'name',l:'Nama',p:'BCA, OVO…'},{k:'type',l:'Jenis',t:'select',o:Object.entries(ATYPE)},{k:'open',l:'Saldo awal',t:'number'}],{name:'',type:'bank',open:0},id,d=>need(d,'name'),a=>DB.tx.some(t=>t.acc===a.id||t.to===a.id)&&'Rekening masih punya transaksi');
const budForm=id=>crud('bud','anggaran',()=>[{k:'cat',l:'Kategori',t:'select',o:CO.map(c=>[c,c])},{k:'per',l:'Periode',t:'select',o:['harian','mingguan','bulanan','tahunan'].map(p=>[p,p])},{k:'limit',l:'Batas (Rp)',t:'number'}],{cat:'Makan',per:'bulanan',limit:''},id,d=>!(d.limit>0)&&'Batas harus lebih dari 0');
const debtForm=id=>crud('debt','utang/piutang',()=>[{k:'kind',l:'Jenis',t:'select',o:Object.entries(DKIND)},{k:'name',l:'Nama'},{k:'lender',l:'Pihak',p:'Pemberi pinjaman'},{k:'principal',l:'Pokok (Rp)',t:'number'},{k:'paid',l:'Sudah dibayar',t:'number'},{k:'rate',l:'Bunga %/tahun',t:'number'},{k:'monthly',l:'Cicilan/bulan',t:'number'},{k:'due',l:'Jatuh tempo tgl',t:'number',p:'1–31'},{k:'tenor',l:'Tenor (bulan)',t:'number'}],{kind:'utang',name:'',lender:'',principal:'',paid:0,rate:0,monthly:0,due:'',tenor:0},id,d=>need(d,'name')||(!(d.principal>0)&&'Pokok harus lebih dari 0')||(d.paid>d.principal&&'Pembayaran melebihi pokok')||(d.due&&(d.due<1||d.due>31)&&'Tanggal 1–31'));
const assetForm=id=>crud('asset','aset',()=>[{k:'name',l:'Nama'},{k:'type',l:'Jenis',t:'select',o:Object.keys(ASTYPE).map(k=>[k,k])},{k:'cost',l:'Modal (Rp)',t:'number'},{k:'value',l:'Nilai pasar',t:'number'}],{name:'',type:'Saham',cost:'',value:''},id,d=>need(d,'name'));
const goalForm=id=>crud('goal','target',()=>[{k:'name',l:'Target',p:'Dana darurat, kendaraan…'},{k:'target',l:'Jumlah (Rp)',t:'number'},{k:'saved',l:'Terkumpul',t:'number'},{k:'deadline',l:'Tenggat',t:'date'}],{name:'',target:'',saved:0,deadline:iso(Date.now()+180*864e5)},id,d=>need(d,'name')||(!(d.target>0)&&'Jumlah target wajib diisi'));
const recForm=id=>crud('rec','transaksi berulang',x=>[{k:'type',l:'Jenis',t:'select',re:1,o:[['out','Pengeluaran'],['in','Pemasukan']]},{k:'amt',l:'Jumlah',t:'number'},{k:'cat',l:'Kategori',t:'select',o:(x.type==='in'?CI:CO).map(c=>[c,c])},{k:'acc',l:'Rekening',t:'select',o:accOpts()},{k:'every',l:'Ulangi',t:'select',o:[['weekly','Mingguan'],['monthly','Bulanan'],['yearly','Tahunan']]},{k:'next',l:'Berikutnya',t:'date'},{k:'note',l:'Catatan'}],{type:'out',amt:'',cat:'Tagihan',acc:DB.acc[0]?.id,every:'monthly',next:today(),note:''},id,d=>!(d.amt>0)&&'Jumlah wajib diisi');
function payDebt(id){const d=DB.debt.find(x=>x.id===id),pi=d.kind==='piutang';
 form(pi?'Terima pelunasan':'Bayar '+d.name,()=>[{k:'amt',l:'Jumlah (Rp)',t:'number'},{k:'acc',l:pi?'Masuk ke':'Dari rekening',t:'select',o:accOpts()}],{amt:Math.min(d.monthly||rem(d),rem(d)),acc:DB.acc[0]?.id},x=>{
  if(!(x.amt>0)||x.amt>rem(d))return'Jumlah harus 1 – '+rp(rem(d));const a=DB.acc.find(a=>a.id===x.acc);if(!a)return'Rekening tidak ditemukan';if(!pi&&bal(a)<x.amt)return`Saldo ${a.name} tidak cukup`;
  d.paid+=x.amt;DB.tx.push({id:uid(),date:today(),type:pi?'in':'out',amt:x.amt,cat:pi?'Lainnya':'Cicilan',acc:x.acc,note:(pi?'Pelunasan dari ':'Bayar ')+d.name,tag:'utang',journal:''});log(pi?'Terima piutang':'Bayar utang',d.name+' '+rp(x.amt))},null)}
function goalAdd(id){const g=DB.goal.find(x=>x.id===id);form('Setor ke '+g.name,()=>[{k:'amt',l:'Jumlah (Rp)',t:'number'}],{amt:''},x=>{if(!(x.amt>0))return'Isi jumlah setoran';g.saved+=x.amt;log('Setor target',g.name+' '+rp(x.amt))},null)}
function recon(id){const a=DB.acc.find(x=>x.id===id),v=$('#rc_'+id).value;if(v==='')return toast('Isi saldo sebenarnya dulu');const diff=+v-bal(a);
 if(!diff)return toast('Saldo sudah cocok ✓');DB.tx.push({id:uid(),date:today(),type:diff>0?'in':'out',amt:Math.abs(diff),cat:'Penyesuaian',acc:id,note:'Rekonsiliasi saldo',tag:'rekonsiliasi',journal:''});log('Rekonsiliasi',a.name+' selisih '+rp(diff));put();render();toast('Saldo disesuaikan '+rp(diff))}

/* ============ 7. BACKUP / RESTORE ============ */
function backup(){const b=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dompet-backup-'+today()+'.json';a.click();log('Backup','File diunduh');put();toast('Backup diunduh')}
$('#rf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.acc||!d.tx)throw 0;DATA_KEYS.forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});DB=d;log('Restore','Data dipulihkan dari '+f.name);put();render();toast('Data dipulihkan dan dikirim ke Firebase')}catch(_){toast('File backup tidak valid')}};r.readAsText(f);e.target.value=''};
function wipe(){if(!confirm('Hapus SEMUA data? Buat backup dulu.'))return;DB={acc:[{id:uid(),name:'Dompet',type:'cash',open:0}],tx:[],bud:[],debt:[],asset:[],goal:[],rec:[],audit:[{t:Date.now(),a:'Reset',d:'Semua data dihapus'}]};put();render()}

/* ============ 8. ROUTER ============ */
let tab='home';
const TABS=[['home','Ringkasan','M3 11l9-8 9 8v10h-6v-7H9v7H3z'],['tx','Transaksi','M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4'],['bud','Anggaran','M21 12A9 9 0 1 1 12 3v9zM15 3.5A9 9 0 0 1 20.5 9H15z'],['debt','Utang','M2 6h20v12H2zM2 10h20'],['asset','Aset','M3 17l6-6 4 4 8-8M15 7h6v6'],['ana','Analitik','M5 20V10M12 20V4M19 20v-7']];
function render(){$('#nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')" aria-label="${t[1]}"><svg viewBox="0 0 24 24"><path d="${t[2]}"/></svg>${t[1]}</button>`).join('');$('#app').innerHTML=V[tab]()}
function go(t){tab=t;render();scrollTo(0,0);const a=$('#app');a.classList.remove('fade');void a.offsetWidth;a.classList.add('fade')}

/* Semua handler yang dipanggil dari atribut onclick tetap berada di scope global. */
Object.assign(window,{boot,go,render,txForm,accForm,budForm,recForm,debtForm,assetForm,goalForm,payDebt,goalAdd,recon,backup,wipe,closeSheet,wi});
boot();
</script>
