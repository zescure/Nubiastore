<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUBIA ROCKET</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #04030f;
      --panel:  rgba(255,255,255,.04);
      --border: rgba(255,255,255,.08);
      --text:   #ddd8ff;
      --muted:  #5c5890;
      --green:  #00ff88;
      --red:    #ff3355;
      --gold:   #ffcc22;
      --purple: #8855ff;
      --blue:   #33aaff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      min-height: 100%; overflow-x: hidden;
    }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    input  { font: inherit; }

    /* ─── HEADER ─────────────────────────────────────── */
    .hdr {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; position: relative; z-index: 20;
      background: rgba(4,3,15,.9);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .logo {
      font-family: 'Orbitron', monospace; font-size: .88rem;
      font-weight: 900; letter-spacing: 2.5px; flex: 1;
      color: #fff;
    }
    .logo em { color: var(--green); font-style: normal; }
    .bal-pill {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 13px; border-radius: 999px;
      background: rgba(255,255,255,.06); border: 1px solid var(--border);
      font-weight: 700; font-size: .85rem;
    }
    .bal-num {
      font-family: 'Orbitron', monospace; font-size: .85rem;
      color: var(--green); transition: filter .2s; min-width: 70px;
    }
    .blr { filter: blur(6px); user-select: none; }
    .hbtn {
      border-radius: 999px; padding: 7px 13px; font-weight: 700;
      font-size: .78rem; background: rgba(255,255,255,.08); color: var(--text);
      transition: background .14s;
    }
    .hbtn:hover { background: rgba(255,255,255,.16); }
    .hbtn.primary { background: linear-gradient(135deg,var(--purple),var(--blue)); color:#fff; }
    .uid-row { width:100%; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .uid-txt  { font-size:.65rem; color:var(--muted); word-break:break-all; max-width:300px; }
    .uid-copy { padding:3px 8px; border-radius:6px; background:rgba(255,255,255,.08); color:var(--text); font-size:.65rem; font-weight:700; }
    .eye-btn  { color:var(--muted); font-size:.78rem; padding:0 2px; }

    /* ─── CANVAS AREA ────────────────────────────────── */
    .canvas-wrap {
      position: relative; width: 100%;
      flex: 1; min-height: 280px; max-height: 420px;
      overflow: hidden; background: #04030f;
    }
    #gc { display:block; width:100%; height:100%; }

    /* Overlays sit on top of canvas */
    .mult-wrap {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none; gap: 6px;
    }
    .mult {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2.6rem, 8vw, 4.2rem);
      font-weight: 900; line-height: 1;
      color: var(--green);
      text-shadow: 0 0 40px rgba(0,255,136,.5), 0 0 80px rgba(0,255,136,.15);
      transition: color .12s, text-shadow .12s;
    }
    .mult.crashed {
      color: var(--red);
      text-shadow: 0 0 40px rgba(255,51,85,.6);
      animation: crashJolt .35s ease;
    }
    .mult.cashed {
      color: var(--gold);
      text-shadow: 0 0 40px rgba(255,204,34,.5);
    }
    @keyframes crashJolt {
      0%,100% { transform:scale(1); }
      40%      { transform:scale(1.18) rotate(-2deg); }
    }
    .state-lbl {
      font-size: .7rem; font-weight: 800; letter-spacing: 3px;
      text-transform: uppercase; color: rgba(255,255,255,.45);
    }

    /* Countdown overlay */
    .cd-wrap {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(4,3,15,.55);
      backdrop-filter: blur(3px);
      pointer-events: none;
      transition: opacity .4s;
    }
    .cd-wrap.gone { opacity: 0; pointer-events: none; }
    .cd-big {
      font-family: 'Orbitron', monospace;
      font-size: clamp(3.5rem, 12vw, 6.5rem);
      font-weight: 900; color: var(--green);
      text-shadow: 0 0 50px rgba(0,255,136,.55);
      line-height: 1;
    }
    .cd-sub {
      margin-top: 8px; font-size: .72rem; font-weight: 800;
      letter-spacing: 4px; text-transform: uppercase;
      color: var(--muted);
    }

    /* Green win flash overlay */
    .win-flash {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse, rgba(0,255,136,.18) 0%, transparent 70%);
      transition: opacity .2s;
    }
    .win-flash.on { opacity: 1; }

    /* Red crash flash */
    .crash-flash {
      position: absolute; inset: 0; pointer-events: none;
      background: rgba(255,30,50,.0);
      transition: background .1s;
    }

    /* ─── POOL / FEED BAR ────────────────────────────── */
    .pool-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 13px;
      background: rgba(0,0,0,.3); border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .pool-col { flex-shrink:0; }
    .pool-lbl { font-size:.6rem; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); }
    .pool-num { font-family:'Orbitron',monospace; font-size:.78rem; color:var(--gold); font-weight:700; }
    .sep-line  { width:1px; height:24px; background:var(--border); flex-shrink:0; }
    .feed-mask {
      flex:1; overflow:hidden;
      -webkit-mask-image: linear-gradient(to right,transparent,black 8%,black 92%,transparent);
      mask-image: linear-gradient(to right,transparent,black 8%,black 92%,transparent);
    }
    .feed-track {
      display:flex; gap:8px; width:max-content;
      animation: feedScroll 28s linear infinite;
    }
    @keyframes feedScroll {
      0%   { transform:translateX(0); }
      100% { transform:translateX(-50%); }
    }
    .fc {
      white-space:nowrap; font-size:.7rem; font-weight:700;
      padding:3px 8px; border-radius:6px; flex-shrink:0;
    }
    .fc.bet  { background:rgba(51,170,255,.12); color:var(--blue); }
    .fc.cash { background:rgba(0,255,136,.12);  color:var(--green); }
    .fc.lose { background:rgba(255,51,85,.12);  color:var(--red); }

    /* ─── BET PANEL ──────────────────────────────────── */
    .bet-panel {
      padding: 13px 13px 18px;
      background: rgba(255,255,255,.02);
      display: flex; flex-direction: column; gap: 9px;
      flex-shrink: 0;
    }

    .field-row { display:flex; gap:9px; align-items:flex-end; }
    .field { flex:1; position:relative; display:flex; flex-direction:column; gap:5px; }
    .field-lbl {
      font-size:.62rem; font-weight:800; text-transform:uppercase;
      letter-spacing:1.3px; color:var(--muted);
    }
    .finput {
      width:100%; padding:11px 13px; border-radius:13px;
      border:1.5px solid var(--border);
      background:rgba(255,255,255,.05); color:#fff;
      font-family:'Orbitron',monospace; font-size:.9rem; font-weight:700;
      outline:none; transition:border-color .15s;
    }
    .finput:focus { border-color:rgba(136,85,255,.5); }
    .finput:disabled { opacity:.4; }

    .quick-row { display:flex; gap:6px; flex-wrap:wrap; }
    .qb {
      padding:6px 10px; border-radius:9px;
      background:rgba(255,255,255,.07); color:var(--text);
      font-size:.74rem; font-weight:800;
      transition:background .13s;
    }
    .qb:hover { background:rgba(255,255,255,.16); }

    .auto-row { display:flex; align-items:center; gap:9px; }
    .toggle-wrap { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .tgl-lbl { font-size:.72rem; font-weight:700; color:var(--muted); white-space:nowrap; }
    .tgl {
      width:34px; height:18px; border-radius:9px;
      background:rgba(255,255,255,.12); position:relative;
      cursor:pointer; transition:background .18s;
    }
    .tgl.on { background:var(--purple); }
    .tgl-k {
      position:absolute; top:2px; left:2px;
      width:14px; height:14px; border-radius:50%;
      background:#fff; transition:left .18s;
    }
    .tgl.on .tgl-k { left:18px; }

    /* Main action button */
    .act-btn {
      width:100%; padding:15px; border-radius:15px;
      font-weight:900; font-size:1rem; letter-spacing:.5px;
      color:#fff; transition:all .15s; position:relative; overflow:hidden;
    }
    .act-btn::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.08),transparent);
    }
    .act-btn.s-bet {
      background:linear-gradient(135deg,#7744ee,#33aaff);
      box-shadow:0 10px 32px rgba(119,68,238,.3);
    }
    .act-btn.s-cashout {
      background:linear-gradient(135deg,#00cc66,#00ff88);
      color:#002215;
      box-shadow:0 10px 32px rgba(0,204,102,.35);
      animation:cashPulse 1.1s ease-in-out infinite;
    }
    @keyframes cashPulse {
      0%,100% { box-shadow:0 10px 32px rgba(0,204,102,.35); transform:scale(1); }
      50%      { box-shadow:0 14px 44px rgba(0,255,136,.5);  transform:scale(1.015); }
    }
    .act-btn.s-cancel {
      background:rgba(255,255,255,.09);
      box-shadow:none;
    }
    .act-btn.s-wait {
      background:rgba(255,255,255,.05);
      box-shadow:none; color:var(--muted); cursor:default;
    }
    .act-btn:disabled { opacity:.4; cursor:not-allowed; animation:none; transform:none; }

    .stat-msg {
      text-align:center; font-size:.8rem; font-weight:600;
      color:var(--muted); min-height:17px; line-height:1.4;
    }
    .stat-msg.ok   { color:var(--green); }
    .stat-msg.err  { color:var(--red); }
    .stat-msg.warn { color:var(--gold); }

    /* ─── WIN POPUP ──────────────────────────────────── */
    .win-popup {
      position:fixed; inset:0; z-index:200;
      display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,.75); backdrop-filter:blur(5px);
    }
    .win-popup.show { display:flex; }
    .win-box {
      text-align:center; padding:36px 42px;
      border-radius:28px;
      background:linear-gradient(160deg,#140e38,#0a0620);
      border:1.5px solid rgba(0,255,136,.28);
      box-shadow:0 0 70px rgba(0,255,136,.12), 0 28px 60px rgba(0,0,0,.6);
      animation:wpop .42s cubic-bezier(.2,.7,.3,1.3);
      max-width:320px; width:90%;
    }
    @keyframes wpop {
      0%   { transform:scale(.65); opacity:0; }
      100% { transform:scale(1);   opacity:1; }
    }
    .wp-emo  { font-size:2.8rem; margin-bottom:10px; }
    .wp-title { font-family:'Orbitron',monospace; font-size:1.1rem; font-weight:900; color:var(--green); letter-spacing:2px; }
    .wp-amt   { font-family:'Orbitron',monospace; font-size:2rem; font-weight:900; color:var(--gold); margin:10px 0 5px; }
    .wp-sub   { font-size:.82rem; color:var(--muted); }
    .wp-close {
      margin-top:20px; padding:11px 28px; border-radius:13px;
      background:rgba(255,255,255,.12); color:#fff; font-weight:800;
      font-size:.88rem; transition:background .13s;
    }
    .wp-close:hover { background:rgba(255,255,255,.22); }

    /* ─── TOAST ──────────────────────────────────────── */
    .toast {
      position:fixed; bottom:20px; left:50%;
      transform:translateX(-50%) translateY(14px);
      opacity:0; pointer-events:none;
      background:#110c2e; color:#fff;
      padding:10px 20px; border-radius:999px;
      box-shadow:0 12px 40px rgba(0,0,0,.4);
      transition:opacity .2s, transform .2s;
      z-index:9999; font-size:.85rem; font-weight:700;
    }
    .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

    @media(max-width:480px) {
      .canvas-wrap { min-height:240px; max-height:340px; }
      .cd-big { font-size: 3rem; }
    }
  </style>
</head>

<!-- HEADER -->
<header class="hdr">
  <div class="logo">NUBIA <em>ROCKET</em></div>
  <div class="bal-pill">

    <button class="eye-btn" id="eyeBtn">👁</button>

</div>

<!-- POOL / FEED BAR -->
<div class="pool-bar">
  <div class="pool-col">
    <div class="pool-lbl">POOL</div>
    <div class="pool-num" id="poolNum">–</div>
  </div>
  <div class="sep-line"></div>
  <div class="feed-mask">
    <div class="feed-track" id="feedTrack"></div>
  </div>
</div>

<!-- BET PANEL -->
<div class="bet-panel">

  <div class="field-row">
    <div class="field">
      <div class="field-lbl">Taruhan (coin)</div>
      <input class="finput" type="number" id="betInput" value="1000" min="100" step="100">
    </div>
  </div>

  <div class="quick-row">
    <button class="qb" data-v="500">500</button>
    <button class="qb" data-v="1000">1K</button>

    <button class="qb" data-v="10000">10K</button>
    <button class="qb" data-v="50000">50K</button>
    <button class="qb" id="halfBtn">½</button>
    <button class="qb" id="doubleBtn">×2</button>
    <button class="qb" id="maxBtn">MAX</button>
  </div>

  <div class="auto-row">
    <div class="field" style="flex:1">
      <div class="field-lbl">Auto Cashout</div>
      <input class="finput" type="number" id="autoInput" value="2.00" min="1.01" step="0.01">

    <div class="toggle-wrap">
      <span class="tgl-lbl">Auto</span>
      <div class="tgl" id="autoTgl"><div class="tgl-k"></div></div>
    </div>
  </div>

  <button class="act-btn s-bet" id="actBtn" disabled>PASANG TARUHAN</button>
  <div class="stat-msg" id="statMsg">Login untuk mulai bermain</div>

</div>

<!-- WIN POPUP -->
<div class="win-popup" id="winPopup">
  <div class="win-box">
    <div class="wp-emo">🚀💰</div>
    <div class="wp-title">CASHOUT!</div>
    <div class="wp-amt" id="wpAmt">+0</div>
    <div class="wp-sub" id="wpSub">pada 1.00×</div>
    <button class="wp-close" id="wpClose">Lanjut</button>
  </div>
</div>

<div class="toast" id="toastEl"></div>
