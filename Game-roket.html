<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUBIA ROCKET</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #04030f;
      --panel:  rgba(255,255,255,.04);
      --border: rgba(255,255,255,.08);
      --text:   #ddd8ff;
      --muted:  #5c5890;
      --green:  #00ff88;
      --red:    #ff3355;
      --gold:   #ffcc22;
      --purple: #8855ff;
      --blue:   #33aaff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      min-height: 100%; overflow-x: hidden;
    }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    input  { font: inherit; }

    /* ─── HEADER ─────────────────────────────────────── */
    .hdr {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; position: relative; z-index: 20;
      background: rgba(4,3,15,.9);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .logo {
      font-family: 'Orbitron', monospace; font-size: .88rem;
      font-weight: 900; letter-spacing: 2.5px; flex: 1;
      color: #fff;
    }
    .logo em { color: var(--green); font-style: normal; }
    .bal-pill {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 13px; border-radius: 999px;
      background: rgba(255,255,255,.06); border: 1px solid var(--border);
      font-weight: 700; font-size: .85rem;
    }
    .bal-num {
      font-family: 'Orbitron', monospace; font-size: .85rem;
      color: var(--green); transition: filter .2s; min-width: 70px;
    }
    .blr { filter: blur(6px); user-select: none; }
    .hbtn {
      border-radius: 999px; padding: 7px 13px; font-weight: 700;
      font-size: .78rem; background: rgba(255,255,255,.08); color: var(--text);
      transition: background .14s;
    }
    .hbtn:hover { background: rgba(255,255,255,.16); }
    .hbtn.primary { background: linear-gradient(135deg,var(--purple),var(--blue)); color:#fff; }
    .uid-row { width:100%; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .uid-txt  { font-size:.65rem; color:var(--muted); word-break:break-all; max-width:300px; }
    .uid-copy { padding:3px 8px; border-radius:6px; background:rgba(255,255,255,.08); color:var(--text); font-size:.65rem; font-weight:700; }
    .eye-btn  { color:var(--muted); font-size:.78rem; padding:0 2px; }

    /* ─── CANVAS AREA ────────────────────────────────── */
    .canvas-wrap {
      position: relative; width: 100%;
      flex: 1; min-height: 280px; max-height: 420px;
      overflow: hidden; background: #04030f;
    }
    #gc { display:block; width:100%; height:100%; }

    /* Overlays sit on top of canvas */
    .mult-wrap {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none; gap: 6px;
    }
    .mult {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2.6rem, 8vw, 4.2rem);
      font-weight: 900; line-height: 1;
      color: var(--green);
      text-shadow: 0 0 40px rgba(0,255,136,.5), 0 0 80px rgba(0,255,136,.15);
      transition: color .12s, text-shadow .12s;
    }
    .mult.crashed {
      color: var(--red);
      text-shadow: 0 0 40px rgba(255,51,85,.6);
      animation: crashJolt .35s ease;
    }
    .mult.cashed {
      color: var(--gold);
      text-shadow: 0 0 40px rgba(255,204,34,.5);
    }
    @keyframes crashJolt {
      0%,100% { transform:scale(1); }
      40%      { transform:scale(1.18) rotate(-2deg); }
    }
    .state-lbl {
      font-size: .7rem; font-weight: 800; letter-spacing: 3px;
      text-transform: uppercase; color: rgba(255,255,255,.45);
    }

    /* Countdown overlay */
    .cd-wrap {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(4,3,15,.55);
      backdrop-filter: blur(3px);
      pointer-events: none;
      transition: opacity .4s;
    }
    .cd-wrap.gone { opacity: 0; pointer-events: none; }
    .cd-big {
      font-family: 'Orbitron', monospace;
      font-size: clamp(3.5rem, 12vw, 6.5rem);
      font-weight: 900; color: var(--green);
      text-shadow: 0 0 50px rgba(0,255,136,.55);
      line-height: 1;
    }
    .cd-sub {
      margin-top: 8px; font-size: .72rem; font-weight: 800;
      letter-spacing: 4px; text-transform: uppercase;
      color: var(--muted);
    }

    /* Green win flash overlay */
    .win-flash {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse, rgba(0,255,136,.18) 0%, transparent 70%);
      transition: opacity .2s;
    }
    .win-flash.on { opacity: 1; }

    /* Red crash flash */
    .crash-flash {
      position: absolute; inset: 0; pointer-events: none;
      background: rgba(255,30,50,.0);
      transition: background .1s;
    }

    /* ─── POOL / FEED BAR ────────────────────────────── */
    .pool-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 13px;
      background: rgba(0,0,0,.3); border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .pool-col { flex-shrink:0; }
    .pool-lbl { font-size:.6rem; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); }
    .pool-num { font-family:'Orbitron',monospace; font-size:.78rem; color:var(--gold); font-weight:700; }
    .sep-line  { width:1px; height:24px; background:var(--border); flex-shrink:0; }
    .feed-mask {
      flex:1; overflow:hidden;
      -webkit-mask-image: linear-gradient(to right,transparent,black 8%,black 92%,transparent);
      mask-image: linear-gradient(to right,transparent,black 8%,black 92%,transparent);
    }
    .feed-track {
      display:flex; gap:8px; width:max-content;
      animation: feedScroll 28s linear infinite;
    }
    @keyframes feedScroll {
      0%   { transform:translateX(0); }
      100% { transform:translateX(-50%); }
    }
    .fc {
      white-space:nowrap; font-size:.7rem; font-weight:700;
      padding:3px 8px; border-radius:6px; flex-shrink:0;
    }
    .fc.bet  { background:rgba(51,170,255,.12); color:var(--blue); }
    .fc.cash { background:rgba(0,255,136,.12);  color:var(--green); }
    .fc.lose { background:rgba(255,51,85,.12);  color:var(--red); }

    /* ─── BET PANEL ──────────────────────────────────── */
    .bet-panel {
      padding: 13px 13px 18px;
      background: rgba(255,255,255,.02);
      display: flex; flex-direction: column; gap: 9px;
      flex-shrink: 0;
    }

    .field-row { display:flex; gap:9px; align-items:flex-end; }
    .field { flex:1; position:relative; display:flex; flex-direction:column; gap:5px; }
    .field-lbl {
      font-size:.62rem; font-weight:800; text-transform:uppercase;
      letter-spacing:1.3px; color:var(--muted);
    }
    .finput {
      width:100%; padding:11px 13px; border-radius:13px;
      border:1.5px solid var(--border);
      background:rgba(255,255,255,.05); color:#fff;
      font-family:'Orbitron',monospace; font-size:.9rem; font-weight:700;
      outline:none; transition:border-color .15s;
    }
    .finput:focus { border-color:rgba(136,85,255,.5); }
    .finput:disabled { opacity:.4; }

    .quick-row { display:flex; gap:6px; flex-wrap:wrap; }
    .qb {
      padding:6px 10px; border-radius:9px;
      background:rgba(255,255,255,.07); color:var(--text);
      font-size:.74rem; font-weight:800;
      transition:background .13s;
    }
    .qb:hover { background:rgba(255,255,255,.16); }

    .auto-row { display:flex; align-items:center; gap:9px; }
    .toggle-wrap { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .tgl-lbl { font-size:.72rem; font-weight:700; color:var(--muted); white-space:nowrap; }
    .tgl {
      width:34px; height:18px; border-radius:9px;
      background:rgba(255,255,255,.12); position:relative;
      cursor:pointer; transition:background .18s;
    }
    .tgl.on { background:var(--purple); }
    .tgl-k {
      position:absolute; top:2px; left:2px;
      width:14px; height:14px; border-radius:50%;
      background:#fff; transition:left .18s;
    }
    .tgl.on .tgl-k { left:18px; }

    /* Main action button */
    .act-btn {
      width:100%; padding:15px; border-radius:15px;
      font-weight:900; font-size:1rem; letter-spacing:.5px;
      color:#fff; transition:all .15s; position:relative; overflow:hidden;
    }
    .act-btn::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.08),transparent);
    }
    .act-btn.s-bet {
      background:linear-gradient(135deg,#7744ee,#33aaff);
      box-shadow:0 10px 32px rgba(119,68,238,.3);
    }
    .act-btn.s-cashout {
      background:linear-gradient(135deg,#00cc66,#00ff88);
      color:#002215;
      box-shadow:0 10px 32px rgba(0,204,102,.35);
      animation:cashPulse 1.1s ease-in-out infinite;
    }
    @keyframes cashPulse {
      0%,100% { box-shadow:0 10px 32px rgba(0,204,102,.35); transform:scale(1); }
      50%      { box-shadow:0 14px 44px rgba(0,255,136,.5);  transform:scale(1.015); }
    }
    .act-btn.s-cancel {
      background:rgba(255,255,255,.09);
      box-shadow:none;
    }
    .act-btn.s-wait {
      background:rgba(255,255,255,.05);
      box-shadow:none; color:var(--muted); cursor:default;
    }
    .act-btn:disabled { opacity:.4; cursor:not-allowed; animation:none; transform:none; }

    .stat-msg {
      text-align:center; font-size:.8rem; font-weight:600;
      color:var(--muted); min-height:17px; line-height:1.4;
    }
    .stat-msg.ok   { color:var(--green); }
    .stat-msg.err  { color:var(--red); }
    .stat-msg.warn { color:var(--gold); }

    /* ─── WIN POPUP ──────────────────────────────────── */
    .win-popup {
      position:fixed; inset:0; z-index:200;
      display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,.75); backdrop-filter:blur(5px);
    }
    .win-popup.show { display:flex; }
    .win-box {
      text-align:center; padding:36px 42px;
      border-radius:28px;
      background:linear-gradient(160deg,#140e38,#0a0620);
      border:1.5px solid rgba(0,255,136,.28);
      box-shadow:0 0 70px rgba(0,255,136,.12), 0 28px 60px rgba(0,0,0,.6);
      animation:wpop .42s cubic-bezier(.2,.7,.3,1.3);
      max-width:320px; width:90%;
    }
    @keyframes wpop {
      0%   { transform:scale(.65); opacity:0; }
      100% { transform:scale(1);   opacity:1; }
    }
    .wp-emo  { font-size:2.8rem; margin-bottom:10px; }
    .wp-title { font-family:'Orbitron',monospace; font-size:1.1rem; font-weight:900; color:var(--green); letter-spacing:2px; }
    .wp-amt   { font-family:'Orbitron',monospace; font-size:2rem; font-weight:900; color:var(--gold); margin:10px 0 5px; }
    .wp-sub   { font-size:.82rem; color:var(--muted); }
    .wp-close {
      margin-top:20px; padding:11px 28px; border-radius:13px;
      background:rgba(255,255,255,.12); color:#fff; font-weight:800;
      font-size:.88rem; transition:background .13s;
    }
    .wp-close:hover { background:rgba(255,255,255,.22); }

    /* ─── TOAST ──────────────────────────────────────── */
    .toast {
      position:fixed; bottom:20px; left:50%;
      transform:translateX(-50%) translateY(14px);
      opacity:0; pointer-events:none;
      background:#110c2e; color:#fff;
      padding:10px 20px; border-radius:999px;
      box-shadow:0 12px 40px rgba(0,0,0,.4);
      transition:opacity .2s, transform .2s;
      z-index:9999; font-size:.85rem; font-weight:700;
    }
    .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

    @media(max-width:480px) {
      .canvas-wrap { min-height:240px; max-height:340px; }
      .cd-big { font-size: 3rem; }
    }
  </style>
</head>

</div>

<!-- WIN POPUP -->
<div class="win-popup" id="winPopup">
  <div class="win-box">
    <div class="wp-emo">🚀💰</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ── Firebase ──────────────────────────────────────── */

  apiKey:'AIzaSyA3KhNSK0AaKYvXuZE9hi0ZRN9Ysmh9aXc',
  authDomain:'zestoreid-f9e85.firebaseapp.com',

  storageBucket:'zestoreid-f9e85.firebasestorage.app',
  messagingSenderId:'426093692154',
  appId:'1:426093692154:web:38c6e9c143af626a623543'
});
const auth = getAuth(fb);
const db   = getFirestore(fb);

/* ── DOM ───────────────────────────────────────────── */
const $        = id => document.getElementById(id);
const canvas   = $('gc');
const ctx      = canvas.getContext('2d');
const balNum   = $('balNum');
const eyeBtn   = $('eyeBtn');
const authBtn  = $('authBtn');
const uidRow   = $('uidRow');
const uidTxt   = $('uidTxt');
const copyBtn  = $('copyBtn');
const multEl   = $('multEl');
const stateLbl = $('stateLbl');
const cdWrap   = $('cdWrap');
const cdNum    = $('cdNum');
const winFlash = $('winFlash');
const crashFlashEl = $('crashFlash');
const poolNum  = $('poolNum');
const feedTrack= $('feedTrack');
const betInput = $('betInput');
const autoInput= $('autoInput');
const autoTgl  = $('autoTgl');
const actBtn   = $('actBtn');
const statMsg  = $('statMsg');
const winPopup = $('winPopup');
const wpAmt    = $('wpAmt');
const wpSub    = $('wpSub');
const wpClose  = $('wpClose');
const toastEl  = $('toastEl');

/* ── FAKE PLAYER POOL (300 random IDs) ─────────────── */
const _al  = 'abcdefghijklmnopqrstuvwxyz';
const _aln = _al + '0123456789';
const FP_IDS = Array.from({length:300}, () => {
  const a = Array.from({length:2}, ()=> _al[Math.random()*26|0]).join('');
  const b = Array.from({length:4}, ()=> _aln[Math.random()*36|0]).join('');
  return `${a}_${b}`;
});

/* ── CONSTANTS ─────────────────────────────────────── */
const COUNTDOWN='countdown', FLYING='flying', CRASHED='crashed';
const MIN_BET = 100;
const HIGH_BET_RATIO = 0.20;   // threshold: bet > 20% of balance

/* ── STATE ─────────────────────────────────────────── */
let currentUser = null;
let walletUnsub = null;
let coin        = 0;
let blurred     = false;
let gState      = CRASHED;  // start in crashed so first round is natural
let hasBet      = false;
let betAmt      = 0;
let originalBal = 0;   // balance before bet (for ratio calc)
let crashPoint  = 2.0;
let currentMult = 1.0;
let flightStart = 0;
let cdSec       = 10;
let cdTimer     = null;
let roundNo     = 1;
let totalPool   = 0;
let autoEnabled = false;
let autoCashAt  = 2.0;
let fakeBetsPool  = [];
let feedItems     = [];    // current feed chips (doubled for marquee)
let animFrame   = null;
let stars       = [];
let particles   = [];
let trailPts    = [];
let rxLast=0, ryLast=0;   // last rocket pixel pos
let crashX=0, crashY=0;   // crash position on canvas
let cShake = 0;
let crashFlashA = 0;
let preLaunchT  = 0;

/* ── Utils ─────────────────────────────────────────── */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const r2    = n  => Math.round(Number(n||0)*100)/100;
const fmtC  = n  => Number(n||0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
function fmtShort(n) {
  if(n>=1e9)  return (n/1e9).toFixed(1)+'B';
  if(n>=1e6)  return (n/1e6).toFixed(1)+'M';
  if(n>=1000) return (n/1000).toFixed(1)+'K';
  return String(Math.floor(n));
}

function toast(msg, dur=1700) {
  toastEl.textContent=msg; toastEl.classList.add('on');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>toastEl.classList.remove('on'),dur);
}
function setMsg(msg,type='') {
  statMsg.textContent=msg||''; statMsg.className='stat-msg'+(type?' '+type:'');
}

/* ── PROBABILITY ENGINE ────────────────────────────────
   High bet (>20% balance): 85% crash ≤1.40×, 15% higher
   Low bet  (≤20% balance): 30% crash ≤1.30×, 70% higher
   "Higher" for low bets still skews toward 1.6-4x,
   human greed prevents cashing out → balance drains slowly
──────────────────────────────────────────────────────── */
function generateCrashPoint(bet, balance) {
  const ratio = bet / Math.max(balance, 1);
  const r = Math.random();

  if (ratio > HIGH_BET_RATIO) {
    // High stake → mostly instant death
    if (r < 0.85) {
      // Crash at 1.01 – 1.40× (lose bet immediately)
      return 1.01 + Math.random() * 0.39;
    } else {
      // Rare chance – but skewed toward low
      const t = Math.random();
      return 1.4 + Math.pow(t, 1.8) * 8.6; // mostly near 1.4
    }
  } else {
    // Low stake
    if (r < 0.30) {
      // 30% early crash
      return 1.01 + Math.random() * 0.29;
    } else {
      // 70% it flies – but random enough to tease greed
      const t = Math.random();
      // Uniformly 1.5–7x: user wants 5x but crashes at 2x
      return 1.5 + t * 5.5;
    }
  }
}

/* Multiplier formula (exponential, classic crash):
   mult(t) = e^(0.1 * t)  where t = seconds elapsed
   2× at ~6.9s, 3× at ~11s, 5× at ~16.1s            */
function multAtTime(ms) {
  return Math.exp(0.1 * ms / 1000);
}
function timeForMult(m) {
  return Math.log(m) / 0.1 * 1000; // ms
}

/* ── CANVAS RESIZE ─────────────────────────────────── */
function resizeCanvas() {
  const w = canvas.parentElement.clientWidth;
  const h = canvas.parentElement.clientHeight;
  canvas.width  = w;
  canvas.height = h;
  initStars();
}

/* ── STARS ─────────────────────────────────────────── */
function initStars() {
  const W=canvas.width, H=canvas.height;
  stars = Array.from({length:140}, () => ({
    x:   Math.random()*W,
    y:   Math.random()*H,
    r:   Math.random()*1.3+0.25,
    a:   Math.random()*0.55+0.15,
    tw:  Math.random()*Math.PI*2,
    spd: Math.random()*0.35+0.08
  }));
}
function tickStars(speed) {
  stars.forEach(s => {
    s.tw += 0.025;
    s.y  += speed * s.spd;
    if (s.y > canvas.height) { s.y=0; s.x=Math.random()*canvas.width; }
    const a = s.a * (0.65 + 0.35*Math.sin(s.tw));
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${a.toFixed(3)})`; ctx.fill();
  });
}

/* ── ROCKET DRAWING ────────────────────────────────── */
function drawRocket(x, y, angle, withFlame) {
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
  const sc = Math.min(canvas.width/520, 1.0);
  ctx.scale(sc,sc);

  /* Glow halo */
  if (withFlame) {
    const g=ctx.createRadialGradient(0,0,4,0,0,55);
    g.addColorStop(0,'rgba(119,68,255,.28)'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,55,0,Math.PI*2); ctx.fill();
  }

  /* Flame */
  if (withFlame) {
    const fh = 30 + Math.random()*22;
    const fg = ctx.createLinearGradient(0,16,0,16+fh);
    fg.addColorStop(0,'#fff0aa');
    fg.addColorStop(0.3,'#ff9933');
    fg.addColorStop(1,'rgba(255,60,0,0)');
    ctx.fillStyle=fg;
    ctx.beginPath();
    ctx.moveTo(-7,14);
    ctx.quadraticCurveTo(-12,16+fh*.45,-2,16+fh);
    ctx.quadraticCurveTo(0,16+fh+5,2,16+fh);
    ctx.quadraticCurveTo(12,16+fh*.45,7,14);
    ctx.closePath(); ctx.fill();
    /* inner bright core */
    const fg2=ctx.createLinearGradient(0,14,0,14+fh*.45);
    fg2.addColorStop(0,'rgba(255,255,220,.9)'); fg2.addColorStop(1,'rgba(255,200,60,0)');
    ctx.fillStyle=fg2;
    ctx.beginPath(); ctx.ellipse(0,14+fh*.15,4,fh*.22,0,0,Math.PI*2); ctx.fill();
  }

  /* Body */
  ctx.fillStyle='#d8d0ff';
  ctx.beginPath();
  ctx.moveTo(0,-36);
  ctx.bezierCurveTo(13,-22,13,0,11,14);
  ctx.lineTo(-11,14);
  ctx.bezierCurveTo(-13,0,-13,-22,0,-36);
  ctx.closePath(); ctx.fill();

  /* Shading */
  const bg=ctx.createLinearGradient(-13,0,13,0);
  bg.addColorStop(0,'rgba(0,0,0,.18)'); bg.addColorStop(.35,'rgba(255,255,255,.12)');
  bg.addColorStop(1,'rgba(0,0,0,.22)');
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.moveTo(0,-36); ctx.bezierCurveTo(13,-22,13,0,11,14);
  ctx.lineTo(-11,14); ctx.bezierCurveTo(-13,0,-13,-22,0,-36);
  ctx.closePath(); ctx.fill();

  /* Accent stripe */
  ctx.fillStyle='rgba(136,85,255,.75)';
  ctx.beginPath(); ctx.roundRect(-11,-3,22,7,3); ctx.fill();

  /* Porthole */
  const wg=ctx.createRadialGradient(-1.5,-13,1,-1.5,-13,7.5);
  wg.addColorStop(0,'#aaddff'); wg.addColorStop(1,'#1155aa');
  ctx.fillStyle=wg;
  ctx.beginPath(); ctx.arc(0,-13,7.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.arc(-2,-15,3,0,Math.PI*2); ctx.fill();

  /* Fins */
  ctx.fillStyle='#7744ee';
  /* Left */
  ctx.beginPath(); ctx.moveTo(-11,7); ctx.lineTo(-24,19); ctx.lineTo(-15,21); ctx.lineTo(-11,14); ctx.closePath(); ctx.fill();
  /* Right */
  ctx.beginPath(); ctx.moveTo(11,7);  ctx.lineTo(24,19);  ctx.lineTo(15,21);  ctx.lineTo(11,14);  ctx.closePath(); ctx.fill();

  ctx.restore();
}

/* ── LAUNCHPAD ─────────────────────────────────────── */
function drawPad(x, y) {
  ctx.fillStyle='rgba(180,160,255,.18)';
  ctx.fillRect(x-32,y+18,64,10);
  ctx.fillStyle='rgba(136,85,255,.3)';
  ctx.fillRect(x-42,y+26,84,4);
  ctx.strokeStyle='rgba(180,160,255,.25)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(x-18,y+18); ctx.lineTo(x-34,y+32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+18,y+18);  ctx.lineTo(x+34,y+32);  ctx.stroke();
}

/* ── ROCKET POSITION FROM MULT ─────────────────────── */
function rocketPos(m) {
  const W=canvas.width, H=canvas.height;
  const MAX=12;
  const t=Math.min((m-1)/(MAX-1),1.0);
  const x = W*(0.10 + t*0.76);
  // Quadratic arc up
  const y = H*(0.83 - t*0.72 - t*t*0.09);
  return {x,y};
}

/* ── TRAIL ─────────────────────────────────────────── */
function drawTrail() {
  if(trailPts.length<2) return;
  for(let i=1;i<trailPts.length;i++) {
    const a=(i/trailPts.length)*0.55;
    ctx.strokeStyle=`rgba(119,68,255,${a.toFixed(3)})`;
    ctx.lineWidth=(i/trailPts.length)*3.5;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(trailPts[i-1].x,trailPts[i-1].y);
    ctx.lineTo(trailPts[i].x,trailPts[i].y);
    ctx.stroke();
  }
}

/* ── PARTICLES ─────────────────────────────────────── */
function spawnParticles(x,y) {
  const COLS=['#ff3333','#ff8844','#ffcc22','#ff2200','#ffffff','#ff6600'];
  for(let i=0;i<70;i++) {
    const ang=Math.random()*Math.PI*2;
    const spd=Math.random()*9+1.5;
    particles.push({
      x,y,
      vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-5,
      r:Math.random()*5.5+1,
      a:1, col:COLS[Math.random()*COLS.length|0], g:0.28
    });
  }
}
function tickParticles() {
  particles = particles.filter(p=>p.a>0.02);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g;
    p.a*=0.93; p.r*=0.97;
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(.3,p.r),0,Math.PI*2);
    const hex=Math.floor(p.a*255).toString(16).padStart(2,'0');
    ctx.fillStyle=p.col+hex; ctx.fill();
  });
}

/* ── MAIN DRAW LOOP ────────────────────────────────── */
function drawLoop() {
  animFrame = requestAnimationFrame(drawLoop);
  const W=canvas.width, H=canvas.height;
  if(!W||!H) return;

  /* Camera shake */
  let sx=0,sy=0;
  if(cShake>0.05) {
    sx=(Math.random()-.5)*cShake*9; sy=(Math.random()-.5)*cShake*9;
    cShake*=0.86; ctx.save(); ctx.translate(sx,sy);
  }

  /* Background */
  ctx.fillStyle='#04030f'; ctx.fillRect(0,0,W,H);

  /* Nebula clouds */
  const n1=ctx.createRadialGradient(W*.28,H*.35,8,W*.28,H*.35,W*.55);
  n1.addColorStop(0,'rgba(55,15,110,.16)'); n1.addColorStop(1,'transparent');
  ctx.fillStyle=n1; ctx.fillRect(0,0,W,H);
  const n2=ctx.createRadialGradient(W*.78,H*.65,8,W*.78,H*.65,W*.38);
  n2.addColorStop(0,'rgba(10,50,90,.13)'); n2.addColorStop(1,'transparent');
  ctx.fillStyle=n2; ctx.fillRect(0,0,W,H);

  /* Stars */
  const starSpd = gState===FLYING ? 2.2 : (gState===CRASHED ? 0 : 0.15);
  tickStars(starSpd);

  /* Planet (decorative) */
  ctx.save(); ctx.globalAlpha=.1;
  const pg=ctx.createRadialGradient(W*.88,H*.88,0,W*.88,H*.88,95);
  pg.addColorStop(0,'#7744ee'); pg.addColorStop(1,'transparent');
  ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(W*.88,H*.88,95,0,Math.PI*2); ctx.fill();
  ctx.restore();

  /* ── State-specific rendering ── */
  if(gState===COUNTDOWN) {
    preLaunchT+=0.055;
    const lx=W*0.12, ly=H*0.83;
    const wobble=Math.sin(preLaunchT*3)*(1.8+1.8*((10-cdSec)/10));

    /* Pad glow */
    const glowA=0.08+0.12*Math.abs(Math.sin(preLaunchT*5));
    const gg=ctx.createRadialGradient(lx,ly+28,0,lx,ly+28,65);
    gg.addColorStop(0,`rgba(136,85,255,${glowA})`); gg.addColorStop(1,'transparent');
    ctx.fillStyle=gg; ctx.fillRect(0,0,W,H);

    /* Pre-launch flicker */
    if(cdSec<=5) {
      const fh=8+Math.random()*10;
      const ff=ctx.createLinearGradient(lx,ly+18,lx,ly+18-fh);
      ff.addColorStop(0,'rgba(255,140,40,.65)'); ff.addColorStop(1,'transparent');
      ctx.fillStyle=ff; ctx.beginPath(); ctx.ellipse(lx,ly+18,6,fh/2,0,0,Math.PI*2); ctx.fill();
    }

    drawPad(lx,ly+18);
    drawRocket(lx+wobble,ly,-Math.PI/32,false);

  } else if(gState===FLYING) {
    const elapsed=Date.now()-flightStart;
    currentMult=multAtTime(elapsed);

    /* Auto cashout */
    if(hasBet && autoEnabled && currentMult>=autoCashAt) triggerCashout();
    /* Crash check */
    if(currentMult>=crashPoint) { triggerCrash(); return; }

    const {x,y}=rocketPos(currentMult);
    rxLast=x; ryLast=y;

    /* Angle from trajectory */
    const {x:x2,y:y2}=rocketPos(currentMult+0.05);
    const angle=Math.atan2(y2-y,x2-x)+Math.PI/2-Math.PI/6;

    trailPts.push({x,y});
    if(trailPts.length>90) trailPts.shift();

    drawTrail();
    drawRocket(x,y,angle,true);

    /* Update UI */
    multEl.textContent=currentMult.toFixed(2)+'×';
    multEl.className='mult';
    stateLbl.textContent='TERBANG!';

  } else if(gState===CRASHED) {
    drawTrail();
    tickParticles();
    if(crashFlashA>0) {
      ctx.fillStyle=`rgba(255,20,40,${crashFlashA.toFixed(3)})`;
      ctx.fillRect(0,0,W,H); crashFlashA-=0.035;
    }
  }

  if(cShake>0.05) ctx.restore();
}

/* ── GAME FLOW ──────────────────────────────────────── */

/* Start countdown (new round) */
function startRound() {
  gState=COUNTDOWN;
  cdSec=10;
  hasBet=false; betAmt=0; originalBal=0;
  currentMult=1.0;
  trailPts=[]; particles=[]; preLaunchT=0;
  roundNo++;
  crashPoint=null;

  cdWrap.classList.remove('gone');
  cdNum.textContent=cdSec;
  multEl.textContent='1.00×';
  multEl.className='mult';
  stateLbl.textContent='MENUNGGU...';

  /* Generate fake bets for this round */
  spawnFakeBets();
  updateBetUI();

  cdTimer=setInterval(()=>{
    cdSec--;
    cdNum.textContent=cdSec;
    if(cdSec<=0) { clearInterval(cdTimer); startFlight(); }
  },1000);
}

/* Transition to flight */
function startFlight() {
  gState=FLYING;
  flightStart=Date.now();
  cdWrap.classList.add('gone');

  /* Generate crash point based on user's bet */
  if(hasBet) {
    crashPoint=generateCrashPoint(betAmt, originalBal);
  } else {
    /* Spectator round – random crash for show */
    const r=Math.random();
    if(r<0.3)      crashPoint=1.01+Math.random()*0.5;
    else if(r<0.6) crashPoint=1.5+Math.random()*2;
    else            crashPoint=3+Math.random()*6;
  }

  scheduleFakeCashouts();
  updateBetUI();
}

/* Trigger crash */
function triggerCrash() {
  if(gState===CRASHED) return;
  gState=CRASHED;
  currentMult=crashPoint;
  crashX=rxLast; crashY=ryLast;
  spawnParticles(crashX,crashY);
  cShake=2.5;
  crashFlashA=0.45;

  multEl.textContent=currentMult.toFixed(2)+'×';
  multEl.className='mult crashed';
  stateLbl.textContent='MELEDAK!';

  if(hasBet) {
    /* User lost their bet (already deducted) */
    pushFeed('lose',`Kamu CRASH di ${currentMult.toFixed(2)}× −${fmtShort(betAmt)}`);
    setMsg(`Meledak di ${currentMult.toFixed(2)}×. Kehilangan ${fmtC(betAmt)} coin.`,'err');
    hasBet=false;
  }

  updateBetUI();
  setTimeout(()=>startRound(), 3800);
}

/* Trigger cashout */
function triggerCashout() {
  if(!hasBet||gState!==FLYING) return;
  const m=currentMult;
  const received=Math.floor(betAmt*m);
  const profit=received-betAmt;
  hasBet=false;
  updateBetUI();

  adjCoin(received,'cashout',{round:roundNo,mult:m,bet:betAmt})
    .then(()=>{
      multEl.className='mult cashed';
      winFlash.classList.add('on');
      setTimeout(()=>winFlash.classList.remove('on'),480);

      wpAmt.textContent=`+${fmtC(profit)} coin`;
      wpSub.textContent=`pada ${m.toFixed(2)}× | total diterima ${fmtC(received)}`;
      winPopup.classList.add('show');

      pushFeed('cash',`Kamu CASHOUT ${m.toFixed(2)}× +${fmtShort(profit)}`);
      setMsg(`Cashout ${m.toFixed(2)}×! +${fmtC(profit)} coin.`,'ok');
    })
    .catch(e=>{ console.error(e); setMsg(e.message||'Cashout gagal.','err'); });
}

/* Place bet */
async function placeBet() {
  if(!currentUser)        { setMsg('Login Google dulu.','err'); return; }
  if(gState!==COUNTDOWN)  { setMsg('Tunggu ronde berikutnya.','warn'); return; }
  if(hasBet)              { setMsg('Taruhan sudah dipasang.','warn'); return; }

  const amt=Math.floor(Number(betInput.value)||0);
  if(amt<MIN_BET) { setMsg(`Minimum taruhan ${MIN_BET} coin.`,'err'); return; }
  if(amt>coin)    { setMsg('Coin tidak cukup.','err'); return; }

  try {
    setMsg('Memproses taruhan…','warn');
    originalBal=coin; // save before deduction
    await adjCoin(-amt,'bet_placed',{round:roundNo,bet:amt});
    betAmt=amt; hasBet=true;
    updateBetUI();
    setMsg(`Taruhan ${fmtC(amt)} coin terpasang. Siap terbang!`,'ok');
    pushFeed('bet',`Kamu bet ${fmtShort(amt)}`);
  } catch(e) {
    console.error(e); setMsg(e.message||'Gagal pasang taruhan.','err');
  }
}

/* Cancel bet (only during countdown, before flight) */
async function cancelBet() {
  if(!hasBet||gState!==COUNTDOWN) return;
  try {
    await adjCoin(betAmt,'bet_cancel',{round:roundNo});
    hasBet=false; betAmt=0; originalBal=0;
    updateBetUI();
    setMsg('Taruhan dibatalkan.','warn');
  } catch(e) { setMsg(e.message||'Gagal batal.','err'); }
}

/* ── BET UI STATE ───────────────────────────────────── */
function updateBetUI() {
  autoCashAt=Math.max(1.01,parseFloat(autoInput.value)||2.0);

  if(!currentUser) {
    actBtn.className='act-btn s-bet'; actBtn.textContent='PASANG TARUHAN';
    actBtn.disabled=true; return;
  }

  if(gState===COUNTDOWN && !hasBet) {
    actBtn.className='act-btn s-bet'; actBtn.textContent='🚀 PASANG TARUHAN';
    actBtn.disabled=false;
    betInput.disabled=false; autoInput.disabled=false;
  } else if(gState===COUNTDOWN && hasBet) {
    actBtn.className='act-btn s-cancel'; actBtn.textContent='✕ BATALKAN';
    actBtn.disabled=false;
    betInput.disabled=true; autoInput.disabled=true;
  } else if(gState===FLYING && hasBet) {
    actBtn.className='act-btn s-cashout'; actBtn.textContent='💰 CASHOUT';
    actBtn.disabled=false;
    betInput.disabled=true; autoInput.disabled=true;
  } else {
    actBtn.className='act-btn s-wait'; actBtn.textContent='Menunggu ronde...';
    actBtn.disabled=true;
    betInput.disabled=gState===FLYING;
    autoInput.disabled=gState===FLYING;
  }
}

/* ── FAKE PLAYER SYSTEM ─────────────────────────────── */
function randomBetAmt() {
  const t=Math.random();
  if(t<0.38) return 500+Math.random()*4500|0;
  if(t<0.65) return 5000+Math.random()*45000|0;
  if(t<0.85) return 50000+Math.random()*200000|0;
  if(t<0.95) return 250000+Math.random()*750000|0;
  return 1000000+Math.random()*9000000|0;
}

function spawnFakeBets() {
  /* Base pool amount for this round */
  totalPool = 2_000_000 + Math.random()*18_000_000 | 0;
  poolNum.textContent=fmtShort(totalPool);

  const count=45+Math.random()*80|0;
  const ids=[...FP_IDS].sort(()=>Math.random()-.5).slice(0,count);
  fakeBetsPool=ids.map(id=>({id,bet:randomBetAmt()}));

  /* Feed chips: spread bets across 9.5s */
  fakeBetsPool.forEach((fp,i)=>{
    const delay=(i/fakeBetsPool.length)*9400+Math.random()*400;
    setTimeout(()=>{
      if(gState!==COUNTDOWN) return;
      totalPool+=fp.bet;
      poolNum.textContent=fmtShort(totalPool);
      pushFeed('bet',`${fp.id} bet ${fmtShort(fp.bet)}`);
    }, delay);
  });
}

function scheduleFakeCashouts() {
  /* 35–65% of fake bettors cash out before crash */
  const pct=0.35+Math.random()*0.30;
  const cashers=[...fakeBetsPool].sort(()=>Math.random()-.5)
    .slice(0,Math.floor(fakeBetsPool.length*pct));

  cashers.forEach(fp=>{
    /* Random cashout mult between 1.10 and crashPoint*0.88 */
    const maxC=Math.max(1.12,(crashPoint||2)*0.88);
    const m=1.10+Math.random()*(maxC-1.10);
    const delay=timeForMult(m)+Math.random()*300; // slight jitter
    setTimeout(()=>{
      if(gState!==FLYING) return;
      const profit=Math.floor(fp.bet*(m-1));
      pushFeed('cash',`${fp.id} ×${m.toFixed(2)} +${fmtShort(profit)}`);
    }, delay);
  });

  /* Remaining "bust" notifications shown at crash */
  setTimeout(()=>{
    if(gState!==CRASHED) return;
    const busted=fakeBetsPool.filter(fp=>!cashers.includes(fp)).slice(0,8);
    busted.forEach((fp,i)=>{
      setTimeout(()=>pushFeed('lose',`${fp.id} CRASH −${fmtShort(fp.bet)}`),i*180);
    });
  }, timeForMult(crashPoint||2)+500);
}

/* ── FEED ───────────────────────────────────────────── */
function pushFeed(type,label) {
  feedItems.push({type,label});
  if(feedItems.length>60) feedItems.shift();
  /* Build track: duplicate for seamless loop */
  const chips=feedItems.map(f=>`<span class="fc ${f.type}">${f.label}</span>`).join('');
  feedTrack.innerHTML=chips+chips; // duplicate for infinite scroll
}

function setCoin(val) { coin=val; updateBalUI(); }

  const txt=fmtC(coin);
  balNum.textContent=txt;

async function refreshWallet(uid) {
  try {
    const s=await getDoc(doc(db,'users',uid));
    setCoin(s.exists()?Number(s.data().nubiPayCoin||0):0);
  } catch(e){ console.error(e); }
}

function subWallet(uid) {
  if(typeof walletUnsub==='function'){walletUnsub();walletUnsub=null;}
  walletUnsub=onSnapshot(doc(db,'users',uid),s=>{
    setCoin(s.exists()?Number(s.data().nubiPayCoin||0):0);
    updateBetUI();
  },e=>console.error(e));
}

async function adjCoin(delta,type,meta={}) {
  if(!currentUser) throw new Error('Login dulu.');
  const uRef=doc(db,'users',currentUser.uid);
  const txCol=collection(db,'users',currentUser.uid,'transactions');
  await runTransaction(db,async tx=>{
    const s=await tx.get(uRef);
    const prev=Number(s.exists()?(s.data().nubiPayCoin||0):0);
    const next=Math.max(0,r2(prev+delta));
    tx.set(uRef,{nubiPayCoin:next},{merge:true});
    tx.set(doc(txCol),{type,delta:r2(delta),balanceAfter:next,...meta,createdAt:serverTimestamp()});
    coin=next;
  });
  updateBalUI(); updateBetUI();
}

    setMsg('Login berhasil. Pasang taruhan!','ok');
  } else {
    authBtn.textContent='Login Google';
    uidRow.style.display='none';
    setCoin(0); setMsg('Login untuk mulai bermain','');
  }
  updateBetUI();
});

/* ── RESIZE ─────────────────────────────────────────── */
window.addEventListener('resize',()=>{ resizeCanvas(); });

/* ── INIT ───────────────────────────────────────────── */
resizeCanvas();
drawLoop();
updateBetUI();

/* Seed initial feed with some activity */
const seedChips=['mk_r4x2 bet 5K','td_8vbw bet 2K','zq_1np3 bet 50K','hx_99ab bet 1K','pp_zzz0 bet 10K',
  'rw_4kkm bet 250K','bs_77c1 bet 500','yy_a3f9 ×2.14 +7K','nk_2mb0 CRASH −1K','lx_tt44 ×1.85 +3.7K'];
seedChips.forEach((s,i)=>setTimeout(()=>{
  const type=s.includes('CRASH')?'lose':s.includes('×')?'cash':'bet';
  pushFeed(type,s);
},i*180));
poolNum.textContent=fmtShort(8_000_000+Math.random()*12_000_000|0);

/* First round starts after brief pause */
setTimeout(()=>startRound(), 1500);
</script>
