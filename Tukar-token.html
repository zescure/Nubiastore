<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redeem Invoice → 1 Token — NUBIASTORE</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#06110a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .box{width:100%;max-width:720px;background:#0e1912;padding:20px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
    h1{margin:0 0 12px;font-size:18px}
    .row{display:flex;gap:8px;margin-bottom:12px}
    input[type="text"]{flex:1;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:#fff}
    button{padding:10px 14px;border-radius:8px;border:none;background:linear-gradient(135deg,#16a34a,#0d7c3a);color:#001;font-weight:700;cursor:pointer}
    .muted{color:#9aa79a;font-size:13px}
    pre{white-space:pre-wrap;background:rgba(255,255,255,0.02);padding:10px;border-radius:8px}
    .ok{color:#9ae6b4}
    .err{color:#ff9b9b}
  </style>
</head>
<body>
  <div class="box">
    <h1>Redeem Invoice → Dapat 1 Token</h1>
    <div class="muted">Masukkan kode invoice dari transaksi (contoh: INVC-ML-1772595547702-YE1HLU). 1 invoice = 1 token. Siapapun boleh redeem, invoice hanya bisa dipakai sekali.</div>

    <div class="row" style="margin-top:14px">
      <input id="invoiceInput" placeholder="Masukkan kode invoice..." />
      <button id="btnRedeem">Redeem</button>
    </div>

    <div class="row">
      <button id="btnLogin">Login (Google)</button>
      <div id="status" style="margin-left:12px" class="muted">Status: belum login</div>
    </div>

    <hr style="border:none;border-top:1px solid rgba(255,255,255,0.03);margin:12px 0">

    <div>
      <strong>Log:</strong>
      <pre id="log" style="height:160px;overflow:auto">Ready.</pre>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp,
  collection, query, where, getDocs,
  updateDoc, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // === CONFIG ===
    const firebaseConfig = {
      apiKey: "AIzaSyA3KhNSK0AaKYvXuZE9hi0ZRN9Ysmh9aXc",
      authDomain: "zestoreid-f9e85.firebaseapp.com",
      projectId: "zestoreid-f9e85",
      storageBucket: "zestoreid-f9e85.firebasestorage.app",
      messagingSenderId: "426093692154",
      appId: "1:426093692154:web:38c6e9c143af626a623543",
      measurementId: "G-TS0YB9NYW8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // UI
    const invoiceInput = document.getElementById('invoiceInput');
    const btnRedeem = document.getElementById('btnRedeem');
    const btnLogin = document.getElementById('btnLogin');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');

    function log(msg) { logEl.textContent = (new Date().toLocaleTimeString()) + ' — ' + msg + "\n" + logEl.textContent; }

    // login
    btnLogin.addEventListener('click', async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        alert('Login gagal: ' + (e.message || e.code));
      }
    });

    onAuthStateChanged(auth, user => {
      if (user) {
        statusEl.textContent = `Login: ${user.displayName||user.email} (UID:${user.uid})`;
        btnLogin.textContent = 'Logout';
        btnLogin.onclick = async () => { await auth.signOut(); location.reload(); };
        log('User logged in: ' + (user.email || user.uid));
      } else {
        statusEl.textContent = 'Belum login';
        btnLogin.textContent = 'Login (Google)';
        btnLogin.onclick = () => { signInWithPopup(auth, new GoogleAuthProvider()).catch(e=>alert(e.message)); };
      }
    });

    // redeem flow
    btnRedeem.addEventListener('click', async () => {
      const code = (invoiceInput.value || '').trim();
      if (!code) { alert('Masukkan kode invoice.'); return; }
      if (!auth.currentUser) { alert('Login dulu supaya bisa redeem.'); return; }
      btnRedeem.disabled = true;
      log('Mulai redeem: ' + code);

      try {
        // 1) cek kalau tokenClaims/{code} sudah ada (prevent double)
        const claimRef = doc(db, 'tokenClaims', code);
        const claimSnap = await getDoc(claimRef);
        if (claimSnap.exists()) {
          log('Gagal: invoice sudah diredeem sebelumnya.');
          alert('Invoice ini sudah pernah diredeem sebelumnya.');
          btnRedeem.disabled = false;
          return;
        }

        // 2) cek apakah ada order dengan id == code
        const orderRefById = doc(db, 'orders', code);
        const orderSnapById = await getDoc(orderRefById);
        let orderDocId = null, orderData = null;
        if (orderSnapById.exists()) {
          orderDocId = orderSnapById.id;
          orderData = orderSnapById.data();
          log('Ditemukan order (doc id match).');
        } else {
          // fallback: cari di field invoice (some projects store invoice as field)
          const ordersCol = collection(db, 'orders');
          const q = query(ordersCol, where('invoice','==', code), /*limit(1)*/);
          const qSnap = await getDocs(q);
          if (!qSnap.empty) {
            const d = qSnap.docs[0];
            orderDocId = d.id;
            orderData = d.data();
            log('Ditemukan order (field invoice match). docId=' + orderDocId);
          } else {
            log('Invoice tidak ditemukan di koleksi orders.');
            alert('Invoice tidak ditemukan. Pastikan kode benar dan berasal dari transaksi yang tercatat.');
            btnRedeem.disabled = false;
            return;
          }
        }

        // 3) optional: cek status order (kalau mau memastikan "completed")
        const status = (orderData.status || '').toString().toLowerCase();
        // jika ingin wajib status sukses ubah kondisi di bawah; sekarang gw ijinkan semua status (sesuai instruksi "ga perduli siapa pembelinya")
        // contoh jika mau wajib completed: if (!['completed','success','paid'].includes(status)) { ... }
        log('Status order: ' + (orderData.status || '-'));

        // 4) coba create tokenClaims doc dengan id = invoice code
        const payload = {
          invoice: code,
          orderDocId,
          originalOrderUser: orderData.userId || orderData.uid || null,
          redeemerUid: auth.currentUser.uid,
          redeemerEmail: auth.currentUser.email || null,
          redeemedAt: serverTimestamp()
        };

        // IMPORTANT:
        // We intentionally create tokenClaims doc with the invoice as ID so Firestore Rules can protect duplicates (deny overwrite).
        // If two users race to redeem at same time, one create will succeed, the other will fail (permission denied under rules).
        await setDoc(claimRef, payload);

// tambahin 1 token ke user
import { updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

await updateDoc(doc(db, "users", auth.currentUser.uid), {
  nubiTokens: increment(1)
});

log('Token berhasil ditambahkan +1');
alert('Redeem berhasil! 1 token berhasil ditambahkan.');

        // NOTE:
        // We rely on a Cloud Function (recommended) that triggers onCreate(tokenClaims/{invoice})
        // to increment users[redeemerUid].nubiTokens securely server-side.
        // Jika kamu tidak pakai CF, bisa juga tambahkan client-side increment di sini — tapi tidak recommended.
      } catch (err) {
        console.error(err);
        // jika permission denied bisa berarti tokenClaims dibuat oleh orang lain di race condition OR rules menolak
        if (err.code === 'permission-denied' || (err.message && err.message.toLowerCase().includes('permission'))) {
          alert('Gagal membuat claim: invoice sudah diredeem atau aturan security menolak. Jika yakin belum diredeem, kontak admin.');
          log('Gagal membuat claim: permission denied / sudah ada.');
        } else {
          alert('Terjadi kesalahan: ' + (err.message || err));
          log('Error: ' + (err.message || err));
        }
      } finally {
        btnRedeem.disabled = false;
      }
    });
  </script>
</body>
</html>
