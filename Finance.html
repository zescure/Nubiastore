<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dompet – Personal Finance Manager</title>
<style>
/* ===== TOKENS ===== */
:root{--bg:#000;--c1:#1c1c1e;--c2:#2c2c2e;--sep:#38383a;--t:#fff;--t2:#98989f;--em:#34d399;--em2:#10b981;--emd:rgba(52,211,153,.14);--red:#ff6b6b;--amb:#fbbf24;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{background:var(--bg)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;color:var(--t);background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer}
#app{max-width:760px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(110px + var(--sb))}
.fade{animation:fd .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
/* ===== NAV ===== */
#nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--sb));background:rgba(28,28,30,.78);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid var(--sep)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--t2);padding:4px 0;transition:color .2s,transform .15s}
#nav button:active{transform:scale(.92)}
#nav button.on{color:var(--em)}
#nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:900px){#nav{top:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:4px;padding:calc(var(--st) + 28px) 12px;border-top:0;border-right:.5px solid var(--sep)}
#nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:10px 12px;border-radius:12px}
#nav button.on{background:var(--emd)}#app{margin-left:230px;max-width:820px;padding-bottom:60px}}
@media(min-width:1180px){#app{margin:0 auto;padding-left:230px;max-width:1060px}}
/* ===== TYPE & LAYOUT ===== */
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 0 18px;gap:10px}
h1{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
h2{font-size:13px;font-weight:600;color:var(--t2);margin:26px 6px 8px;display:flex;justify-content:space-between;align-items:center;text-transform:none}
.mut{color:var(--t2);font-size:13px}
.pos{color:var(--em)}.neg{color:var(--red)}.amb{color:var(--amb)}
.card,.grp{background:var(--c1);border-radius:18px;overflow:hidden}
.card{padding:16px}
.big{font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.hero{background:linear-gradient(160deg,#0f3d2e,#0b1f18 70%);border:.5px solid rgba(52,211,153,.25)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.g3 .card{padding:12px}.g3 b{display:block;font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
@media(max-width:420px){.g3 b{font-size:13px}}
.it{display:flex;align-items:center;gap:12px;padding:11px 16px;width:100%;text-align:left;position:relative;transition:background .15s}
.it+.it::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:.5px solid var(--sep)}
.it:active{background:var(--c2)}
.ic{width:36px;height:36px;border-radius:10px;background:var(--c2);display:grid;place-items:center;font-size:18px;flex:none}
.it .m{flex:1;min-width:0}.it .m b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .r{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pad{padding:14px 16px}
.pg{height:7px;border-radius:9px;background:var(--c2);overflow:hidden;margin-top:8px}
.pg i{display:block;height:100%;border-radius:9px;background:var(--em);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pg i.w{background:var(--amb)}.pg i.d{background:var(--red)}
.seg{display:flex;background:var(--c1);border-radius:10px;padding:2px;gap:2px;margin:0 0 12px}
.seg button{flex:1;padding:6px 4px;border-radius:8px;font-size:13px;font-weight:500;color:var(--t2);transition:.2s}
.seg button.on{background:var(--c2);color:var(--t);box-shadow:0 1px 4px rgba(0,0,0,.5)}
.btn{background:var(--em);color:#00281b;font-weight:600;padding:12px 18px;border-radius:14px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.s{padding:7px 14px;font-size:14px;border-radius:99px}
.btn.g{background:var(--c2);color:var(--t)}.btn.red{background:rgba(255,107,107,.14);color:var(--red);width:100%;margin-top:14px}
.lnk{color:var(--em);font-size:15px}.lnk.strong{font-weight:600}
.search{width:100%;background:var(--c1);border:0;border-radius:12px;padding:10px 14px;margin-bottom:10px;outline:0}
.search:focus{box-shadow:0 0 0 2px var(--em)}
.ch{width:100%;height:auto;display:block}.ch text{fill:var(--t2);font-size:10px}
.al{display:flex;gap:10px;padding:11px 16px;font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(86px + var(--sb));z-index:15;width:56px;height:56px;border-radius:50%;background:var(--em);color:#00281b;font-size:30px;line-height:1;box-shadow:0 8px 24px rgba(16,185,129,.4);transition:transform .2s}
.fab:active{transform:scale(.9)}
@media(min-width:900px){.fab{bottom:30px}}
.ring{width:96px;height:96px;flex:none}
input[type=range]{width:100%;accent-color:var(--em)}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
/* ===== SHEET ===== */
#sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet .back{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#121214;border-radius:24px 24px 0 0;padding:8px 16px calc(24px + var(--sb));transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);max-width:560px;margin:0 auto}
#sheet.on{pointer-events:auto}#sheet.on .back{opacity:1}#sheet.on .panel{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--sep);margin:0 auto 8px}
.ph{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.row{display:flex;align-items:center;gap:10px;padding:12px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row span{flex:0 0 38%;color:var(--t2);font-size:15px}
.row input,.row select,.row textarea{flex:1;min-width:0;background:none;border:0;outline:0;text-align:right;resize:none;font-size:16px;color-scheme:dark}
.row select{appearance:none;-webkit-appearance:none;text-align-last:right;color:var(--em)}
#toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translate(-50%,-140%);z-index:99;background:rgba(44,44,46,.95);backdrop-filter:blur(20px);padding:11px 18px;border-radius:99px;font-size:14px;max-width:90vw;transition:transform .45s cubic-bezier(.32,.72,0,1);box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--em);outline-offset:2px}
/* ===== AUTH & LOADING ===== */
[hidden]{display:none!important}
#auth,#load{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.ac{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;text-align:center}
.ac .grp{text-align:left}.ac .seg{margin:6px 0 0}.ac .btn{width:100%}
.logo{width:68px;height:68px;border-radius:20px;background:linear-gradient(160deg,#34d399,#10b981);margin:0 auto 6px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(16,185,129,.35)}
#ae{min-height:18px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<nav id="nav" aria-label="Navigasi utama" hidden></nav>
<main id="app" hidden></main>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<input type="file" id="rf" accept=".json" hidden>
<div id="load"><p class="mut" id="lt">Memuat…</p></div>
<div id="auth" hidden><div class="ac">
 <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#00281b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-3v3M16 14h2"/></svg></div>
 <h1>Dompet</h1><p class="mut">Catat keuanganmu. Data tersimpan otomatis di akunmu dan bisa dibuka dari perangkat mana pun.</p>
 <div class="seg" id="am"><button class="on" data-m="in">Masuk</button><button data-m="up">Daftar</button></div>
 <div class="grp"><label class="row"><span>Email</span><input id="em" type="email" autocomplete="email" placeholder="nama@email.com"></label><label class="row"><span>Kata sandi</span><input id="pw" type="password" autocomplete="current-password" placeholder="min. 6 karakter"></label></div>
 <p id="ae" class="neg mut" role="alert"></p>
 <button class="btn" id="ab">Masuk</button>
 <button class="btn g" id="ag">Lanjutkan dengan Google</button>
 <button class="lnk" id="ar" style="font-size:14px">Lupa kata sandi?</button>
</div></div>

<script>
/* ============ 1. UTIL ============ */
const $=s=>document.querySelector(s), K='dompet_v1';
const MO=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>{d=new Date(d);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const today=()=>iso(new Date());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>{const x=new Date(d+'T00:00');return x.getDate()+' '+MO[x.getMonth()]+' '+x.getFullYear()};
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const CO=['Kebutuhan','Makan','Transportasi','Hiburan','Tagihan','Kesehatan','Belanja','Cicilan','Lainnya'];
const CI=['Gaji','Lembur','Bonus','Freelance','Bisnis','Lainnya'];
const EM={Makan:'🍜',Transportasi:'🚗',Hiburan:'🎬',Tagihan:'🧾',Kebutuhan:'🛒',Kesehatan:'💊',Belanja:'🛍️',Cicilan:'💳',Gaji:'💼',Lembur:'⏱️',Bonus:'🎁',Freelance:'💻',Bisnis:'🏪',Transfer:'🔁',Penyesuaian:'⚖️',Lainnya:'📦'};
const ATYPE={cash:'Tunai',bank:'Bank',ewallet:'E-wallet',special:'Rekening khusus'};
const DKIND={utang:'Utang pribadi',cicilan:'Cicilan',paylater:'PayLater',pinjaman:'Pinjaman',piutang:'Piutang'};
const ASTYPE={Saham:'📈',Crypto:'🪙','Reksa Dana':'📊',Emas:'🥇',Kendaraan:'🏍️',Properti:'🏠','Barang berharga':'💎',Lainnya:'📦'};
const INV=['Saham','Crypto','Reksa Dana','Emas'];

function nextDue(day,strict){const n=new Date(),c=(y,m)=>new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()));let d=c(n.getFullYear(),n.getMonth());const t=new Date(today()+'T00:00');if(strict?d<=t:d<t)d=c(n.getFullYear(),n.getMonth()+1);return iso(d)}
const nextDate=(d,e)=>{const x=new Date(d+'T00:00');e==='weekly'?x.setDate(x.getDate()+7):e==='yearly'?x.setFullYear(x.getFullYear()+1):x.setMonth(x.getMonth()+1);return iso(x)};
const daysTo=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}

/* ============ 2. DATA LAYER ============ */
const emptyDB=()=>({acc:[],tx:[],bud:[],debt:[],asset:[],goal:[],rec:[],audit:[{t:Date.now(),a:'Mulai',d:'Akun baru dibuat'}]});
const norm=d=>({...emptyDB(),...d});
let DB=emptyDB(),CU=null,ref=null,unsub=null,saveT=null,lastJ='',cloudTxt='Siap',LK='',ready=false;
function setCloud(t){cloudTxt=t;document.querySelectorAll('.cs').forEach(e=>e.textContent=t)}
function cloudSave(){clearTimeout(saveT);saveT=null;if(!ref||!ready)return Promise.resolve();const j=JSON.stringify(DB);lastJ=j;setCloud('Menyimpan…');
 return ref.set({json:j,updated:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>setCloud('Tersimpan ✓')).catch(e=>{setCloud('Gagal menyimpan');toast('Gagal sinkron: '+(e.code||e.message))})}
const put=()=>{if(!ready)return;try{localStorage.setItem(LK,JSON.stringify(DB))}catch(e){}setCloud('Menyimpan…');clearTimeout(saveT);saveT=setTimeout(cloudSave,400)};
const log=(a,d)=>{DB.audit.unshift({t:Date.now(),a,d});DB.audit.length=Math.min(DB.audit.length,300)};
function runRec(){let n=0;DB.rec.forEach(r=>{while(r.next<=today()){DB.tx.push({id:uid(),date:r.next,type:r.type,amt:r.amt,cat:r.cat,acc:r.acc,note:r.note,tag:'berulang',journal:''});n++;r.next=nextDate(r.next,r.every)}});if(n){log('Berulang',n+' transaksi dibuat otomatis');put()}}

/* ============ 3. KALKULASI ============ */
const bal=(a,txs=DB.tx)=>txs.reduce((s,t)=>s+(t.acc===a.id?(t.type==='in'?t.amt:-t.amt):0)+(t.type==='tf'&&t.to===a.id?t.amt:0),+a.open||0);
const sum=f=>DB.tx.filter(f).reduce((s,t)=>s+t.amt,0);
const inc=m=>sum(t=>t.type==='in'&&t.date.startsWith(m)),exp=m=>sum(t=>t.type==='out'&&t.date.startsWith(m));
const rem=d=>Math.max(0,d.principal-d.paid);
const totalBal=()=>DB.acc.reduce((s,a)=>s+bal(a),0);
const assetVal=()=>DB.asset.reduce((s,a)=>s+a.value,0);
const owed=()=>DB.debt.filter(d=>d.kind!=='piutang').reduce((s,d)=>s+rem(d),0);
const recv=()=>DB.debt.filter(d=>d.kind==='piutang').reduce((s,d)=>s+rem(d),0);
const netWorth=()=>totalBal()+assetVal()+recv()-owed();
const monthlyDebt=()=>DB.debt.filter(d=>d.kind!=='piutang'&&rem(d)>0).reduce((s,d)=>s+Math.min(d.monthly,rem(d)),0);
function pstart(p){const d=new Date();if(p==='harian')return today();if(p==='mingguan'){d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)}return p==='bulanan'?today().slice(0,7)+'-01':today().slice(0,4)+'-01-01'}
const spent=b=>sum(t=>t.type==='out'&&t.cat===b.cat&&t.date>=pstart(b.per));
function avg(){ // rata-rata bulanan dari 90 hari terakhir
 const from=iso(Date.now()-90*864e5),f=DB.tx.filter(t=>t.date>=from);const first=f.reduce((m,t)=>t.date<m?t.date:m,today());
 const mo=Math.max(1,cl((new Date(today())-new Date(first))/864e5/30,1,3));
 const I=f.filter(t=>t.type==='in').reduce((s,t)=>s+t.amt,0)/mo,X=f.filter(t=>t.type==='out').reduce((s,t)=>s+t.amt,0)/mo;return{I,X,N:I-X}}
function efMonths(){const{X}=avg();return X?totalBal()/X:0}
function health(){const{I,X}=avg(),rate=I?(I-X)/I:0,dr=I?monthlyDebt()/I:1;
 const bs=DB.bud.length?DB.bud.filter(b=>spent(b)<=b.limit).length/DB.bud.length:.5;
 const p=[cl(rate/.2,0,1)*30,(1-cl((dr-.1)/.4,0,1))*25,cl(efMonths()/6,0,1)*25,bs*20],s=Math.round(p.reduce((a,b)=>a+b,0));
 return{s,p,rate,dr,label:!DB.tx.length?'Belum ada data':s>=80?'Sangat sehat':s>=60?'Sehat':s>=40?'Waspada':'Kritis',col:s>=80?'#34d399':s>=60?'#a3e635':s>=40?'#fbbf24':'#ff6b6b'}}
function debtFree(){let max=0,unk=0;DB.debt.filter(d=>d.kind!=='piutang'&&rem(d)>0).forEach(d=>{if(!d.monthly){unk++;return}let b=rem(d),r=d.rate/1200,m=0;while(b>0&&m<600){b=b*(1+r)-d.monthly;m++}max=Math.max(max,m>=600?Infinity:m)});
 if(max===Infinity)return{t:'Cicilan tidak menutup bunga',unk};if(!max)return{t:unk?'Perlu cicilan bulanan':'Bebas utang 🎉',unk};const d=new Date();d.setMonth(d.getMonth()+max);return{t:MO[d.getMonth()]+' '+d.getFullYear(),m:max,unk}}
function alerts(){const a=[];DB.bud.forEach(b=>{const p=spent(b)/b.limit;if(p>1)a.push(['🚨',`Anggaran ${b.cat} (${b.per}) lewat ${rp(spent(b)-b.limit)}`,'neg']);else if(p>=.8)a.push(['⚠️',`Anggaran ${b.cat} (${b.per}) sudah ${Math.round(p*100)}%`,'amb'])});
 DB.debt.filter(d=>rem(d)>0&&d.due).forEach(d=>{const n=daysTo(nextDue(d.due));if(n<=7)a.push(['⏰',`${d.kind==='piutang'?'Tagih ':'Bayar '}${d.name} ${n?n+' hari lagi':'hari ini'}`,'amb'])});
 if(DB.tx.length&&efMonths()<3)a.push(['🛟',`Dana darurat baru ${efMonths().toFixed(1)} bulan biaya hidup`,'amb']);
 DB.acc.forEach(x=>{if(bal(x)<0)a.push(['❗',`Saldo ${x.name} negatif`,'neg'])});return a.slice(0,5)}
function schedule(){const o=[],H=14;DB.debt.filter(d=>rem(d)>0&&d.due).forEach(d=>{const x=nextDue(d.due);if(daysTo(x)<=H)o.push({d:x,i:d.kind==='piutang'?'📥':'💳',t:d.name,a:d.monthly||rem(d),n:d.kind==='piutang'?1:-1})});
 DB.rec.forEach(r=>{if(daysTo(r.next)<=H)o.push({d:r.next,i:EM[r.cat]||'🔁',t:r.note,a:r.amt,n:r.type==='in'?1:-1})});return o.sort((a,b)=>a.d<b.d?-1:1)}

/* ============ 4. CHARTS ============ */
function bars(d){const m=Math.max(1,...d.flatMap(x=>[x.a,x.b])),h=120,w=320,s=w/d.length;
 return`<svg viewBox="0 0 ${w} ${h+20}" class="ch">`+d.map((x,i)=>{const g=i*s+(s-40)/2,ha=x.a/m*h,hb=x.b/m*h;return`<rect x="${g}" y="${h-ha}" width="18" height="${ha}" rx="5" fill="#34d399"><title>Masuk ${rp(x.a)}</title></rect><rect x="${g+22}" y="${h-hb}" width="18" height="${hb}" rx="5" fill="#ff6b6b"><title>Keluar ${rp(x.b)}</title></rect><text x="${g+20}" y="${h+15}" text-anchor="middle">${x.l}</text>`}).join('')+'</svg>'}
function line(v){const w=320,h=110,mn=Math.min(...v,0),mx=Math.max(...v,1),r=mx-mn||1,p=v.map((y,i)=>[i/(v.length-1)*w,h-(y-mn)/r*h]),d=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(''),z=h-(0-mn)/r*h;
 return`<svg viewBox="0 0 ${w} ${h+4}" class="ch"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".35"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient></defs><line x1="0" x2="${w}" y1="${z}" y2="${z}" stroke="#38383a" stroke-dasharray="3 4"/><path d="${d}L${w} ${h}L0 ${h}Z" fill="url(#lg)"/><path d="${d}" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
const ring=(s,c)=>`<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#2c2c2e" stroke-width="9"/><circle cx="50" cy="50" r="42" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${s*2.64} 264" transform="rotate(-90 50 50)" style="transition:stroke-dasharray .8s"/><text x="50" y="57" text-anchor="middle" style="fill:#fff;font-size:26px;font-weight:700">${s}</text></svg>`;
const prog=(p,c)=>`<div class="pg"><i class="${c||''}" style="width:${cl(p,0,1)*100}%"></i></div>`;
const hd=(sub,t,act='')=>`<header class="hd"><div><p class="mut">${sub}</p><h1>${t}</h1></div><div>${act}</div></header>`;
const sec=(t,act='')=>`<h2><span>${t}</span>${act}</h2>`;

 form(old?'Ubah transaksi':'Transaksi baru',x=>{const f=[{k:'type',l:'Jenis',t:'select',re:1,o:[['out','Pengeluaran'],['in','Pemasukan'],['tf','Transfer']]},{k:'amt',l:'Jumlah (Rp)',t:'number',p:'0'}];
  if(x.type!=='tf')f.push({k:'cat',l:'Kategori',t:'select',o:(x.type==='in'?CI:CO).map(c=>[c,c])});
  f.push({k:'acc',l:x.type==='tf'?'Dari rekening':'Rekening',t:'select',o:accOpts()});
  if(x.type==='tf')f.push({k:'to',l:'Ke rekening',t:'select',o:accOpts()});
  return f.concat([{k:'date',l:'Tanggal',t:'date'},{k:'tag',l:'Tag',p:'#kantor'},{k:'note',l:'Catatan',p:'Untuk apa?'},{k:'journal',l:'Jurnal',t:'area',p:'Alasan & konteks di balik transaksi'}])},
  old?{...old}:{type:'out',date:today(),acc:DB.acc[0]?.id,to:DB.acc[1]?.id,cat:'Makan',amt:'',tag:'',note:'',journal:''},
  d=>{if(!(d.amt>0))return'Jumlah harus lebih dari 0';if(!d.date)return'Tanggal wajib diisi';
   if(d.type==='tf'&&d.acc===d.to)return'Rekening asal dan tujuan harus berbeda';
   if(d.type!=='in'){const a=DB.acc.find(a=>a.id===d.acc),b=bal(a,DB.tx.filter(t=>t.id!==id));if(b<d.amt)return`Saldo ${a.name} tidak cukup (${rp(b)})`}
   if(d.type==='tf'){d.cat='Transfer'}else delete d.to;
   if(old){log('Ubah transaksi',`${old.cat} ${rp(old.amt)} → ${d.cat} ${rp(d.amt)}`);Object.assign(old,d)}else{DB.tx.push({id:uid(),...d});log('Tambah transaksi',`${d.cat} ${rp(d.amt)}`)}
   const b=DB.bud.find(b=>b.cat===d.cat&&d.type==='out'&&spent(b)>b.limit);if(b)setTimeout(()=>toast(`Anggaran ${b.cat} melebihi batas`),500)},
  old?()=>{log('Hapus transaksi',`${old.cat} ${rp(old.amt)} (${old.date})`);DB.tx=DB.tx.filter(t=>t.id!==id)}:null)}
const accForm=id=>crud('acc','rekening',()=>[{k:'name',l:'Nama',p:'BCA, OVO…'},{k:'type',l:'Jenis',t:'select',o:Object.entries(ATYPE)},{k:'open',l:'Saldo awal',t:'number'}],{name:'',type:'bank',open:0},id,d=>need(d,'name'),a=>DB.tx.some(t=>t.acc===a.id||t.to===a.id)&&'Rekening masih punya transaksi');
const budForm=id=>crud('bud','anggaran',()=>[{k:'cat',l:'Kategori',t:'select',o:CO.map(c=>[c,c])},{k:'per',l:'Periode',t:'select',o:['harian','mingguan','bulanan','tahunan'].map(p=>[p,p])},{k:'limit',l:'Batas (Rp)',t:'number'}],{cat:'Makan',per:'bulanan',limit:''},id,d=>!(d.limit>0)&&'Batas harus lebih dari 0');
const debtForm=id=>crud('debt','utang/piutang',()=>[{k:'kind',l:'Jenis',t:'select',o:Object.entries(DKIND)},{k:'name',l:'Nama'},{k:'lender',l:'Pihak',p:'Pemberi pinjaman'},{k:'principal',l:'Pokok (Rp)',t:'number'},{k:'paid',l:'Sudah dibayar',t:'number'},{k:'rate',l:'Bunga %/tahun',t:'number'},{k:'monthly',l:'Cicilan/bulan',t:'number'},{k:'due',l:'Jatuh tempo tgl',t:'number',p:'1–31'},{k:'tenor',l:'Tenor (bulan)',t:'number'}],{kind:'utang',name:'',lender:'',principal:'',paid:0,rate:0,monthly:0,due:'',tenor:0},id,d=>need(d,'name')||(!(d.principal>0)&&'Pokok harus lebih dari 0')||(d.paid>d.principal&&'Pembayaran melebihi pokok')||(d.due&&(d.due<1||d.due>31)&&'Tanggal 1–31'));
const assetForm=id=>crud('asset','aset',()=>[{k:'name',l:'Nama'},{k:'type',l:'Jenis',t:'select',o:Object.keys(ASTYPE).map(k=>[k,k])},{k:'cost',l:'Modal (Rp)',t:'number'},{k:'value',l:'Nilai pasar',t:'number'}],{name:'',type:'Saham',cost:'',value:''},id,d=>need(d,'name'));
const goalForm=id=>crud('goal','target',()=>[{k:'name',l:'Target',p:'Dana darurat, kendaraan…'},{k:'target',l:'Jumlah (Rp)',t:'number'},{k:'saved',l:'Terkumpul',t:'number'},{k:'deadline',l:'Tenggat',t:'date'}],{name:'',target:'',saved:0,deadline:iso(Date.now()+180*864e5)},id,d=>need(d,'name')||(!(d.target>0)&&'Jumlah target wajib diisi'));
const recForm=id=>crud('rec','transaksi berulang',x=>[{k:'type',l:'Jenis',t:'select',re:1,o:[['out','Pengeluaran'],['in','Pemasukan']]},{k:'amt',l:'Jumlah',t:'number'},{k:'cat',l:'Kategori',t:'select',o:(x.type==='in'?CI:CO).map(c=>[c,c])},{k:'acc',l:'Rekening',t:'select',o:accOpts()},{k:'every',l:'Ulangi',t:'select',o:[['weekly','Mingguan'],['monthly','Bulanan'],['yearly','Tahunan']]},{k:'next',l:'Berikutnya',t:'date'},{k:'note',l:'Catatan'}],{type:'out',amt:'',cat:'Tagihan',acc:DB.acc[0]?.id,every:'monthly',next:today(),note:''},id,d=>!d.acc&&'Tambah rekening dulu'||!(d.amt>0)&&'Jumlah wajib diisi');
function payDebt(id){const d=DB.debt.find(x=>x.id===id),pi=d.kind==='piutang';if(!DB.acc.length){toast('Tambah rekening dulu');return accForm()}
 form(pi?'Terima pelunasan':'Bayar '+d.name,()=>[{k:'amt',l:'Jumlah (Rp)',t:'number'},{k:'acc',l:pi?'Masuk ke':'Dari rekening',t:'select',o:accOpts()}],{amt:Math.min(d.monthly||rem(d),rem(d)),acc:DB.acc[0]?.id},x=>{
  if(!(x.amt>0)||x.amt>rem(d))return'Jumlah harus 1 – '+rp(rem(d));const a=DB.acc.find(a=>a.id===x.acc);if(!pi&&bal(a)<x.amt)return`Saldo ${a.name} tidak cukup`;
  d.paid+=x.amt;DB.tx.push({id:uid(),date:today(),type:pi?'in':'out',amt:x.amt,cat:pi?'Lainnya':'Cicilan',acc:x.acc,note:(pi?'Pelunasan dari ':'Bayar ')+d.name,tag:'utang',journal:''});log(pi?'Terima piutang':'Bayar utang',d.name+' '+rp(x.amt))},null)}
function goalAdd(id){const g=DB.goal.find(x=>x.id===id);form('Setor ke '+g.name,()=>[{k:'amt',l:'Jumlah (Rp)',t:'number'}],{amt:''},x=>{if(!(x.amt>0))return'Isi jumlah setoran';g.saved+=x.amt;log('Setor target',g.name+' '+rp(x.amt))},null)}
function recon(id){const a=DB.acc.find(x=>x.id===id),v=$('#rc_'+id).value;if(v==='')return toast('Isi saldo sebenarnya dulu');const diff=+v-bal(a);
 if(!diff)return toast('Saldo sudah cocok ✓');DB.tx.push({id:uid(),date:today(),type:diff>0?'in':'out',amt:Math.abs(diff),cat:'Penyesuaian',acc:id,note:'Rekonsiliasi saldo',tag:'rekonsiliasi',journal:''});log('Rekonsiliasi',a.name+' selisih '+rp(diff));put();render();toast('Saldo disesuaikan '+rp(diff))}

/* ============ 7. BACKUP / RESTORE ============ */
function backup(){const b=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dompet-backup-'+today()+'.json';a.click();log('Backup','File diunduh');put();toast('Backup diunduh')}
$('#rf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.acc||!d.tx)throw 0;DB=norm(d);log('Restore','Data dipulihkan dari '+f.name);put();render();toast('Data berhasil dipulihkan')}catch(_){toast('File backup tidak valid')}};r.readAsText(f);e.target.value=''};
function wipe(){if(!confirm('Hapus SEMUA data, termasuk di cloud? Buat backup dulu.'))return;DB=emptyDB();log('Reset','Semua data dihapus');put();render()}

/* ============ 8. ROUTER ============ */
let tab='home';
const TABS=[['home','Ringkasan','M3 11l9-8 9 8v10h-6v-7H9v7H3z'],['tx','Transaksi','M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4'],['bud','Anggaran','M21 12A9 9 0 1 1 12 3v9zM15 3.5A9 9 0 0 1 20.5 9H15z'],['debt','Utang','M2 6h20v12H2zM2 10h20'],['asset','Aset','M3 17l6-6 4 4 8-8M15 7h6v6'],['ana','Analitik','M5 20V10M12 20V4M19 20v-7']];
function render(){$('#nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')" aria-label="${t[1]}"><svg viewBox="0 0 24 24"><path d="${t[2]}"/></svg>${t[1]}</button>`).join('');$('#app').innerHTML=V[tab]()}
function go(t){tab=t;render();scrollTo(0,0);const a=$('#app');a.classList.remove('fade');void a.offsetWidth;a.classList.add('fade')}

auth.onAuthStateChanged(u=>{
 if(unsub){unsub();unsub=null}clearTimeout(saveT);saveT=null;ready=false;CU=u;
 if(!u){ref=null;DB=emptyDB();lastJ='';return showAuth()}
 LK='dompet_'+u.uid;ref=fsdb.collection('users').doc(u.uid);
 $('#auth').hidden=true;$('#load').hidden=false;$('#lt').textContent='Memuat data…';
 const boot=d=>{DB=norm(d);ready=true;lastJ=JSON.stringify(DB);$('#load').hidden=true;$('#nav').hidden=false;$('#app').hidden=false;setCloud('Tersimpan ✓');runRec();render()};
 unsub=ref.onSnapshot(s=>{
  if(!ready){
   if(s.exists){let d;try{d=JSON.parse(s.data().json)}catch(e){d=emptyDB()}return boot(d)}
   if(s.metadata.fromCache)return;
   boot(emptyDB());put();return}
  if(s.metadata.hasPendingWrites||!s.exists)return;
  const j=s.data().json;if(j===lastJ)return;
  try{DB=norm(JSON.parse(j));lastJ=j;try{localStorage.setItem(LK,j)}catch(e){}if(!$('#sheet').classList.contains('on'))render()}catch(e){}
 },e=>{toast('Gagal memuat cloud: '+(e.code||''));if(!ready){const c=localStorage.getItem(LK);boot(c?JSON.parse(c):emptyDB())}});
 setTimeout(()=>{if(!ready&&CU===u){const c=localStorage.getItem(LK);if(c){boot(JSON.parse(c));toast('Mode offline – memakai data tersimpan')}else $('#lt').textContent='Menunggu koneksi…'}},8000);
});

 $('#ab').disabled=true;try{mode==='in'?await auth.signInWithEmailAndPassword(em,pw):await auth.createUserWithEmailAndPassword(em,pw)}catch(e){aerr(e)}$('#ab').disabled=false}
