<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NUBIA TRADE — Binary Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #040810;
  --s1:       #0a1220;
  --s2:       #0e1830;
  --s3:       #122038;
  --bd:       #182a40;
  --bd2:      #1e3550;
  --txt:      #c8d8e8;
  --dim:      #3a5570;
  --muted:    #1e3050;
  --green:    #00e87a;
  --g-dim:    rgba(0,232,122,0.08);
  --red:      #ff2255;
  --r-dim:    rgba(255,34,85,0.08);
  --amber:    #ffaa00;
  --a-dim:    rgba(255,170,0,0.08);
  --blue:     #1e90ff;
  --b-dim:    rgba(30,144,255,0.08);
  --fui:      'Barlow', sans-serif;
  --fnum:     'JetBrains Mono', monospace;
  --fhd:      'Barlow Condensed', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--fui)}
button{cursor:pointer;font-family:inherit}

/* ─── OVERLAY ─── */
#loginOverlay{
  position:fixed;inset:0;z-index:1000;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:24px;
}
.brand-xl{
  font-family:var(--fhd);font-size:52px;font-weight:800;
  letter-spacing:8px;color:var(--txt);
}
.brand-xl span{color:var(--amber)}
.login-sub{font-size:11px;letter-spacing:4px;color:var(--dim)}
.spinner{
  width:28px;height:28px;
  border:2px solid var(--bd);border-top-color:var(--amber);
  border-radius:50%;animation:spin .7s linear infinite;
}
.login-msg{font-size:13px;color:var(--dim)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── LAYOUT ─── */
#app{height:100vh;display:flex;flex-direction:column}
header{
  height:54px;background:var(--s1);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:100;
}
.hdr-brand{font-family:var(--fhd);font-size:20px;font-weight:800;letter-spacing:4px;white-space:nowrap}
.hdr-brand span{color:var(--amber)}
.mkt-tabs{display:flex;gap:3px;flex:1;min-width:0;overflow:hidden}
.mkt-tab{
  padding:5px 12px;border:1px solid var(--bd);border-radius:3px;
  background:transparent;color:var(--dim);
  font-family:var(--fhd);font-size:11px;font-weight:600;letter-spacing:1.5px;
  transition:all .15s;white-space:nowrap;
}
.mkt-tab:hover{border-color:var(--bd2);color:var(--txt)}
.mkt-tab.active{background:var(--a-dim);border-color:var(--amber);color:var(--amber)}
.mkt-tab .tp{display:block;font-family:var(--fnum);font-size:9px;font-weight:400;color:var(--dim);margin-top:2px}
.mkt-tab.active .tp{color:var(--amber)}
.hdr-bal{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:3px;
  white-space:nowrap;
}
.bal-lbl{font-size:9px;letter-spacing:2px;color:var(--dim);font-weight:600}
.bal-val{font-family:var(--fnum);font-size:15px;font-weight:600;color:var(--amber);transition:all .3s}
.bal-nc{font-size:9px;color:var(--dim);letter-spacing:1px}
.hdr-user{display:flex;align-items:center;gap:6px}
.user-em{font-size:10px;color:var(--dim);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-out{
  padding:4px 8px;background:transparent;border:1px solid var(--bd);
  color:var(--dim);font-family:var(--fhd);font-size:10px;letter-spacing:1px;
  border-radius:3px;transition:all .15s;
}
.btn-out:hover{border-color:var(--red);color:var(--red)}

main{flex:1;display:flex;overflow:hidden}

/* ─── CHART SECTION ─── */
.chart-sec{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.info-bar{
  height:50px;background:var(--s1);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 14px;gap:16px;flex-shrink:0;
}
.mkt-fname{font-family:var(--fhd);font-size:15px;font-weight:700;letter-spacing:2px;white-space:nowrap}
.mkt-price{font-family:var(--fnum);font-size:21px;font-weight:600;min-width:90px;transition:color .2s}
.mkt-price.up{color:var(--green)}.mkt-price.down{color:var(--red)}
.chg-badge{
  padding:2px 7px;border-radius:3px;
  font-family:var(--fnum);font-size:11px;font-weight:500;
}
.chg-badge.up{background:var(--g-dim);color:var(--green)}
.chg-badge.down{background:var(--r-dim);color:var(--red)}
.profit-badge{
  padding:2px 8px;background:var(--a-dim);border:1px solid var(--amber);
  border-radius:3px;font-family:var(--fhd);font-size:10px;font-weight:700;
  letter-spacing:1px;color:var(--amber);margin-left:auto;
}
.tf-btns{display:flex;gap:3px}
.tf-btn{
  padding:3px 9px;background:transparent;border:1px solid var(--bd);
  color:var(--dim);font-family:var(--fhd);font-size:10px;font-weight:600;
  letter-spacing:1px;border-radius:3px;transition:all .15s;
}
.tf-btn:hover{border-color:var(--bd2);color:var(--txt)}
.tf-btn.active{background:var(--b-dim);border-color:var(--blue);color:var(--blue)}
.chart-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
#chartCanvas{display:block;width:100%;height:100%}
.chart-stats{
  position:absolute;top:10px;left:12px;
  display:flex;gap:14px;pointer-events:none;
}
.cs{display:flex;flex-direction:column}
.cs-lbl{font-size:9px;color:var(--dim);letter-spacing:1.5px}
.cs-val{font-family:var(--fnum);font-size:12px;font-weight:500;color:var(--txt)}

/* ─── TRADE PANEL ─── */
.trade-panel{
  width:270px;flex-shrink:0;background:var(--s1);
  border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;
}
.pnl-hdr{
  padding:9px 12px 8px;border-bottom:1px solid var(--bd);
  font-family:var(--fhd);font-size:10px;font-weight:600;
  letter-spacing:2.5px;color:var(--dim);
}
.active-list{
  overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:5px;
  max-height:195px;min-height:60px;
}
.active-list::-webkit-scrollbar{width:3px}
.active-list::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.no-trades{color:var(--muted);font-size:10px;text-align:center;padding:14px 0}
.tcard{
  padding:7px 9px;background:var(--s2);border:1px solid var(--bd);
  border-radius:3px;border-left-width:3px;animation:slideIn .2s ease;
}
.tcard.up{border-left-color:var(--green)}.tcard.down{border-left-color:var(--red)}
@keyframes slideIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.tc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.tc-dir{font-family:var(--fhd);font-size:10px;font-weight:700;letter-spacing:1px}
.tc-dir.up{color:var(--green)}.tc-dir.down{color:var(--red)}
.tc-timer{font-family:var(--fnum);font-size:11px;color:var(--amber);font-weight:600}
.tc-row{display:flex;justify-content:space-between;margin-bottom:2px}
.tc-amt{font-family:var(--fnum);font-size:10px;color:var(--dim)}
.tc-pft{font-family:var(--fnum);font-size:10px;color:var(--green)}
.tc-ep{font-family:var(--fnum);font-size:9px;color:var(--muted);margin-bottom:5px}
.tc-prog{height:2px;background:var(--bd);border-radius:1px;overflow:hidden}
.tc-progbar{height:100%;border-radius:1px;transition:width .5s linear}
.tc-progbar.up{background:var(--green)}.tc-progbar.down{background:var(--red)}

/* ─── TRADE FORM ─── */
.trade-form{padding:12px;border-top:1px solid var(--bd)}
.flbl{
  font-family:var(--fhd);font-size:9px;font-weight:600;
  letter-spacing:2.5px;color:var(--dim);margin-bottom:5px;display:block;
}
.amt-inp{
  width:100%;padding:7px 10px;background:var(--s2);border:1px solid var(--bd);
  border-radius:3px;color:var(--txt);font-family:var(--fnum);font-size:18px;
  font-weight:600;text-align:center;transition:border-color .15s;margin-bottom:5px;
}
.amt-inp:focus{outline:none;border-color:var(--amber)}
.amt-inp::-webkit-inner-spin-button,.amt-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.qa-row{display:flex;gap:3px;margin-bottom:10px}
.qa{
  flex:1;padding:3px;background:var(--s2);border:1px solid var(--bd);
  color:var(--dim);font-family:var(--fnum);font-size:10px;border-radius:3px;
  transition:all .15s;text-align:center;
}
.qa:hover{border-color:var(--amber);color:var(--amber)}
.payout-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 9px;background:var(--s2);border:1px solid var(--bd);
  border-radius:3px;margin-bottom:10px;
}
.py-lbl{font-family:var(--fhd);font-size:10px;letter-spacing:1px;color:var(--dim)}
.py-val{font-family:var(--fnum);font-size:15px;font-weight:600;color:var(--green)}
.trade-btns{display:flex;gap:6px;margin-bottom:12px}
.tbtn{
  flex:1;padding:12px 6px;border:1px solid;border-radius:3px;
  font-family:var(--fhd);font-size:14px;font-weight:700;letter-spacing:2px;
  transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:1px;
}
.tbtn .arr{font-size:18px;line-height:1.1}
.tbtn-up{background:var(--g-dim);border-color:var(--green);color:var(--green)}
.tbtn-up:hover{background:var(--green);color:#000}
.tbtn-dn{background:var(--r-dim);border-color:var(--red);color:var(--red)}
.tbtn-dn:hover{background:var(--red);color:#000}
.tbtn:disabled{opacity:.3;cursor:not-allowed}
.hist-hdr{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--fhd);font-size:9px;font-weight:600;
  letter-spacing:2px;color:var(--dim);margin-bottom:5px;
}
.hist-wr{font-family:var(--fnum);font-size:10px;color:var(--amber)}
.hist-list{display:flex;flex-direction:column;gap:2px;max-height:120px;overflow-y:auto}
.hist-list::-webkit-scrollbar{width:3px}
.hist-list::-webkit-scrollbar-thumb{background:var(--bd)}
.hitem{
  display:flex;align-items:center;padding:3px 6px;
  border-radius:3px;background:var(--s2);gap:5px;animation:fadeIn .3s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hi-dir{font-family:var(--fhd);font-size:9px;font-weight:700;letter-spacing:1px;width:28px}
.hi-dir.up{color:var(--green)}.hi-dir.down{color:var(--red)}
.hi-mkt{font-size:9px;color:var(--dim);flex:1;overflow:hidden;white-space:nowrap}
.hi-res{font-family:var(--fnum);font-size:10px;font-weight:600}
.hi-res.win{color:var(--green)}.hi-res.loss{color:var(--red)}

/* ─── NOTIFICATION ─── */
.notif{
  position:fixed;top:64px;right:16px;z-index:999;
  padding:10px 16px;border-radius:3px;border-left:3px solid;
  font-size:13px;font-weight:600;min-width:180px;
  box-shadow:0 8px 32px rgba(0,0,0,.6);animation:notifIn .25s ease;
}
.notif.win{background:#051810;border-color:var(--green);color:var(--green)}
.notif.loss{background:#180510;border-color:var(--red);color:var(--red)}
.notif.info{background:var(--s2);border-color:var(--amber);color:var(--amber)}
@keyframes notifIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

/* ─── LIVE INDICATOR ─── */
.live-dot{
  width:6px;height:6px;border-radius:50%;background:var(--green);
  animation:pulse 1.5s infinite;flex-shrink:0;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
</style>
</head>

<script type="module">
// ══════════════════════════════════════════════
// FIREBASE INIT
// ══════════════════════════════════════════════
import { initializeApp, getApps }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, addDoc,
  collection, onSnapshot, serverTimestamp, runTransaction,
  query, where, orderBy, limit, getDocs, writeBatch, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB = {
  apiKey: "AIzaSyA3KhNSK0AaKYvXuZE9hi0ZRN9Ysmh9aXc",
  authDomain: "zestoreid-f9e85.firebaseapp.com",
  projectId: "zestoreid-f9e85",
  storageBucket: "zestoreid-f9e85.firebasestorage.app",
  messagingSenderId: "426093692154",
  appId: "1:426093692154:web:38c6e9c143af626a623543"
};
const fbApp = getApps().length ? getApps()[0] : initializeApp(FB);
const auth  = getAuth(fbApp);
const db    = getFirestore(fbApp);

// ══════════════════════════════════════════════
// MARKET CONFIG
// ══════════════════════════════════════════════
const MARKETS = {
  bull: {
    id:'bull', name:'INDEX BULLMARKET', short:'BULL', dec:2,
    profit:0.80, base:1875, minP:1480, maxP:2350,
    // Trend cycles [amplitude, period-ticks, phase]
    cycles:[[130,5760,0],[60,1440,1.1],[28,360,2.3],[12,90,0.7]],
    // Noise layers [amplitude, frequency-scale, seed]
    noise:[[50,0.012,1001],[24,0.04,1002],[10,0.13,1003],[4,0.42,1004]],
    drift:0.0012, // Slight upward secular drift per tick
    mrv:0.018,    // Mean reversion coefficient
    regime:{period:864,highMul:1.7,seed:10011},
    corrW:0.30,
  },
  nubia: {
    id:'nubia', name:'INDEX NUBIAMARKET', short:'NUBIA', dec:2,
    profit:0.72, base:488, minP:295, maxP:730,
    cycles:[[65,4320,0.9],[32,900,2.1],[16,216,1.6],[7,60,3.1]],
    noise:[[30,0.015,2001],[16,0.05,2002],[8,0.17,2003],[3,0.55,2004]],
    drift:0.0007, mrv:0.025,
    regime:{period:600,highMul:2.3,seed:20011},
    corrW:0.50,
  },
  zee: {
    id:'zee', name:'INDEX ZEECOIN', short:'ZEE', dec:3,
    profit:0.52, base:148, minP:42, maxP:290,
    cycles:[[55,2880,3.2],[28,576,0.5],[14,120,1.9],[6,30,2.8]],
    noise:[[28,0.018,3001],[16,0.06,3002],[9,0.22,3003],[4,0.70,3004]],
    drift:0.0000, mrv:0.010,
    regime:{period:420,highMul:3.2,seed:30011},
    corrW:0.15,
  }
};

const TF = {
  '5s' :{ lbl:'5S',  sec:5,   ticks:1,   cnt:120 },
  '1m' :{ lbl:'1M',  sec:60,  ticks:12,  cnt:100 },
  '5m' :{ lbl:'5M',  sec:300, ticks:60,  cnt:80  },
  '15m':{ lbl:'15M', sec:900, ticks:180, cnt:60  },
};

// ══════════════════════════════════════════════
// PRICE ENGINE — FULLY DETERMINISTIC
// All clients compute identical prices from tick index.
// No server needed. Firestore stores balances & trades only.
// ══════════════════════════════════════════════
const PE = (() => {
  // Avalanche hash (integer → [0,1))
  function h32(n) {
    n = (n ^ 61) ^ (n >>> 16);
    n += n << 3;
    n ^= n >>> 4;
    n = Math.imul(n, 0x27d4eb2d);
    n ^= n >>> 15;
    return (n >>> 0) / 4294967296;
  }
  function h32s(n, s) { return h32(Math.imul(n, 0x9e3779b1) ^ s); }

  // Smooth 1-D value noise with quintic interpolation
  function vn(x, s) {
    const i = x | 0, f = x - i;
    const u = f*f*f*(f*(f*6-15)+10);
    return (h32s(i,s)*2-1) + u*((h32s(i+1,s)*2-1)-(h32s(i,s)*2-1));
  }

  // Fractal Brownian Motion (6 octaves)
  function fbm(x, s) {
    let v=0, a=0.5, fr=1, nm=0;
    for(let i=0;i<6;i++){v+=vn(x*fr, s+i*997)*a; nm+=a; a*=0.52; fr*=2.07;}
    return v/nm;
  }

  // Shared market noise (drives cross-asset correlation)
  const CORR_SEED = 88881;
  function corrNoise(t) { return fbm(t*0.009, CORR_SEED); }

  // Volatility regime: returns multiplier for given tick
  function regime(t, cfg) {
    const { period, highMul, seed } = cfg;
    const blk = (t/period)|0;
    const isHigh = h32s(blk, seed) > 0.38; // 62% time in high-vol
    const frac = (t % period) / period;
    const prevHigh = h32s(blk-1, seed) > 0.38;
    // Smooth transition at block boundary
    const T = 0.06; // transition width
    if(frac < T) {
      const sm = (frac/T)**3*(frac/T*(frac/T*6-15)+10);
      const pm = prevHigh ? highMul : 1.0;
      const cm = isHigh ? highMul : 1.0;
      return pm + (cm-pm)*sm;
    }
    return isHigh ? highMul : 1.0;
  }

  // ── CORE PRICE FUNCTION ──
  // Completely deterministic from (marketId, tickIndex)
  function price(mid, t) {
    const m = MARKETS[mid];

    // 1. Sum of trend cycles (overlapping sinusoids)
    let trend = 0;
    for(const [A, P, ph] of m.cycles)
      trend += A * Math.sin(2*Math.PI*t/P + ph);

    // 2. Multi-layer fractal noise (slow + fast components)
    let noise = 0;
    for(const [A, sc, sd] of m.noise)
      noise += A * fbm(t*sc, sd);

    // 3. Cross-market correlation
    const corr = corrNoise(t) * 18 * m.corrW;

    // 4. Volatility regime multiplier
    const vol = regime(t, m.regime);

    // 5. Secular drift (very gentle)
    const driftBias = m.drift * t;

    // 6. Mean reversion force
    const raw = m.base + trend + noise * vol + corr * vol;
    const mrForce = -(raw - m.base) * m.mrv;

    // 7. Final price
    let p = m.base + trend + (noise + corr) * vol + mrForce * 0.8 + driftBias;

    return Math.max(m.minP, Math.min(m.maxP, p));
  }

  // Current tick (5-second blocks since epoch)
  function tick() { return (Date.now()/5000)|0; }

  // Sub-tick progress [0,1)
  function subTick() { return (Date.now()%5000)/5000; }

  // Smooth real-time price (cubic interpolation between ticks)
  function livePrice(mid) {
    const t = tick();
    const p  = price(mid, t);
    const p1 = price(mid, t+1);
    const s  = subTick();
    const e  = s<.5 ? 4*s*s*s : 1-(-2*s+2)**3/2; // ease in-out cubic
    return p + (p1-p)*e;
  }

  // OHLC candle for a given candle-start-tick and width
  function candle(mid, startT, numTicks) {
    const SAMPLES = Math.min(numTicks, 24);
    let o = price(mid, startT);
    let c = price(mid, startT+numTicks-1);
    let h = -Infinity, lo = Infinity;
    for(let i=0;i<SAMPLES;i++){
      const p = price(mid, startT + Math.floor(i*(numTicks-1)/(SAMPLES-1)));
      if(p>h)h=p; if(p<lo)lo=p;
    }
    h = Math.max(h,o,c); lo = Math.min(lo,o,c);
    return {o,h,lo,c};
  }

  return { price, tick, subTick, livePrice, candle };
})();

// ══════════════════════════════════════════════
// CHART RENDERER (Canvas)
// ══════════════════════════════════════════════
const CR = (() => {
  let cv, cx, W, H;
  const PAD = {t:18,r:68,b:36,l:8};
  let mx=-1, my=-1;
  let tradeMarkers = [];

  const C = {
    bg:'#040810', grid:'#0a1220', gline:'rgba(24,42,64,.6)',
    up:'#00e87a', dn:'#ff2255', upDim:'rgba(0,232,122,.12)',
    dnDim:'rgba(255,34,85,.15)', wick:'#006835', wickDn:'#cc1040',
    line:'#1e90ff', lineFill:'rgba(30,144,255,.07)',
    pxLine:'#ffaa00', lbl:'rgba(30,80,130,.8)', lbl2:'#2a5070',
    xh:'rgba(180,210,255,.07)', mUp:'#00e87a', mDn:'#ff2255',
  };

  function init(el) {
    cv=el; cx=cv.getContext('2d');
    cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
    cv.addEventListener('mouseleave',()=>{mx=-1;my=-1;});
    resize();
  }
  function resize() {
    const p=cv.parentElement, dpr=devicePixelRatio||1;
    W=p.clientWidth; H=p.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    cx.scale(dpr,dpr);
  }
  function setMarkers(trades, mid) {
    tradeMarkers = trades.filter(t=>t.market===mid&&t.status==='active').map(t=>({p:t.openPrice,d:t.direction}));
  }

  function render(data, tf, curP) {
    if(!cx||!data||data.length<2) return;
    cx.clearRect(0,0,W,H);
    cx.fillStyle=C.bg; cx.fillRect(0,0,W,H);

    // Price range
    let mn=Infinity, mx2=-Infinity;
    for(const d of data) {
      if(tf==='5s'){if(d.p<mn)mn=d.p;if(d.p>mx2)mx2=d.p;}
      else{if(d.lo<mn)mn=d.lo;if(d.h>mx2)mx2=d.h;}
    }
    const rng = mx2-mn||1;
    mn -= rng*0.10; mx2 += rng*0.10;

    const cW = W-PAD.l-PAD.r;
    const cH = H-PAD.t-PAD.b;
    const y = p => PAD.t + cH*(1-(p-mn)/(mx2-mn));
    const xLine = i => PAD.l + (i/(data.length-1))*cW;
    const xCandle = i => PAD.l + (i+.5)/data.length*cW;
    const cW2 = Math.max(2, cW/data.length*.72);

    // Grid lines (price)
    const step = niceStep(rng/6);
    const gs = Math.ceil(mn/step)*step;
    cx.font = '9px JetBrains Mono,monospace';
    cx.textBaseline='middle'; cx.textAlign='left';
    for(let p=gs; p<=mx2+step; p+=step) {
      const yp = y(p);
      if(yp<PAD.t-2||yp>H-PAD.b+2) continue;
      cx.strokeStyle=C.gline; cx.lineWidth=1; cx.setLineDash([]);
      cx.beginPath(); cx.moveTo(PAD.l,yp); cx.lineTo(W-PAD.r,yp); cx.stroke();
      cx.fillStyle=C.lbl2; cx.fillText(p.toFixed(2), W-PAD.r+5, yp);
    }

    // Grid lines (time)
    const tStep = Math.max(1, Math.floor(data.length/5));
    cx.fillStyle=C.lbl; cx.textAlign='center'; cx.textBaseline='top';
    for(let i=0;i<data.length;i+=tStep) {
      const xp = tf==='5s'?xLine(i):xCandle(i);
      cx.strokeStyle=C.gline; cx.lineWidth=1; cx.setLineDash([]);
      cx.beginPath(); cx.moveTo(xp,PAD.t); cx.lineTo(xp,H-PAD.b); cx.stroke();
      cx.fillText(fmtTime(data[i].time||new Date(),tf), xp, H-PAD.b+6);
    }

    // ── Data ──
    if(tf==='5s') {
      // Gradient fill
      const grd = cx.createLinearGradient(0,PAD.t,0,H-PAD.b);
      grd.addColorStop(0,'rgba(30,144,255,.12)'); grd.addColorStop(1,'rgba(30,144,255,0)');
      cx.beginPath(); cx.moveTo(xLine(0),y(data[0].p));
      for(let i=1;i<data.length;i++) cx.lineTo(xLine(i),y(data[i].p));
      cx.lineTo(xLine(data.length-1),H-PAD.b); cx.lineTo(xLine(0),H-PAD.b); cx.closePath();
      cx.fillStyle=grd; cx.fill();
      // Line
      cx.beginPath(); cx.moveTo(xLine(0),y(data[0].p));
      for(let i=1;i<data.length;i++) cx.lineTo(xLine(i),y(data[i].p));
      cx.strokeStyle=C.line; cx.lineWidth=1.5; cx.setLineDash([]); cx.stroke();
      // Live dot
      const lx=xLine(data.length-1), ly=y(data[data.length-1].p);
      cx.beginPath(); cx.arc(lx,ly,3,0,Math.PI*2);
      cx.fillStyle=C.line; cx.fill();
    } else {
      for(let i=0;i<data.length;i++) {
        const d=data[i];
        const xp=xCandle(i);
        const up = d.c>=d.o;
        const col = up?C.up:C.dn, colDim=up?C.upDim:C.dnDim;
        const oy=y(d.o), cy2=y(d.c), hy=y(d.h), loy=y(d.lo);
        const bT=Math.min(oy,cy2), bH=Math.max(1,Math.abs(cy2-oy));
        // Wick
        cx.strokeStyle=up?C.wick:C.wickDn; cx.lineWidth=1; cx.setLineDash([]);
        cx.beginPath(); cx.moveTo(xp,hy); cx.lineTo(xp,loy); cx.stroke();
        // Body
        cx.fillStyle=colDim; cx.fillRect(xp-cW2/2,bT,cW2,bH);
        cx.strokeStyle=col; cx.lineWidth=d.isCur?1.8:1; cx.strokeRect(xp-cW2/2,bT,cW2,bH);
      }
    }

    // Trade entry lines
    for(const m of tradeMarkers) {
      const yp=y(m.p); if(yp<PAD.t||yp>H-PAD.b) continue;
      cx.strokeStyle=m.d==='up'?C.mUp:C.mDn;
      cx.lineWidth=1; cx.setLineDash([4,4]);
      cx.beginPath(); cx.moveTo(PAD.l,yp); cx.lineTo(W-PAD.r-2,yp); cx.stroke();
      cx.setLineDash([]);
      cx.fillStyle=m.d==='up'?C.mUp:C.mDn;
      cx.font='8px Barlow Condensed,sans-serif'; cx.textAlign='right';
      cx.fillText('ENTRY',W-PAD.r-4,yp-3);
    }

    // Current price line
    const py = y(curP);
    if(py>=PAD.t&&py<=H-PAD.b) {
      cx.strokeStyle=C.pxLine; cx.lineWidth=1; cx.setLineDash([3,5]);
      cx.beginPath(); cx.moveTo(PAD.l,py); cx.lineTo(W-PAD.r,py); cx.stroke();
      cx.setLineDash([]);
      cx.fillStyle=C.pxLine;
      cx.fillRect(W-PAD.r+2,py-9,64,18);
      cx.fillStyle='#000'; cx.font='10px JetBrains Mono,monospace';
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.fillText(curP.toFixed(2),W-PAD.r+34,py);
    }

    // Crosshair
    if(mx>=PAD.l&&mx<=W-PAD.r&&my>=PAD.t&&my<=H-PAD.b) {
      cx.strokeStyle=C.xh; cx.lineWidth=1; cx.setLineDash([]);
      cx.beginPath(); cx.moveTo(mx,PAD.t); cx.lineTo(mx,H-PAD.b); cx.stroke();
      cx.beginPath(); cx.moveTo(PAD.l,my); cx.lineTo(W-PAD.r,my); cx.stroke();
      const cp = mn+((H-PAD.b-my)/cH)*(mx2-mn);
      cx.fillStyle='rgba(10,18,32,.9)';
      cx.fillRect(W-PAD.r+2,my-9,64,18);
      cx.fillStyle=C.lbl2; cx.font='9px JetBrains Mono,monospace';
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.fillText(cp.toFixed(2),W-PAD.r+34,my);
    }
  }

  function niceStep(r) {
    const m = 10**Math.floor(Math.log10(r));
    const s = r/m;
    return m*(s<1.5?1:s<3.5?2:s<7.5?5:10);
  }
  function fmtTime(d, tf) {
    const H=String(d.getHours()).padStart(2,'0');
    const M=String(d.getMinutes()).padStart(2,'0');
    const S=String(d.getSeconds()).padStart(2,'0');
    return tf==='5s'?`${H}:${M}:${S}`:`${H}:${M}`;
  }

  return {init, resize, render, setMarkers};
})();

// APP STATE
// ══════════════════════════════════════════════
const ST = {
  user: null,
  balance: 0,
  mkt: 'bull',
  tf: '5s',
  active: [],
  history: [],
  wins: 0,
  losses: 0,
  prevPrices: {bull:0,nubia:0,zee:0},
  unsubs: [],
  raf: null,
  isWriter: false,
  writerTimer: null,
  lastSyncTick: -1,
};

// ══════════════════════════════════════════════
// FIRESTORE — WRITER ELECTION
// One client writes live prices to Firestore every 15s.
// Others just read. Prices are also computed locally
// (deterministic engine) for smooth real-time display.
// ══════════════════════════════════════════════
async function electWriter() {
  if(!ST.user) return;
  try {
    const ref = doc(db,'sync','writer');
    await runTransaction(db, async tx => {
      const s = await tx.get(ref);
      const now = Date.now();
      if(!s.exists() || s.data().exp < now || s.data().uid===ST.user.uid) {
        tx.set(ref,{uid:ST.user.uid, exp:now+25000});
        ST.isWriter = true;
      }
    });
  } catch(e) { ST.isWriter = false; }
}

async function releaseWriter() {
  if(!ST.isWriter||!ST.user) return;
  try { await setDoc(doc(db,'sync','writer'),{uid:'',exp:0}); } catch(e){}
  ST.isWriter = false;
}

// Writer stores live price snapshot so new clients sync fast
async function writerSync() {
  if(!ST.isWriter) return;
  const t = PE.tick();
  if(t === ST.lastSyncTick) return;
  ST.lastSyncTick = t;
  try {
    const batch = writeBatch(db);
    for(const mid of Object.keys(MARKETS)) {
      const p = PE.price(mid, t);
      batch.set(doc(db,'markets',mid), {
        p, t, ts: serverTimestamp(),
      });
    }
    await batch.commit();
  } catch(e) {}
}

// ══════════════════════════════════════════════
// USER / BALANCE
// ══════════════════════════════════════════════
async function ensureUser() {
  const ref = doc(db,'users',ST.user.uid);
  const snap = await getDoc(ref);
  if(!snap.exists()) {
    await setDoc(ref,{balance:100, uid:ST.user.uid, email:ST.user.email||'', createdAt:serverTimestamp()});
    ST.balance = 100;
  } else {
    ST.balance = snap.data().balance ?? 0;
  }
  updateBalUI();
}

function subBalance() {
  const ref = doc(db,'users',ST.user.uid);
  const unsub = onSnapshot(ref, snap => {
    if(snap.exists()) {
      ST.balance = snap.data().balance ?? 0;
      updateBalUI();
    }
  });
  ST.unsubs.push(unsub);
}

// ══════════════════════════════════════════════
// LOAD PRIOR ACTIVE TRADES ON LOGIN
// ══════════════════════════════════════════════
async function loadActiveTrades() {
  try {
    const q = query(collection(db,'trades'), where('uid','==',ST.user.uid), where('status','==','active'));
    const snap = await getDocs(q);
    const now = PE.tick();
    for(const d of snap.docs) {
      const tr = {id:d.id,...d.data()};
      if(tr.closeTick <= now) {
        // Expired while offline — resolve
        await resolveTrade(tr.id, tr);
      } else {
        ST.active.push(tr);
        const ms = (tr.closeTick - now)*5000 - PE.subTick()*5000;
        setTimeout(()=>resolveTrade(tr.id), Math.max(0,ms));
      }
    }
    renderActive();
  } catch(e) {}
}

async function loadHistory() {
  try {
    const q = query(
      collection(db,'trades'),
      where('uid','==',ST.user.uid),
      orderBy('timestamp','desc'),
      limit(30)
    );
    const snap = await getDocs(q);
    ST.history = snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.status!=='active');
    ST.wins   = ST.history.filter(t=>t.status==='win').length;
    ST.losses = ST.history.filter(t=>t.status==='loss').length;
    renderHistory();
    updateWR();
  } catch(e) {}
}

// ══════════════════════════════════════════════
// TRADE ENGINE
// ══════════════════════════════════════════════
async function placeTrade(dir) {
  if(!ST.user) return;
  const amt = parseInt(document.getElementById('betAmt').value)||0;
  if(amt<=0)  return notify('Enter a valid amount','info');
  if(amt>ST.balance) return notify('Insufficient NubiaCoins','info');

  const m   = MARKETS[ST.mkt];
  const tf  = TF[ST.tf];
  const t   = PE.tick();
  const op  = PE.livePrice(ST.mkt);
  const closeTick = t + tf.ticks;
  const profit = Math.floor(amt * m.profit);

  // Atomic deduct
  const uRef = doc(db,'users',ST.user.uid);
  try {
    await runTransaction(db, async tx => {
      const s = await tx.get(uRef);
      if(!s.exists()) throw new Error('User not found');
      if((s.data().balance??0) < amt) throw new Error('Insufficient balance');
      tx.update(uRef,{balance:increment(-amt)});
    });
  } catch(e) { return notify(e.message||'Trade failed','info'); }

  // Record trade
  let tid;
  try {
    const ref = await addDoc(collection(db,'trades'),{
      uid:ST.user.uid, market:ST.mkt, direction:dir,
      amount:amt, profit, openPrice:op, openTick:t,
      closeTick, timeframe:ST.tf, tickDuration:tf.ticks,
      status:'active', timestamp:serverTimestamp()
    });
    tid = ref.id;
  } catch(e) {
    await updateDoc(uRef,{balance:increment(amt)});
    return notify('Failed to place trade','info');
  }

  const tr = {id:tid, market:ST.mkt, direction:dir, amount:amt, profit,
              openPrice:op, openTick:t, closeTick, timeframe:ST.tf, tickDuration:tf.ticks, status:'active'};
  ST.active.push(tr);
  renderActive();
  updatePayUI();

  const delayMs = (closeTick-t)*5000 - PE.subTick()*5000;
  setTimeout(()=>resolveTrade(tid), Math.max(100, delayMs));
}

async function resolveTrade(tid, trPreload=null) {
  let tr = trPreload || ST.active.find(t=>t.id===tid);
  if(!tr) {
    // Try from Firestore
    try {
      const s = await getDoc(doc(db,'trades',tid));
      if(s.exists()) tr={id:s.id,...s.data()};
      else return;
    } catch(e) { return; }
  }

  if(tr.status && tr.status!=='active') return; // Already resolved

  const cp  = PE.price(tr.market, tr.closeTick);
  const win = tr.direction==='up' ? cp>tr.openPrice : cp<tr.openPrice;
  const status = Math.abs(cp-tr.openPrice)<0.001 ? 'loss' : (win?'win':'loss');

  const uRef  = doc(db,'users',ST.user.uid||tr.uid);
  const tRef  = doc(db,'trades',tid);
  const batch = writeBatch(db);
  batch.update(tRef,{status,closePrice:cp,resolvedAt:serverTimestamp()});
  if(status==='win') batch.update(uRef,{balance:increment(tr.amount+tr.profit)});
  await batch.commit().catch(()=>{});

  const idx = ST.active.findIndex(t=>t.id===tid);
  if(idx>=0) ST.active.splice(idx,1);

  const final = {...tr, status, closePrice:cp};
  ST.history.unshift(final);
  if(ST.history.length>30) ST.history.pop();
  if(status==='win'){ST.wins++; notify(`✓ WIN  +${tr.profit} NC`,'win');}
  else              {ST.losses++; notify(`✗ LOSS  −${tr.amount} NC`,'loss');}

  renderActive(); renderHistory(); updateWR();
}

// ══════════════════════════════════════════════
// BUILD CHART DATA
// ══════════════════════════════════════════════
function buildData(mid, tfKey) {
  const tf = TF[tfKey];
  const cur = PE.tick();
  const items = [];

  if(tfKey==='5s') {
    for(let i=tf.cnt-1;i>=0;i--) {
      const t=cur-i;
      items.push({t, p:PE.price(mid,t), time:new Date(t*5000)});
    }
    // Smooth last point to live interpolated price
    items[items.length-1].p = PE.livePrice(mid);
  } else {
    const nc = tf.ticks;
    const cs = Math.floor(cur/nc)*nc;
    for(let i=tf.cnt-1;i>=0;i--) {
      const st = cs - i*nc;
      const {o,h,lo,c} = PE.candle(mid,st,nc);
      items.push({o,h,lo,c,time:new Date(st*5000),isCur:i===0});
    }
    // Live close on current candle
    const last = items[items.length-1];
    last.c = PE.livePrice(mid);
    last.h = Math.max(last.h,last.c);
    last.lo= Math.min(last.lo,last.c);
  }
  return items;
}

// UI UPDATES
// ══════════════════════════════════════════════
function updateBalUI() {
  document.getElementById('balDisp').textContent = ST.balance.toLocaleString();
}
function updatePriceUI(mid, p, prev) {
  if(mid!==ST.mkt) return;
  const m=MARKETS[mid];
  const el = document.getElementById('mktPrice');
  el.textContent = p.toFixed(m.dec);
  el.className = 'mkt-price '+(p>prev?'up':p<prev?'down':'');

  const t2=PE.tick(), p2=PE.price(mid,t2-24), ch=(p-p2)/p2*100;
  const b=document.getElementById('chgBadge');
  b.textContent = (ch>=0?'+':'')+ch.toFixed(2)+'%';
  b.className='chg-badge '+(ch>=0?'up':'down');

  const tf=TF[ST.tf], cs=Math.floor(t2/tf.ticks)*tf.ticks;
  const {o,h,lo} = PE.candle(mid,cs,tf.ticks);
  document.getElementById('stH').textContent = h.toFixed(2);
  document.getElementById('stL').textContent = lo.toFixed(2);
  document.getElementById('stO').textContent = o.toFixed(2);
}
function updateTabPrices() {
  for(const [id,m] of Object.entries(MARKETS)) {
    const el = document.querySelector(`.mkt-tab[data-m="${id}"] .tp`);
    if(el) el.textContent = PE.livePrice(id).toFixed(m.dec);
  }
}
function updatePayUI() {
  const amt = parseInt(document.getElementById('betAmt').value)||0;
  const pft = Math.floor(amt*MARKETS[ST.mkt].profit);
  document.getElementById('pyDisp').textContent = `+${pft} NC`;
}
function updateMarketMeta() {
  const m=MARKETS[ST.mkt];
  document.getElementById('mktFname').textContent = m.name;
  document.getElementById('profitBadge').textContent = `PROFIT ${m.profit*100}%`;
}
function updateWR() {
  const tot=ST.wins+ST.losses;
  if(!tot) return;
  document.getElementById('wrDisplay').textContent = `${Math.round(ST.wins/tot*100)}% WIN`;
}

function renderActive() {
  const c=document.getElementById('activeList');
  if(!ST.active.length){c.innerHTML='<div class="no-trades">No open positions</div>';return;}
  c.innerHTML='';
  const now=PE.tick();
  for(const tr of ST.active) {
    const rem  = Math.max(0,(tr.closeTick-now)*5 - PE.subTick()*5);
    const prog = Math.min(1,(now-tr.openTick)/tr.tickDuration);
    const m=String(Math.floor(rem/60)).padStart(2,'0');
    const s=String(Math.floor(rem%60)).padStart(2,'0');
    const d=document.createElement('div');
    d.className=`tcard ${tr.direction}`; d.id=`tc-${tr.id}`;
    d.innerHTML=`
      <div class="tc-top">
        <span class="tc-dir ${tr.direction}">${tr.direction.toUpperCase()} · ${tr.timeframe}</span>
        <span class="tc-timer" id="tm-${tr.id}">${m}:${s}</span>
      </div>
      <div class="tc-row">
        <span class="tc-amt">${tr.amount} NC bet</span>
        <span class="tc-pft">+${tr.profit} NC profit</span>
      </div>
      <div class="tc-ep">ENTRY @ ${tr.openPrice.toFixed(MARKETS[tr.market].dec)}</div>
      <div class="tc-prog"><div class="tc-progbar ${tr.direction}" id="pb-${tr.id}" style="width:${prog*100}%"></div></div>
    `;
    c.appendChild(d);
  }
}

function tickTimers() {
  const now=PE.tick();
  for(const tr of ST.active) {
    const rem  = Math.max(0,(tr.closeTick-now)*5 - PE.subTick()*5);
    const prog = Math.min(1,(now-tr.openTick)/tr.tickDuration);
    const te = document.getElementById(`tm-${tr.id}`);
    const pb = document.getElementById(`pb-${tr.id}`);
    if(te){const m=String(Math.floor(rem/60)).padStart(2,'0');const s=String(Math.floor(rem%60)).padStart(2,'0');te.textContent=`${m}:${s}`;}
    if(pb) pb.style.width=(prog*100)+'%';
    if(now>=tr.closeTick) resolveTrade(tr.id);
  }
}

function renderHistory() {
  const list=document.getElementById('histList');
  list.innerHTML='';
  for(const tr of ST.history.slice(0,12)) {
    const el=document.createElement('div'); el.className='hitem';
    const win=tr.status==='win';
    el.innerHTML=`
      <span class="hi-dir ${tr.direction}">${tr.direction.toUpperCase()}</span>
      <span class="hi-mkt">${MARKETS[tr.market]?.short||tr.market} ${tr.timeframe}</span>
      <span class="hi-res ${tr.status}">${win?'+'+tr.profit:'-'+tr.amount} NC</span>
    `;
    list.appendChild(el);
  }
}

function notify(msg, type='info') {
  document.querySelectorAll('.notif').forEach(e=>e.remove());
  const el=document.createElement('div'); el.className=`notif ${type}`; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300);},2800);
}

// ══════════════════════════════════════════════
// RENDER LOOP
// ══════════════════════════════════════════════
let lastTick=-1;
function loop() {
  const t = PE.tick();
  const lp = PE.livePrice(ST.mkt);
  const prev = ST.prevPrices[ST.mkt];
  ST.prevPrices[ST.mkt] = lp;
  updatePriceUI(ST.mkt,lp,prev);

  if(t!==lastTick) {
    lastTick=t;
    updateTabPrices();
    tickTimers();
  }

  const data = buildData(ST.mkt, ST.tf);
  CR.setMarkers(ST.active, ST.mkt);
  CR.render(data, ST.tf, lp);
  ST.raf = requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════
// UI INIT
// ══════════════════════════════════════════════
function buildUI() {
  // Market tabs
  const tc=document.getElementById('mktTabs');
  for(const [id,m] of Object.entries(MARKETS)) {
    const b=document.createElement('button');
    b.className=`mkt-tab ${id===ST.mkt?'active':''}`;
    b.dataset.m=id;
    b.innerHTML=`${m.short}<span class="tp">—</span>`;
    b.addEventListener('click',()=>{
      ST.mkt=id;
      document.querySelectorAll('.mkt-tab').forEach(x=>x.classList.toggle('active',x.dataset.m===id));
      updateMarketMeta(); updatePayUI();
    });
    tc.appendChild(b);
  }

  // TF buttons
  const tfc=document.getElementById('tfBtns');
  for(const [k,tf] of Object.entries(TF)) {
    const b=document.createElement('button');
    b.className=`tf-btn ${k===ST.tf?'active':''}`;
    b.textContent=tf.lbl; b.dataset.tf=k;
    b.addEventListener('click',()=>{
      ST.tf=k;
      document.querySelectorAll('.tf-btn').forEach(x=>x.classList.toggle('active',x.dataset.tf===k));
    });
    tfc.appendChild(b);
  }

  // Quick amounts
  document.querySelectorAll('.qa').forEach(b=>b.addEventListener('click',()=>{
    document.getElementById('betAmt').value=b.dataset.a; updatePayUI();
  }));
  document.getElementById('betAmt').addEventListener('input',updatePayUI);

  // Trade buttons
  document.getElementById('btnUp').addEventListener('click',()=>placeTrade('up'));
  document.getElementById('btnDn').addEventListener('click',()=>placeTrade('down'));

  // Logout
  document.getElementById('btnOut').addEventListener('click',async()=>{
    await releaseWriter(); await signOut(auth);
  });

  updateMarketMeta(); updatePayUI();
}

// ══════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════
onAuthStateChanged(auth, async user => {
  const ov=document.getElementById('loginOverlay');
  const ap=document.getElementById('app');

  if(user) {
    ST.user=user;
    ov.style.display='none';
    ap.style.display='flex';
    ap.style.flexDirection='column';
    document.getElementById('userEm').textContent=user.email||user.displayName||'User';

    await ensureUser();
    subBalance();
    buildUI();
    CR.init(document.getElementById('chartCanvas'));
    window.addEventListener('resize',()=>CR.resize());
    updatePayUI();

    await loadActiveTrades();
    await loadHistory();
    loop();

    // Writer election & periodic sync (15s)
    await electWriter();
    if(ST.isWriter) await writerSync();

    ST.writerTimer = setInterval(async()=>{
      await electWriter();
      await writerSync();
    }, 15000);

    window.addEventListener('beforeunload',()=>{
      releaseWriter();
      if(ST.raf) cancelAnimationFrame(ST.raf);
      if(ST.writerTimer) clearInterval(ST.writerTimer);
      ST.unsubs.forEach(u=>u());
    });

  } else {
    // Not logged in
    ov.style.display='flex'; ap.style.display='none';
    ov.innerHTML=`
      <div class="brand-xl">NUBIA<span>TRADE</span></div>
      <div class="login-sub">BINARY OPTIONS PLATFORM</div>
      <div class="login-msg">You must be logged in to trade.</div>
      <div style="color:var(--dim);font-size:11px;letter-spacing:1px;margin-top:4px">Powered by NubiaCoins</div>
    `;
    if(ST.raf) cancelAnimationFrame(ST.raf);
    if(ST.writerTimer) clearInterval(ST.writerTimer);
    ST.unsubs.forEach(u=>u()); ST.unsubs=[];
    ST.active=[]; ST.isWriter=false;
  }
});
</script>
